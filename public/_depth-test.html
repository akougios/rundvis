<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Depth estimation test 2</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
  #log { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); padding: 8px; font-size: 12px; white-space: pre-wrap; max-height: 45vh; overflow: auto; z-index: 10; }
  .row { display: flex; gap: 8px; margin-top: 46vh; padding: 8px; }
  canvas, img { max-width: 45vw; border: 1px solid #444; }
</style>
</head>
<body>
<div id="log">booting…</div>
<div class="row">
  <canvas id="srcCanvas"></canvas>
  <canvas id="depthCanvas"></canvas>
</div>

<script type="module">
const logEl = document.getElementById("log");
function log(msg) {
  console.log(msg);
  logEl.textContent += "\n" + msg;
}

// Draw a simple synthetic "room-like" test photo directly with canvas 2D
// primitives, so there's no external network fetch involved at all - this
// mirrors how the real app already has photos as in-memory data URLs from
// the user's own upload, not remote URLs.
function makeRoomPhoto() {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 384;
  const ctx = c.getContext("2d");
  // floor
  ctx.fillStyle = "#a08060";
  ctx.fillRect(0, 260, 512, 124);
  // back wall
  ctx.fillStyle = "#e8e2d5";
  ctx.fillRect(0, 0, 512, 260);
  // window (far wall, should read as "far")
  ctx.fillStyle = "#88aacc";
  ctx.fillRect(340, 60, 140, 160);
  // a "table" silhouette in the foreground (should read as "near")
  ctx.fillStyle = "#3a2a1a";
  ctx.fillRect(60, 200, 180, 90);
  return c;
}

async function run() {
  const t0 = performance.now();
  log("starting transformers.js import…");
  let pipeline;
  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5");
    pipeline = mod.pipeline;
    log("import OK in " + Math.round(performance.now() - t0) + "ms, pipeline=" + typeof pipeline);
  } catch (err) {
    log("IMPORT ERROR: " + err.message);
    return;
  }

  try {
    const photo = makeRoomPhoto();
    document.getElementById("srcCanvas").width = photo.width;
    document.getElementById("srcCanvas").height = photo.height;
    document.getElementById("srcCanvas").getContext("2d").drawImage(photo, 0, 0);
    const dataUrl = photo.toDataURL("image/png");
    log("built local test photo as data URL, length=" + dataUrl.length);

    log("loading depth-estimation model (onnx-community/depth-anything-v2-small, q8)…");
    const t1 = performance.now();
    const estimator = await pipeline("depth-estimation", "onnx-community/depth-anything-v2-small", { dtype: "q8" });
    log("model loaded in " + Math.round(performance.now() - t1) + "ms");

    const t2 = performance.now();
    const output = await estimator(dataUrl);
    log("depth estimation done in " + Math.round(performance.now() - t2) + "ms");
    log("output keys: " + Object.keys(output).join(", "));

    if (output.depth) {
      const depthImg = output.depth;
      log("depth object keys: " + Object.keys(depthImg).join(", "));
      let depthCanvas;
      if (typeof depthImg.toCanvas === "function") {
        depthCanvas = depthImg.toCanvas();
      }
      if (depthCanvas) {
        log("depth canvas size " + depthCanvas.width + "x" + depthCanvas.height + " (source was " + photo.width + "x" + photo.height + ")");
        const target = document.getElementById("depthCanvas");
        target.width = depthCanvas.width;
        target.height = depthCanvas.height;
        target.getContext("2d").drawImage(depthCanvas, 0, 0);
        log("SUCCESS: depth map drawn to canvas.");
      } else {
        log("no toCanvas() available; raw dims=" + JSON.stringify(depthImg.dims || depthImg.size));
      }
    } else {
      log("no output.depth field - full output: " + JSON.stringify(Object.keys(output)));
    }
  } catch (err) {
    log("ERROR: " + err.message + "\n" + (err.stack || ""));
  }
}

run();
</script>
</body>
</html>

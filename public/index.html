<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rundvis — AI boligvideo prototype</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body, #root { height: 100%; }
  body { margin: 0; background: #15191C; font-family: 'IBM Plex Sans', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #2C3237; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  .kb-img { will-change: transform; transform-origin: center center; filter: saturate(1.08) contrast(1.04); }
  .kb-fade { opacity: 0; transition: opacity 550ms ease; }
  .kb-fade.kb-fade-in { opacity: 1; }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%); }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .kb-img { transform: none !important; }
  }
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

const INK = "#15191C", SURFACE = "#1D2226", SURFACE_2 = "#242A2E", TEXT = "#F2EFE7",
  MUTED = "#98A0A6", ACCENT = "#3860E8", ACCENT_SOFT = "#293B72", AMBER = "#E3A33D", LINE = "#2C3237";

const PROPERTY_TYPES = [
  { id: "villa", label: "Villa", hint: "Roligt tempo, fokus på rum og lys" },
  { id: "sommerhus", label: "Sommerhus", hint: "Udeliv, terrasse, udsigt" },
  { id: "liebhaver", label: "Liebhaverbolig", hint: "Langsomt, cinematisk, detaljer" },
  { id: "nyhed", label: "Nyhed på markedet", hint: "Energisk tempo, skaber interesse" },
  { id: "prisnedsaettelse", label: "Prisnedsættelse", hint: "Tydeligt fokus på ny pris" },
  { id: "aabenthus", label: "Åbent hus", hint: "Dato og tidspunkt fremhævet" },
];
const STEPS = [{ id: 1, label: "Boligtype" }, { id: 2, label: "Billeder" }, { id: 3, label: "Manuskript" }, { id: 4, label: "Afspil" }];
const FALLBACK_SCENE_MS = 6000;

function seededRandom(seed) {
  const s = Math.sin(seed) * 10000;
  return s - Math.floor(s);
}
function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

// Deterministic per-scene camera-move: a mix of zoom in/out and a pan direction,
// varied by index so consecutive scenes don't all move the same way.
function kenBurnsParamsFor(index) {
  const r1 = seededRandom(index * 12.9898 + 3.7);
  const r2 = seededRandom(index * 78.233 + 1.3);
  const r3 = seededRandom(index * 37.719 + 2.1);
  const r4 = seededRandom(index * 5.234 + 4.9);
  const zoomIn = r1 > 0.5;
  const scaleAmt = 1.08 + r2 * 0.09; // 1.08 - 1.17
  const panX = (r3 - 0.5) * 7; // -3.5% .. 3.5%
  const panY = (r4 - 0.5) * 5; // -2.5% .. 2.5%
  return {
    scaleFrom: zoomIn ? 1.02 : scaleAmt,
    scaleTo: zoomIn ? scaleAmt : 1.02,
    panX, panY,
  };
}
function applyKenBurns(el, params, t) {
  if (!el) return;
  const e = easeInOutSine(Math.max(0, Math.min(1, t)));
  const scale = params.scaleFrom + (params.scaleTo - params.scaleFrom) * e;
  const tx = -params.panX / 2 + params.panX * e;
  const ty = -params.panY / 2 + params.panY * e;
  el.style.transform = `scale(${scale.toFixed(4)}) translate(${tx.toFixed(2)}%, ${ty.toFixed(2)}%)`;
}

// ---- Depth-based 3D parallax ("3D Ken Burns"): a deterministic, non-generative technique.
// Instead of asking an AI video model to imagine camera motion (which can't be made to always
// move the same reliable direction - see README history), we estimate a real per-pixel depth map
// for each uploaded photo directly in the browser (no server, no per-generation AI cost, no
// randomness) and move a virtual camera through the resulting 3D mesh along a fixed, chosen path.
// The same photo always produces the exact same depth map and therefore the exact same move.

// Runs a dynamic import() from inside a Babel-transformed script without Babel's parser ever
// seeing the `import(...)` token (which the default Babel-standalone preset can't parse) - the
// browser's own engine parses the string body of the Function constructor at call time instead.
const dynamicImport = (url) => new Function("u", "return import(u)")(url);

let depthEstimatorPromise = null;
function getDepthEstimator() {
  if (!depthEstimatorPromise) {
    depthEstimatorPromise = dynamicImport("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5")
      .then((mod) => mod.pipeline("depth-estimation", "onnx-community/depth-anything-v2-small", { dtype: "q8" }));
  }
  return depthEstimatorPromise;
}

// Estimates depth for a single data-URL photo and returns a same-size grayscale
// canvas (bright = near the camera, dark = far).
async function estimateDepthCanvas(dataUrl) {
  const estimator = await getDepthEstimator();
  const output = await estimator(dataUrl);
  return output.depth.toCanvas();
}

// ---- Shared parallax engine -------------------------------------------------------------
// Everything below is used by BOTH the live preview (FlythroughStage) and the file export
// (exportFlythroughVideo), so the downloaded video is frame-for-frame what was previewed.

const PX_FOV = 70;        // wide, like the 16-24mm lenses listing photos are actually shot on.
                          // At the old 50 degrees a translating camera barely changes perspective.
const PX_SAFETY = 1.28;   // how much closer than "exactly covering the photo" the camera sits.
                          // This crop is what buys room to move at all - with no margin the
                          // camera can only ever slide along one axis.
const PX_MAX_DISP = 0.28; // depth displacement, in plane-height units. With PX_SAFETY this puts
                          // the far surface roughly twice as far from the camera as the near one,
                          // so foreground and background genuinely separate. (The old values gave
                          // a far/near ratio of about 1.19 - i.e. almost none.)
const PX_MAX_STEP = 0.07;  // max normalised depth change per vertex pair (see limitDepthGradient).
                           // Measured on a synthetic wall/window edge: this turns a hard jump into
                           // a ramp ~3.8% of the image wide. Tighter (0.03) spreads it over 6.6%
                           // and starts flattening the room; looser (0.10) narrows it to 2.4% and
                           // the stretching becomes visible again.
const PX_NEAR_DISP = 0.30; // disparity floor for the 1/x depth conversion (see buildParallaxScene)

function clamp01(t) { return Math.max(0, Math.min(1, t)); }

// Three speed curves, picked per shot by where its cut falls (see buildEditPlan). None of them
// decelerate to a standstill: a clip that parks before the cut is the single clearest giveaway
// of a slideshow, and the old easeInOutSine did exactly that at BOTH ends.
//   glide  - gentle start, still moving at full speed when a dissolve begins
//   ramp   - accelerates into a hard cut, so the cut lands on motion (the "speed ramp" look)
//   settle - leaves a hard cut already at speed, then eases off
// Each is a blend of a linear term and a shaped one. The linear part is the point: a pure
// power curve has zero velocity at one end, so a shot built on one comes to a dead stop either
// just before its cut or just after it. Blended, the camera is never slower than ~0.35x its
// average - it always reads as moving, even at the very edges of a clip.
const SHOT_EASES = {
  glide: (t) => 0.65 * t + 0.35 * Math.pow(t, 1.8),
  ramp: (t) => 0.35 * t + 0.65 * Math.pow(t, 2.2),
  settle: (t) => 0.55 * t + 0.45 * (1 - Math.pow(1 - t, 2)),
};
function easeShot(t, kind) { return (SHOT_EASES[kind] || SHOT_EASES.glide)(clamp01(t)); }

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error("Kunne ikke indlæse billedet."));
    i.src = src;
  });
}

// Samples the depth map with a 3x3 median. Unlike a blur this removes the model's speckle
// WITHOUT rounding off depth edges, which is what keeps doorframes and furniture edges crisp
// instead of melting them into the wall behind.
function makeDepthSampler(depthCanvas) {
  const w = depthCanvas.width, h = depthCanvas.height;
  const raw = depthCanvas.getContext("2d").getImageData(0, 0, w, h).data;
  const d = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) d[i] = raw[i * 4] / 255;
  const win = new Float32Array(9);
  return function sample(u, v) {
    const x = Math.min(w - 1, Math.max(0, Math.round(u * (w - 1))));
    const y = Math.min(h - 1, Math.max(0, Math.round(v * (h - 1))));
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const px = Math.min(w - 1, Math.max(0, x + dx));
        const py = Math.min(h - 1, Math.max(0, y + dy));
        win[n++] = d[py * w + px];
      }
    }
    for (let i = 0; i < 5; i++) {
      let m = i;
      for (let j = i + 1; j < 9; j++) if (win[j] < win[m]) m = j;
      const tmp = win[i]; win[i] = win[m]; win[m] = tmp;
    }
    return win[4];
  };
}

// Caps how fast depth may change from one vertex to the next, by repeatedly pulling apart
// neighbours that differ by more than maxStep.
//
// This replaces cutting the mesh open at depth edges. A photo has no geometry hiding behind its
// foreground, so a hard depth edge leaves the renderer two bad options: stretch the texture
// across the gap (rubbery), or open a hole (torn, and whatever sits behind shows through as
// bright ragged fringes - the "flimmer" around window and rug edges).
//
// Bounding the gradient removes the choice. A wall-to-window jump becomes a steep ramp a few
// percent of the image wide instead of a cliff, so there is nothing to tear along and nothing
// to stretch violently. The eye reads the ramp as ordinary perspective.
function limitDepthGradient(z, cols, rows, maxStep, iterations) {
  for (let it = 0; it < iterations; it++) {
    let worst = 0;
    for (let y = 0; y < rows; y++) {
      const row = y * cols;
      for (let x = 0; x < cols - 1; x++) {
        const i = row + x, j = i + 1;
        const d = z[j] - z[i];
        const over = Math.abs(d) - maxStep;
        if (over > 0) { const e = over * 0.5 * (d > 0 ? 1 : -1); z[i] += e; z[j] -= e; if (over > worst) worst = over; }
      }
    }
    for (let y = 0; y < rows - 1; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x, j = i + cols;
        const d = z[j] - z[i];
        const over = Math.abs(d) - maxStep;
        if (over > 0) { const e = over * 0.5 * (d > 0 ? 1 : -1); z[i] += e; z[j] -= e; if (over > worst) worst = over; }
      }
    }
    if (worst < maxStep * 0.02) break; // converged; the remaining passes would do nothing
  }
}

// Set once from the first renderer created, so textures can use the GPU's real anisotropy limit.
let PX_MAX_ANISO = 4;

// Builds the scene for one photo. Geometry Z is normalised to [-1, 0] (0 = nearest), so the
// actual depth scale is applied later as mesh.scale.z - that means a viewport resize never has
// to rebuild the mesh. `img` is the FULL-resolution photo: depth is estimated from a small copy,
// but the texture the viewer actually looks at is never downscaled to match it.
function buildParallaxScene(img, depthCanvas, segments) {
  const aspect = img.width / img.height;
  const planeH = 1, planeW = aspect;
  const geo = new THREE.PlaneGeometry(planeW, planeH, segments, segments);
  const pos = geo.attributes.position;
  const sample = makeDepthSampler(depthCanvas);
  const N = pos.count;
  const metric = new Float32Array(N);

  // Depth Anything outputs RELATIVE INVERSE depth (disparity), normalised 0..1. Using that
  // straight as a Z offset - as the previous version did - squashes the whole room into a thin
  // slab just behind the image plane. Running it back through 1/x restores the real spacing.
  for (let i = 0; i < N; i++) {
    const u = pos.getX(i) / planeW + 0.5;
    const v = 1 - (pos.getY(i) / planeH + 0.5);
    const disp = PX_NEAR_DISP + (1 - PX_NEAR_DISP) * clamp01(sample(u, v));
    metric[i] = 1 / disp;
  }

  // Percentile range, so one stray pixel (a window blowing out to "infinitely far") can't
  // flatten everything else.
  const sorted = Array.prototype.slice.call(metric).sort((a, b) => a - b);
  const lo = sorted[Math.floor(N * 0.02)];
  const hi = sorted[Math.floor(N * 0.98)];
  const span = Math.max(1e-4, hi - lo);
  const zn = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const m = Math.min(hi, Math.max(lo, metric[i]));
    zn[i] = -((m - lo) / span); // 0 = nearest, -1 = farthest
  }

  // The mesh stays whole; only its steepness is bounded. PX_MAX_STEP is per vertex pair, so the
  // ramp a full-range jump spreads over is about 1/PX_MAX_STEP vertices - roughly 8% of the
  // frame at the segment counts used here.
  limitDepthGradient(zn, segments + 1, segments + 1, PX_MAX_STEP, 120);
  for (let i = 0; i < N; i++) pos.setZ(i, zn[i]);
  pos.needsUpdate = true;
  geo.computeVertexNormals();

  // The texture is the photo at full resolution - this is what the viewer actually looks at, and
  // it must never be limited by whatever size the depth model needed.
  const tex = new THREE.Texture(img);
  tex.needsUpdate = true;
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = PX_MAX_ANISO; // keeps detail sharp where the plane is seen at an angle
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));

  const scene = new THREE.Scene();
  scene.add(mesh);
  return { scene, mesh, plate: null, planeW, planeH };
}

function disposeParallaxScene(built) {
  if (!built) return;
  [built.mesh, built.plate].forEach((m) => {
    if (!m) return;
    if (m.geometry) m.geometry.dispose();
    if (m.material) {
      if (m.material.map) m.material.map.dispose();
      m.material.dispose();
    }
  });
}

// Works out, for the CURRENT viewport shape, how far back the camera sits and how deep the
// scene is allowed to be. Depends only on the frame's aspect ratio, so a resize is cheap.
function fitParallaxCamera(planeW, planeH, frameAspect) {
  const halfT = Math.tan((PX_FOV * Math.PI) / 180 / 2);
  const dCover = Math.min(planeH / (2 * halfT), planeW / (2 * halfT * frameAspect));
  const camDistFar = dCover / PX_SAFETY;
  let maxDisp = PX_MAX_DISP;
  let homeZ = camDistFar - maxDisp;
  if (homeZ < 0.18) {
    maxDisp = Math.max(0.08, camDistFar - 0.18);
    homeZ = camDistFar - maxDisp;
  }
  return { homeZ, maxDisp };
}

// True when all four frustum corners land inside the photo at its FAR depth - the worst case,
// since receding geometry pulls inward on screen. Unlike the previous "just don't rotate the
// camera" rule, this permits any camera orientation and simply checks the result, which is what
// makes real panning and orbiting possible again.
function frustumCoversPhoto(camera, planeW, planeH, farZ) {
  const hw = planeW / 2, hh = planeH / 2;
  const v = new THREE.Vector3();
  for (let i = 0; i < 4; i++) {
    const nx = i === 0 || i === 3 ? -1 : 1;
    const ny = i < 2 ? -1 : 1;
    v.set(nx, ny, 0.5).unproject(camera);
    const dz = v.z - camera.position.z;
    if (dz >= -1e-6) return false;
    const t = (farZ - camera.position.z) / dz;
    if (t <= 0) return false;
    const px = camera.position.x + (v.x - camera.position.x) * t;
    const py = camera.position.y + (v.y - camera.position.y) * t;
    if (px < -hw || px > hw || py < -hh || py > hh) return false;
  }
  return true;
}

// The camera path for one shot at time t, with every lateral offset scaled by s (see
// safeShotAmplitude). Each shot aims at a TARGET point as well as moving, so the camera
// actually turns - that rotation is what makes it feel like looking around a room rather
// than sliding a photo sideways.
function shotCameraAt(spec, t, s, homeZ, maxDisp) {
  const d = spec.dirSign;
  const u = -1 + 2 * t;
  const a = spec.amp;
  const pos = { x: 0, y: 0, z: homeZ };
  const tgt = { x: 0, y: 0, z: -maxDisp * 0.55 };
  if (spec.type === "pan") {
    // Camera slides one way while the target slides the other: a sweeping look across the room.
    if (spec.axis === "x") {
      pos.x = d * a * u * s;
      pos.y = d * a * 0.16 * u * s;
      tgt.x = -d * a * 0.7 * u * s;
    } else {
      pos.y = d * a * u * s;
      pos.x = -d * a * 0.18 * u * s;
      tgt.y = -d * a * 0.65 * u * s;
    }
    pos.z = homeZ * (1 - 0.14 * t);
  } else if (spec.type === "orbit") {
    // Camera arcs sideways and dips in at the midpoint while the target stays put, so the
    // foreground swings across the background.
    pos.x = d * a * u * s;
    pos.y = d * a * 0.3 * Math.sin(Math.PI * t) * s;
    pos.z = homeZ * (1 - 0.2 * Math.sin(Math.PI * t));
  } else if (spec.type === "reveal") {
    // Starts in close and low, pulls back and rises - the standard "open on the room" move.
    pos.y = d * a * (-0.75 + 1.5 * t) * s;
    pos.x = -d * a * 0.3 * u * s;
    pos.z = homeZ * (0.66 + 0.34 * t);
    tgt.y = -d * a * 0.45 * (1 - 2 * t) * s;
  } else {
    pos.x = d * a * 0.35 * u * s;
    pos.y = -d * a * 0.25 * u * s;
    pos.z = homeZ * (1 - spec.pushFrac * 0.42 * t);
    tgt.x = -d * a * 0.25 * u * s;
  }
  return { pos, tgt };
}

function placeShotCamera(camera, spec, t, s, homeZ, maxDisp) {
  const { pos, tgt } = shotCameraAt(spec, t, s, homeZ, maxDisp);
  camera.position.set(pos.x, pos.y, pos.z);
  camera.up.set(0, 1, 0);
  camera.lookAt(tgt.x, tgt.y, tgt.z);
  camera.updateMatrixWorld();
}

// How far the camera swings around the scene over a whole shot, in degrees. This is the number
// that actually decides whether a move reads as "walking through the room" or as a broken
// effect: from a single photo there is only ~2x of real depth and nothing at all behind the
// foreground, so past roughly 15-20 degrees the missing geometry becomes obvious.
function shotSweepDeg(spec, s, homeZ, maxDisp) {
  const a = shotCameraAt(spec, 0, s, homeZ, maxDisp).pos;
  const b = shotCameraAt(spec, 1, s, homeZ, maxDisp).pos;
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  return (2 * Math.atan(d / 2 / homeZ) * 180) / Math.PI;
}

// Finds the move for one shot: first the largest amplitude that never shows past the photo's
// edge (s = 0 is always safe, so this always terminates), then scaled down to the shot's target
// camera sweep if there is more headroom than that. So the photo's own shape sets the ceiling
// and the shot design sets the intent - rather than a fixed fraction that was either too timid
// on a generous photo or clipped to nothing on a tight one.
function safeShotAmplitude(camera, spec, homeZ, maxDisp, planeW, planeH) {
  const farZ = -maxDisp;
  const ok = (s) => {
    for (let i = 0; i <= 20; i++) {
      placeShotCamera(camera, spec, i / 20, s, homeZ, maxDisp);
      if (!frustumCoversPhoto(camera, planeW, planeH, farZ)) return false;
    }
    return true;
  };
  let ceiling;
  if (ok(1)) {
    ceiling = 1;
  } else {
    let lo = 0, hi = 1;
    for (let i = 0; i < 14; i++) {
      const mid = (lo + hi) / 2;
      if (ok(mid)) lo = mid; else hi = mid;
    }
    ceiling = lo;
  }
  const sweep = shotSweepDeg(spec, ceiling, homeZ, maxDisp);
  if (sweep > spec.targetSweepDeg && sweep > 0.01) {
    return ceiling * (spec.targetSweepDeg / sweep);
  }
  return ceiling;
}

// Renders one frame of a shot. `st` is { renderer, camera, scene, spec, s, homeZ, maxDisp }.
function renderShotFrame(st, t) {
  placeShotCamera(st.camera, st.spec, easeShot(t, st.spec.ease), st.s, st.homeZ, st.maxDisp);
  st.renderer.render(st.scene, st.camera);
}

// ---- The edit ---------------------------------------------------------------------------
// Everything below decides the CUT rather than the camera: how long each shot runs, where the
// cuts land, and what happens across them. A listing video reads as expensive mostly because of
// this layer - the moves themselves are the easy part.

const SHOW_BPM = 96;                      // calm but with a pulse; the tempo of most property films
const BEAT_MS = 60000 / SHOW_BPM;         // 625ms
const DISSOLVE_MS = 340;                  // short enough to feel like an edit, not a fade
const SHOW_FADE_MS = 520;                 // up from black at the top, down at the tail
const VIGNETTE = 0.26;                    // corner darkening; reads as "graded" rather than flat

// Lays out the whole sequence at once. Doing it as one plan - rather than deriving each shot
// independently the way parallaxPathFor used to - is what makes structure possible: an opening
// that breathes, a middle with rhythm, a close that settles, and cuts that alternate direction
// instead of drifting the same way eight times in a row.
//
// Every duration is a whole number of beats, so all cuts land on one grid. That is what "cut to
// the beat" means, and it holds whether or not music is playing over it.
function buildEditPlan(count) {
  if (count === 0) return [];
  const beats = (n) => Math.round(n * BEAT_MS);
  const plan = [];

  for (let i = 0; i < count; i++) {
    const r = seededRandom(i * 17.31 + 2.4);
    const isFirst = i === 0;
    const isLast = i === count - 1 && count > 2;
    let type, nBeats, sweep, pushFrac;

    if (isFirst) {
      // The establishing shot: slow push in, held longer than anything else. Lets the viewer
      // read the whole frame before the edit starts moving.
      type = "push"; nBeats = 6; sweep = 7; pushFrac = 0.95;
    } else if (isLast) {
      // Close on a pull back and rise - the standard "leave the room" move.
      type = "reveal"; nBeats = 6; sweep = 10; pushFrac = 0.7;
    } else {
      const cycle = ["pan", "orbit", "pan", "push"];
      type = cycle[(i - 1) % cycle.length];
      nBeats = i % 2 ? 4 : 5;  // 2.5s / 3.1s alternating, so the rhythm never goes metronomic
      sweep = type === "orbit" ? 14 : type === "pan" ? 12 : 7.5;
      pushFrac = 0.6 + r * 0.4;
    }

    plan.push({
      type,
      // Mostly horizontal: a sweep across a room reads as looking around, a vertical one reads
      // as a camera on a lift. Verticals are kept as occasional punctuation.
      axis: type === "orbit" || i % 3 !== 2 ? "x" : "y",
      dirSign: i % 2 === 0 ? 1 : -1, // strict alternation, so consecutive shots counter-move
      amp: 0.55,                     // unreachable on purpose: safeShotAmplitude finds the real ceiling
      targetSweepDeg: sweep,
      pushFrac,
      durationMs: beats(nBeats),
    });
  }

  // Transitions. Mostly dissolves, with a hard cut every third shot for lift. The hard cut is
  // what stops a sequence of dissolves from turning into a lullaby.
  const lastIdx = count - 1;
  const cuts = new Set();
  for (let i = 3; i < count; i += 3) if (!(i === lastIdx && count > 2)) cuts.add(i);
  // With only a handful of photos the every-third rule can land nothing at all, and an
  // all-dissolve sequence goes soft. Put one hard cut near the middle in that case.
  if (cuts.size === 0 && count >= 3) cuts.add(Math.max(1, Math.floor(count / 2)));
  plan.forEach((p, i) => {
    p.transition = cuts.has(i) ? "cut" : "dissolve";
    p.transitionMs = cuts.has(i) ? 0 : DISSOLVE_MS;
  });

  // Speed curves follow from the cuts, not the other way round: accelerate into a hard cut,
  // leave one already at speed. That pairing is the whole trick behind a "speed ramp".
  plan.forEach((p, i) => {
    const nextIsCut = i + 1 < plan.length && plan[i + 1].transition === "cut";
    p.ease = nextIsCut ? "ramp" : p.transition === "cut" ? "settle" : "glide";
  });

  return plan;
}

// Vignette, cached per size - rebuilding the gradient every frame is wasted work.
let _vigKey = "", _vigGrad = null;
function vignetteFor(octx, W, H) {
  const key = W + "x" + H;
  if (key !== _vigKey) {
    const g = octx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0," + VIGNETTE + ")");
    _vigKey = key; _vigGrad = g;
  }
  return _vigGrad;
}

// Composes ONE frame of the finished show onto a 2D context: the right shot at the right point
// in its move, whatever the transition into it calls for, then the grade.
//
// Both the live preview and the exported file call this, so what is downloaded is frame for
// frame what was on screen - they cannot drift apart.
function composeShowFrame(octx, W, H, shots, tMs, drawShot, opts) {
  const totalMs = shots.reduce((a, s) => a + s.spec.durationMs, 0);
  const t = ((tMs % totalMs) + totalMs) % totalMs;

  let acc = 0, idx = shots.length - 1;
  for (let i = 0; i < shots.length; i++) {
    if (t < acc + shots[i].spec.durationMs) { idx = i; break; }
    acc += shots[i].spec.durationMs;
  }
  if (idx === shots.length - 1) acc = totalMs - shots[idx].spec.durationMs;

  const shot = shots[idx];
  const local = t - acc;
  const fade = shot.spec.transitionMs || 0;

  octx.globalAlpha = 1;
  if (fade > 0 && local < fade && shots.length > 1) {
    // Hold the outgoing shot underneath at its final frame and bring this one up over it.
    const prev = shots[(idx - 1 + shots.length) % shots.length];
    octx.drawImage(drawShot(prev, 1), 0, 0, W, H);
    octx.globalAlpha = clamp01(local / fade);
  }
  octx.drawImage(drawShot(shot, local / shot.spec.durationMs), 0, 0, W, H);
  octx.globalAlpha = 1;

  octx.fillStyle = vignetteFor(octx, W, H);
  octx.fillRect(0, 0, W, H);

  // Up from black at the top and down at the tail. In the looping preview this reads as a
  // deliberate top-and-tail rather than a seam.
  let dark = 0;
  if (t < SHOW_FADE_MS) dark = 1 - t / SHOW_FADE_MS;
  else if (t > totalMs - SHOW_FADE_MS) dark = 1 - (totalMs - t) / SHOW_FADE_MS;
  if (!opts || opts.fades !== false) {
    if (dark > 0.001) {
      octx.fillStyle = "rgba(0,0,0," + dark.toFixed(3) + ")";
      octx.fillRect(0, 0, W, H);
    }
  }
  return totalMs;
}

// One Ken-Burns-animated image layer. Mounts at opacity 0 and fades in,
// and continuously updates its own transform via rAF while active.
function SceneLayer({ src, active, isPlaying, getProgress, kbParams, fadeMs }) {
  const imgRef = useRef(null);
  const [faded, setFaded] = useState(false);

  useEffect(() => {
    setFaded(false);
    const t = requestAnimationFrame(() => setFaded(true));
    return () => cancelAnimationFrame(t);
  }, [src]);

  useEffect(() => {
    if (!active) return;
    let raf;
    const tick = () => {
      applyKenBurns(imgRef.current, kbParams, getProgress());
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [active, isPlaying, kbParams]);

  useEffect(() => {
    if (!active) applyKenBurns(imgRef.current, kbParams, 0);
  }, [active, kbParams]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt=""
      className={`kb-img kb-fade absolute inset-0 w-full h-full object-cover ${faded ? "kb-fade-in" : ""}`}
      style={{ zIndex: active ? 2 : 1, ...(fadeMs ? { transitionDuration: `${fadeMs}ms` } : {}) }}
    />
  );
}

// The whole walkthrough on ONE canvas. Every shot's scene is built up front and then played
// from a single renderer, which is what keeps the cut between two shots clean.
//
// The previous design mounted one WebGL layer per shot and swapped them. Because each layer
// rebuilt its scene when its src prop changed, BOTH the outgoing and the incoming layer were
// rebuilding at the same moment, and neither drew anything while they did - a full black frame
// at every cut. Here nothing is rebuilt during playback at all.
//
// Composition mirrors exportFlythroughVideo exactly: render the shot in WebGL, blit it onto a
// 2D canvas, and crossfade by drawing the outgoing shot underneath at a falling alpha. Preview
// and export therefore run the same code and cannot drift apart.
function FlythroughStage({ stills, depths, specs, onError }) {
  const hostRef = useRef(null);

  useEffect(() => {
    const host = hostRef.current;
    if (!host || typeof THREE === "undefined" || stills.length === 0) return;
    let disposed = false;
    let raf = 0;

    const out = document.createElement("canvas");
    out.style.width = "100%";
    out.style.height = "100%";
    out.style.display = "block";
    const octx = out.getContext("2d");
    host.innerHTML = "";
    host.appendChild(out);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    try { PX_MAX_ANISO = Math.max(PX_MAX_ANISO, renderer.capabilities.getMaxAnisotropy()); } catch (e) {}
    const camera = new THREE.PerspectiveCamera(PX_FOV, 1, 0.02, 20);

    let shots = null;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = 0, H = 0;

    // Re-derives everything that depends on the container's CURRENT size. Reading the size here
    // rather than once at mount is what stops a late stylesheet or a rotated phone from leaving
    // a canvas that doesn't match its box - the cause of the black bars reported on mobile.
    const refit = () => {
      if (disposed) return false;
      const cw = host.clientWidth, ch = host.clientHeight;
      if (cw < 2 || ch < 2) return false;
      const nw = Math.round(cw * dpr), nh = Math.round(ch * dpr);
      if (nw === W && nh === H) return true;
      W = nw; H = nh;
      out.width = W;
      out.height = H;
      renderer.setSize(W, H, false);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      if (shots) {
        for (const s of shots) {
          const fit = fitParallaxCamera(s.built.planeW, s.built.planeH, W / H);
          s.built.mesh.scale.z = fit.maxDisp;
          s.homeZ = fit.homeZ;
          s.maxDisp = fit.maxDisp;
          s.s = safeShotAmplitude(camera, s.spec, fit.homeZ, fit.maxDisp, s.built.planeW, s.built.planeH);
        }
      }
      return true;
    };

    const build = async () => {
      const built = [];
      for (let i = 0; i < stills.length; i++) {
        const img = await loadImageEl(stills[i]);
        if (disposed) return;
        const segments = window.innerWidth < 520 ? 192 : 288;
        built.push({ built: buildParallaxScene(img, depths[i], segments), spec: specs[i], homeZ: 1, maxDisp: 0.2, s: 0 });
      }
      if (disposed) return;
      shots = built;
      W = H = 0; // force refit to fit every freshly built scene
      refit();
      start();
    };

    const drawShot = (shot, t) => {
      renderShotFrame({ renderer, camera, scene: shot.built.scene, spec: shot.spec, s: shot.s, homeZ: shot.homeZ, maxDisp: shot.maxDisp }, t);
      return renderer.domElement;
    };

    const start = () => {
      const t0 = performance.now();
      const tick = () => {
        if (disposed || !shots) return;
        raf = requestAnimationFrame(tick);
        if (!refit()) return;
        composeShowFrame(octx, W, H, shots, performance.now() - t0, drawShot);
      };
      raf = requestAnimationFrame(tick);
    };

    build().catch((e) => { if (!disposed && onError) onError(e.message || "Kunne ikke bygge 3D-scenen."); });

    const ro = new ResizeObserver(() => refit());
    ro.observe(host);

    return () => {
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      if (shots) shots.forEach((s) => disposeParallaxScene(s.built));
      renderer.dispose();
      host.innerHTML = "";
    };
    // eslint-disable-next-line
  }, [stills, depths, specs]);

  return <div ref={hostRef} className="absolute inset-0 w-full h-full" />;
}

// ---- Video export -----------------------------------------------------------------------
// Renders the whole walkthrough frame by frame into one canvas and records it, reusing the
// exact scene and camera code the live preview uses. Runs entirely in the browser: no render
// server, no upload, no per-video cost.
// Full HD in every orientation. The old 720-line sizes were a phone-first compromise; a listing
// video goes on a property site and a big screen as often as it goes on Reels.
const EXPORT_FORMATS = {
  "16:9": { w: 1920, h: 1080, ar: 16 / 9, label: "Bredformat", where: "Boligsite, YouTube, storskærm" },
  "9:16": { w: 1080, h: 1920, ar: 9 / 16, label: "Højformat", where: "Reels, TikTok, Stories" },
  "1:1": { w: 1080, h: 1080, ar: 1, label: "Kvadratisk", where: "Instagram-feed" },
};

function pickRecorderMime() {
  const candidates = [
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm",
  ];
  if (!window.MediaRecorder || !window.MediaRecorder.isTypeSupported) return "";
  for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

const HIDDEN_TAB_MSG =
  "Optagelsen kræver at denne fane er fremme. Browseren sætter canvas-optagelse på pause i en " +
  "baggrundsfane, og filen bliver tom. Lad fanen være synlig, og prøv igen.";

async function exportFlythroughVideo({ stills, depths, specs, format, fps = 30, onProgress }) {
  if (!window.MediaRecorder) throw new Error("Din browser understøtter ikke videooptagelse. Prøv Chrome eller Safari 17+.");
  const mime = pickRecorderMime();
  if (!mime) throw new Error("Din browser kan ikke optage video fra et canvas.");
  // A backgrounded tab throttles timers and stops compositing the canvas, so MediaRecorder
  // receives nothing and the recording comes out as a zero-byte file. Caught here rather than
  // handed to the user as a download link that yields a broken file.
  if (document.hidden) throw new Error(HIDDEN_TAB_MSG);
  const fmt = EXPORT_FORMATS[format];
  const w = fmt.w, h = fmt.h;
  const frameAspect = w / h;

  // The recorded surface is a plain 2D canvas: each shot is rendered in WebGL and copied onto
  // it, which is what makes a real crossfade between two shots possible.
  const out = document.createElement("canvas");
  out.width = w;
  out.height = h;
  const octx = out.getContext("2d");
  octx.fillStyle = "#000";
  octx.fillRect(0, 0, w, h);

  // preserveDrawingBuffer is required, otherwise drawImage reads an already-cleared buffer.
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  try { PX_MAX_ANISO = Math.max(PX_MAX_ANISO, renderer.capabilities.getMaxAnisotropy()); } catch (e) {}
  renderer.setSize(w, h, false);
  const camera = new THREE.PerspectiveCamera(PX_FOV, frameAspect, 0.02, 20);

  const shots = [];
  const cleanup = () => {
    shots.forEach((s) => disposeParallaxScene(s.built));
    renderer.dispose();
  };

  try {
    // Build every shot up front so no frame stalls on image decoding mid-recording.
    for (let i = 0; i < stills.length; i++) {
      const img = await loadImageEl(stills[i]);
      const built = buildParallaxScene(img, depths[i], 288);
      const fit = fitParallaxCamera(built.planeW, built.planeH, frameAspect);
      built.mesh.scale.z = fit.maxDisp;
      shots.push({
        built,
        spec: specs[i],
        homeZ: fit.homeZ,
        maxDisp: fit.maxDisp,
        s: safeShotAmplitude(camera, specs[i], fit.homeZ, fit.maxDisp, built.planeW, built.planeH),
      });
      if (onProgress) onProgress({ phase: "prepare", current: i + 1, total: stills.length });
    }

    const totalMs = shots.reduce((a, s) => a + s.durationMs, 0);
    const totalFrames = Math.max(1, Math.round((totalMs / 1000) * fps));

    const stream = out.captureStream(0);
    const track = stream.getVideoTracks()[0];
    // Safari and older Chrome don't expose requestFrame on the capture track; there the stream
    // has to sample the canvas on its own clock instead of being pushed one frame at a time.
    const manualFrames = typeof track.requestFrame === "function";
    const liveStream = manualFrames ? stream : out.captureStream(fps);
    const chunks = [];
    // Scaled to the pixel count: 1080p needs roughly twice the bitrate 720p did, and a slow pan
    // across a detailed room is exactly the content that shows compression blocking.
    const bitrate = Math.round(Math.min(24e6, Math.max(10e6, (w * h * fps) / 1000 * 0.42)));
    const recorder = new MediaRecorder(liveStream, { mimeType: mime, videoBitsPerSecond: bitrate });
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const finished = new Promise((res) => { recorder.onstop = res; });
    recorder.start();

    const drawShot = (shot, t) => {
      renderShotFrame({ renderer, camera, scene: shot.built.scene, spec: shot.spec, s: shot.s, homeZ: shot.homeZ, maxDisp: shot.maxDisp }, t);
      return renderer.domElement;
    };

    // If the tab is hidden part-way through, everything recorded from that point is lost. Stop
    // and say so, rather than finishing and handing over a truncated file.
    let wentHidden = false;
    const onVis = () => { if (document.hidden) wentHidden = true; };
    document.addEventListener("visibilitychange", onVis);

    // MediaRecorder timestamps frames by wall clock, so the loop is paced to real time rather
    // than run flat out - otherwise a slow machine would produce a correct-looking but
    // slow-motion file.
    const t0 = performance.now();
    try {
      for (let f = 0; f < totalFrames; f++) {
        if (wentHidden) break;
        const tMs = (f / fps) * 1000;
        // Same composer as the live preview, so the file is frame for frame what was on screen.
        composeShowFrame(octx, w, h, shots, tMs, drawShot);
        if (manualFrames) track.requestFrame();

        if (f % 5 === 0 && onProgress) onProgress({ phase: "render", current: f + 1, total: totalFrames });
        const behind = performance.now() - t0;
        const wait = tMs - behind;
        await new Promise((r) => setTimeout(r, wait > 1 ? wait : 0));
      }
    } finally {
      document.removeEventListener("visibilitychange", onVis);
    }

    await new Promise((r) => setTimeout(r, 150));
    recorder.stop();
    await finished;
    const blob = new Blob(chunks, { type: mime.split(";")[0] });
    // Last line of defence: whatever the cause, never hand back a file that isn't a video.
    // An empty or near-empty blob means the recorder got nothing - most often a hidden tab.
    if (blob.size < 2048) throw new Error(wentHidden || document.hidden ? HIDDEN_TAB_MSG : "Optagelsen blev tom. Prøv igen med fanen fremme.");
    if (wentHidden) throw new Error(HIDDEN_TAB_MSG);
    return blob;
  } finally {
    cleanup();
  }
}

function Rundvis() {

  const [images, setImages] = useState([]);

  const [agentName, setAgentName] = useState("");
  const [notes, setNotes] = useState("");
  const [scenes, setScenes] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [genError, setGenError] = useState("");

  const [isPlaying, setIsPlaying] = useState(false);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [prevIndex, setPrevIndex] = useState(null);
  const [voices, setVoices] = useState([]); // [{status:'idle'|'loading'|'ready'|'error', url, mode:'audio'|'browser'}]
  const [voicesPreparing, setVoicesPreparing] = useState(false);
  const [voiceOverallError, setVoiceOverallError] = useState("");
  const [musicOn, setMusicOn] = useState(false);

  // AI-gennemgang state: a deterministic, non-generative "3D Ken Burns" (see the module-level
  // depth/parallax helpers above) - no AI video generation is involved any more, so there's no
  // upload step and no video URL to track, just the resized stills and their depth maps.
  const [flythroughStatus, setFlythroughStatus] = useState("idle"); // idle|processing|done|error
  const [flythroughError, setFlythroughError] = useState("");
  const [flythroughProgress, setFlythroughProgress] = useState({ current: 0, total: 0 });
  const [flythroughStills, setFlythroughStills] = useState([]); // resized data-URLs actually used, in upload order
  const [flythroughDepths, setFlythroughDepths] = useState([]); // matching depth-map canvases, one per still

  // Video export state: the walkthrough is rendered to a real file in the browser (see
  // exportFlythroughVideo), so an agent can actually post it instead of only viewing it here.
  const [exportStatus, setExportStatus] = useState("idle"); // idle|working|done|error
  const [exportProgress, setExportProgress] = useState({ phase: "", current: 0, total: 0 });
  const [exportError, setExportError] = useState("");
  const [exportFile, setExportFile] = useState(null); // { url, name }
  // Which shape the walkthrough is previewed in. Defaults to wide: that is how a listing video is
  // watched on a property site, and it is the format the photos were shot in.

  const fileInputRef = useRef(null);

  const kbParamsList = useMemo(() => scenes.map((_, i) => kenBurnsParamsFor(i)), [scenes.length]);

  const handleFiles = (fileList) => {
    const files = Array.from(fileList).slice(0, 20 - images.length);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = (e) => setImages((prev) => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, src: e.target.result }]);
      reader.readAsDataURL(file);
    });
  };
  const removeImage = (id) => setImages((prev) => prev.filter((i) => i.id !== id));
  const moveImage = (idx, dir) => {
    setImages((prev) => {
      const next = [...prev]; const target = idx + dir;

      const response = await fetch("/api/generate-script", {
        method: "POST",

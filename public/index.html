<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rundvis — AI boligvideo prototype</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body, #root { height: 100%; }
  body { margin: 0; background: #15191C; font-family: 'IBM Plex Sans', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #2C3237; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  .kb-img { will-change: transform; transform-origin: center center; filter: saturate(1.08) contrast(1.04); }
  .kb-fade { opacity: 0; transition: opacity 550ms ease; }
  .kb-fade.kb-fade-in { opacity: 1; }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%); }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .kb-img { transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

const INK = "#15191C", SURFACE = "#1D2226", SURFACE_2 = "#242A2E", TEXT = "#F2EFE7",
  MUTED = "#98A0A6", ACCENT = "#3860E8", ACCENT_SOFT = "#293B72", AMBER = "#E3A33D", LINE = "#2C3237";

const PROPERTY_TYPES = [
  { id: "villa", label: "Villa", hint: "Roligt tempo, fokus på rum og lys" },
  { id: "sommerhus", label: "Sommerhus", hint: "Udeliv, terrasse, udsigt" },
  { id: "liebhaver", label: "Liebhaverbolig", hint: "Langsomt, cinematisk, detaljer" },
  { id: "nyhed", label: "Nyhed på markedet", hint: "Energisk tempo, skaber interesse" },
  { id: "prisnedsaettelse", label: "Prisnedsættelse", hint: "Tydeligt fokus på ny pris" },
  { id: "aabenthus", label: "Åbent hus", hint: "Dato og tidspunkt fremhævet" },
];
// Three steps, in the order the work actually happens. The old flow had four, two of which
// (property type, script) only fed a voiceover feature that the walkthrough never used - so they
// asked the agent for decisions that changed nothing they could see.
const STEPS = [{ id: 1, label: "Videotype" }, { id: 2, label: "Billeder" }, { id: 3, label: "Video" }];

// The two products, chosen up front because everything downstream differs: what it costs, how
// long it takes, and whether a video service is involved at all.
const VIDEO_MODES = [
  {
    id: "basic",
    label: "Basic",
    tagline: "Gratis, klar med det samme",
    points: [
      "Kameraet bevæger sig hen over dine fotos — zoom og panorering",
      "Hver pixel kommer direkte fra dit billede, intet forvrænges",
      "Filmisk klipning: beat, hårde klip og bløde overgange",
    ],
    bedst: "Til hverdagens boliger, og når det skal være klar nu.",
  },
  {
    id: "highend",
    label: "High-end",
    tagline: "Ægte kamerabevægelse gennem rummene",
    points: [
      "Hvert foto bliver til et klip hvor kameraet faktisk bevæger sig i rummet",
      "Samme klipning og samme formater som Basic",
      "Koster pr. klip og tager nogle minutter",
    ],
    bedst: "Til liebhaverboliger og det der skal sælge sig selv.",
  },
];
const FALLBACK_SCENE_MS = 6000;

function seededRandom(seed) {
  const s = Math.sin(seed) * 10000;
  return s - Math.floor(s);
}
function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

// Deterministic per-scene camera-move: a mix of zoom in/out and a pan direction,
// varied by index so consecutive scenes don't all move the same way.
function kenBurnsParamsFor(index) {
  const r1 = seededRandom(index * 12.9898 + 3.7);
  const r2 = seededRandom(index * 78.233 + 1.3);
  const r3 = seededRandom(index * 37.719 + 2.1);
  const r4 = seededRandom(index * 5.234 + 4.9);
  const zoomIn = r1 > 0.5;
  const scaleAmt = 1.08 + r2 * 0.09; // 1.08 - 1.17
  const panX = (r3 - 0.5) * 7; // -3.5% .. 3.5%
  const panY = (r4 - 0.5) * 5; // -2.5% .. 2.5%
  return {
    scaleFrom: zoomIn ? 1.02 : scaleAmt,
    scaleTo: zoomIn ? scaleAmt : 1.02,
    panX, panY,
  };
}
function applyKenBurns(el, params, t) {
  if (!el) return;
  const e = easeInOutSine(Math.max(0, Math.min(1, t)));
  const scale = params.scaleFrom + (params.scaleTo - params.scaleFrom) * e;
  const tx = -params.panX / 2 + params.panX * e;
  const ty = -params.panY / 2 + params.panY * e;
  el.style.transform = `scale(${scale.toFixed(4)}) translate(${tx.toFixed(2)}%, ${ty.toFixed(2)}%)`;
}

// ---- Cinematic 2D motion --------------------------------------------------------------------
// The camera moves the FRAME, never the pixels. Each shot is a rectangle travelling across the
// photograph; every output pixel is a straight resample of the original, so straight lines stay
// straight and nothing bends, tears or shimmers.
//
// This replaced a depth-estimated 3D mesh. That approach displaces every pixel by an ESTIMATED
// depth, and the estimate is never perfect: ceiling boards that are straight in the photo came
// out curved, and hard depth edges either tore or stretched. No amount of tuning fixes that -
// bending the photo is what the technique does. Fidelity to the uploaded photo was the higher
// requirement, so the depth model, the mesh and Three.js are gone.
//
// The trade is parallax. In exchange: nothing to go wrong, no model to download, no waiting, and
// a far smaller crop (about 4-10% here against the 22% the 3D camera needed for room to turn).

const KB_MAX_ZOOM = 1.1;   // tightest any shot ever frames: a 10% crop, and only at one end of a move
const KB_TRAVEL = 0.9;     // fraction of the available slack a full move uses

function clamp01(t) { return Math.max(0, Math.min(1, t)); }
function clampU(u) { return Math.max(-1, Math.min(1, u)); }

// The largest rectangle of the output's shape that fits inside the image. Whatever slack is left
// over - the mismatch between the photo's shape and the video's - is free room to move through,
// costing no crop at all. A 3:2 photo in a 16:9 frame has ~16% of vertical slack before any zoom.
function coverRect(iw, ih, outAspect) {
  return iw / ih > outAspect
    ? { w: ih * outAspect, h: ih }
    : { w: iw, h: iw / outAspect };
}

// Prescales the photo so the most tightly framed moment of a shot lands near 1:1 on the output.
// Drawing every frame from this plate keeps the picture crisp: the browser is then resampling by
// a hair rather than squeezing a 2560px photo into a 1080px frame sixty times a second.
// Downscaling is done in halving steps, which is much cleaner than one big jump.
function buildPlate(img, outW, outH) {
  const base = coverRect(img.width, img.height, outW / outH);
  const scale = Math.min(1, (outW * KB_MAX_ZOOM) / base.w);
  let src = img, sw = img.width, sh = img.height;
  const targetW = Math.max(16, Math.round(img.width * scale));
  const targetH = Math.max(16, Math.round(img.height * scale));
  while (sw / 2 >= targetW && sh / 2 >= targetH && sw > 32) {
    const c = document.createElement("canvas");
    c.width = Math.round(sw / 2); c.height = Math.round(sh / 2);
    const cx = c.getContext("2d");
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";
    cx.drawImage(src, 0, 0, c.width, c.height);
    src = c; sw = c.width; sh = c.height;
  }
  if (sw === targetW && sh === targetH) return { canvas: src, w: sw, h: sh };
  const out = document.createElement("canvas");
  out.width = targetW; out.height = targetH;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(src, 0, 0, targetW, targetH);
  return { canvas: out, w: targetW, h: targetH };
}

// Where a shot's frame sits at time t. Returned in the plate's pixel coordinates.
// By construction the rectangle can never leave the photo: its half-width plus the largest
// possible offset is exactly the plate's half-width. That is the whole black-edge guarantee -
// no projection maths, no search, nothing to get wrong.
function shotRectAt(spec, plateW, plateH, outAspect, t) {
  const e = easeShot(t, spec.ease);
  const z = spec.zFrom + (spec.zTo - spec.zFrom) * e;
  const base = coverRect(plateW, plateH, outAspect);
  const rw = base.w / z, rh = base.h / z;
  const slackX = Math.max(0, plateW - rw), slackY = Math.max(0, plateH - rh);
  const ux = clampU(spec.fromU.x + (spec.toU.x - spec.fromU.x) * e);
  const uy = clampU(spec.fromU.y + (spec.toU.y - spec.fromU.y) * e);
  return {
    x: plateW / 2 + (ux * slackX) / 2 - rw / 2,
    y: plateH / 2 + (uy * slackY) / 2 - rh / 2,
    w: rw,
    h: rh,
  };
}

// Draws one shot at time t (0..1 through its own clip).
//
// A shot is backed by EITHER a still photo or a generated video clip, and everything downstream
// - the dissolves, the grade, the export - is written against this one function, so the two
// kinds compose together in the same sequence without anything else knowing the difference.
//
// A generated clip already contains its camera move, so the frame is not moved across it: it is
// cover-fitted and played. Only stills get the travelling frame.
function drawShot2D(octx, W, H, shot, t) {
  if (shot.video) {
    const v = shot.video;
    const vw = v.videoWidth, vh = v.videoHeight;
    if (!vw || !vh) return;
    const base = coverRect(vw, vh, W / H);
    octx.drawImage(v, (vw - base.w) / 2, (vh - base.h) / 2, base.w, base.h, 0, 0, W, H);
    return;
  }
  const r = shotRectAt(shot.spec, shot.plate.w, shot.plate.h, W / H, t);
  octx.drawImage(shot.plate.canvas, r.x, r.y, r.w, r.h, 0, 0, W, H);
}

// Keeps the generated clips lined up with the edit: the shot on screen plays, everything else
// is paused on its last frame (which is what a dissolve needs underneath it).
//
// The clips are played rather than seeked frame by frame - seeking every frame stutters badly.
// A resync only happens when playback has drifted more than about a third of a second, which in
// practice means after a loop or a stall.
//
// Generated clips run 5s while the edit uses only the first couple of seconds of each. That is
// deliberate twice over: it matches the pacing measured in the reference films, AND the opening
// seconds are where an image-to-video model stays closest to the photograph it was given, since
// drift grows the longer a clip runs. Using the head of each clip buys both at once.
function syncShowVideos(shots, idx, localMs) {
  for (let i = 0; i < shots.length; i++) {
    const v = shots[i].video;
    if (!v) continue;
    if (i !== idx) {
      if (!v.paused) v.pause();
      continue;
    }
    const want = Math.min(localMs / 1000, Math.max(0, (v.duration || 99) - 0.05));
    try {
      if (v.paused) {
        v.currentTime = want;
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
      } else if (Math.abs(v.currentTime - want) > 0.34) {
        v.currentTime = want;
      }
    } catch (e) {}
  }
}

// Three speed curves, picked per shot by where its cut falls (see buildEditPlan). None of them
// decelerate to a standstill: a clip that parks before the cut is the single clearest giveaway
// of a slideshow, and the old easeInOutSine did exactly that at BOTH ends.
//   glide  - gentle start, still moving at full speed when a dissolve begins
//   ramp   - accelerates into a hard cut, so the cut lands on motion (the "speed ramp" look)
//   settle - leaves a hard cut already at speed, then eases off
// Each is a blend of a linear term and a shaped one. The linear part is the point: a pure
// power curve has zero velocity at one end, so a shot built on one comes to a dead stop either
// just before its cut or just after it. Blended, the camera is never slower than ~0.35x its
// average - it always reads as moving, even at the very edges of a clip.
const SHOT_EASES = {
  glide: (t) => 0.65 * t + 0.35 * Math.pow(t, 1.8),
  ramp: (t) => 0.35 * t + 0.65 * Math.pow(t, 2.2),
  settle: (t) => 0.55 * t + 0.45 * (1 - Math.pow(1 - t, 2)),
};
function easeShot(t, kind) { return (SHOT_EASES[kind] || SHOT_EASES.glide)(clamp01(t)); }

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error("Kunne ikke indlæse billedet."));
    i.src = src;
  });
}

// ---- The edit ---------------------------------------------------------------------------
// Everything below decides the CUT rather than the camera: how long each shot runs, where the
// cuts land, and what happens across them. A listing video reads as expensive mostly because of
// this layer - the moves themselves are the easy part.

// Measured off a reference listing film the agent supplied: 14 cuts across 40.7s, with clip
// lengths clustering at ~2.05s and ~4.1s - one unit and two units of the same grid, i.e. a beat
// around 117 BPM. Ours ran at 96 and felt slower than the target, so it now matches.
const SHOW_BPM = 116;
const BEAT_MS = 60000 / SHOW_BPM;         // ~517ms
const DISSOLVE_MS = 340;                  // short enough to feel like an edit, not a fade
const SHOW_FADE_MS = 520;                 // up from black at the top, down at the tail
const VIGNETTE = 0.26;                    // corner darkening; reads as "graded" rather than flat

// Lays out the whole sequence at once. Doing it as one plan - rather than deriving each shot
// independently the way parallaxPathFor used to - is what makes structure possible: an opening
// that breathes, a middle with rhythm, a close that settles, and cuts that alternate direction
// instead of drifting the same way eight times in a row.
//
// Every duration is a whole number of beats, so all cuts land on one grid. That is what "cut to
// the beat" means, and it holds whether or not music is playing over it.
function buildEditPlan(count) {
  if (count === 0) return [];
  const beats = (n) => Math.round(n * BEAT_MS);
  const plan = [];

  const T = KB_TRAVEL;
  for (let i = 0; i < count; i++) {
    const isFirst = i === 0;
    const isLast = i === count - 1 && count > 2;
    const d = i % 2 === 0 ? 1 : -1; // strict alternation, so consecutive shots counter-move
    let type, nBeats, zFrom, zTo, fromU, toU;

    if (isFirst) {
      // Establishing shot: opens on the FULL frame - no crop at all - and eases in. The first
      // thing the viewer sees is the photograph exactly as the agent shot it.
      type = "push"; nBeats = 6;
      zFrom = 1.0; zTo = 1.07;
      fromU = { x: 0, y: 0 }; toU = { x: 0.18, y: -0.12 };
    } else if (isLast) {
      // Close by pulling back out to the full frame again, rising slightly: the standard
      // "leave the room" move, and it ends on an uncropped picture.
      type = "pull"; nBeats = 6;
      zFrom = 1.08; zTo = 1.0;
      fromU = { x: -0.2 * d, y: 0.45 }; toU = { x: 0, y: -0.1 };
    } else {
      // FIVE types on an odd-length cycle. Odd matters: direction alternates with i, so an
      // even-length cycle would land every pan on the same parity and give them all the same
      // direction. Five also means the pattern does not visibly repeat inside one property.
      const cycle = ["pan", "drift", "push", "pan", "pullback"];
      type = cycle[(i - 1) % cycle.length];
      nBeats = i % 2 ? 4 : 5; // 2.1s / 2.6s alternating, so the rhythm never goes metronomic

      // Every shot gets its own amount, not just its own direction. Earlier all pushes moved
      // exactly 7% and all pans held zoom at zero, which reads as a template rather than as a
      // camera: a real edit varies how far each move travels.
      const v = 0.75 + seededRandom(i * 31.7 + 8.2) * 0.5;   // 0.75-1.25 on the move
      const vz = 0.7 + seededRandom(i * 47.3 + 1.9) * 0.6;   // 0.7-1.3 on the zoom

      if (type === "pan") {
        // A travelling frame. Both axes are driven; because each is scaled by its OWN slack, the
        // move runs along whichever axis the photo actually has room in - wide for a 9:16 frame,
        // tall for a 16:9 one - with no special-casing. A touch of zoom keeps it from feeling
        // locked off.
        zFrom = 1.05; zTo = 1.05 + 0.025 * vz;
        fromU = { x: -T * d * v, y: T * 0.25 * d * v }; toU = { x: T * d * v, y: -T * 0.25 * d * v };
      } else if (type === "drift") {
        zFrom = 1.02; zTo = 1.02 + 0.07 * vz;
        fromU = { x: -T * 0.55 * d * v, y: -T * 0.5 * d * v }; toU = { x: T * 0.55 * d * v, y: T * 0.5 * d * v };
      } else if (type === "pullback") {
        // Opens tight and opens up. Mixed into the body of the edit, not saved for the ending,
        // so the video is not a run of push-ins with one pull-out at the very end.
        zFrom = 1.04 + 0.05 * vz; zTo = 1.005;
        fromU = { x: T * 0.4 * d * v, y: T * 0.3 * d * v }; toU = { x: -T * 0.15 * d * v, y: -T * 0.1 * d * v };
      } else {
        zFrom = 1.01; zTo = 1.01 + 0.075 * vz;
        fromU = { x: T * 0.3 * d * v, y: T * 0.25 * d * v }; toU = { x: -T * 0.3 * d * v, y: -T * 0.25 * d * v };
      }
    }

    plan.push({ type, dirSign: d, zFrom, zTo, fromU, toU, durationMs: beats(nBeats) });
  }

  // Transitions. Mostly dissolves, with a hard cut every third shot for lift. The hard cut is
  // what stops a sequence of dissolves from turning into a lullaby.
  const lastIdx = count - 1;
  const cuts = new Set();
  for (let i = 3; i < count; i += 3) if (!(i === lastIdx && count > 2)) cuts.add(i);
  // With only a handful of photos the every-third rule can land nothing at all, and an
  // all-dissolve sequence goes soft. Put one hard cut near the middle in that case.
  if (cuts.size === 0 && count >= 3) cuts.add(Math.max(1, Math.floor(count / 2)));
  plan.forEach((p, i) => {
    p.transition = cuts.has(i) ? "cut" : "dissolve";
    p.transitionMs = cuts.has(i) ? 0 : DISSOLVE_MS;
  });

  // Speed curves follow from the cuts, not the other way round: accelerate into a hard cut,
  // leave one already at speed. That pairing is the whole trick behind a "speed ramp".
  plan.forEach((p, i) => {
    const nextIsCut = i + 1 < plan.length && plan[i + 1].transition === "cut";
    p.ease = nextIsCut ? "ramp" : p.transition === "cut" ? "settle" : "glide";
  });

  return plan;
}

// Vignette, cached per size - rebuilding the gradient every frame is wasted work.
let _vigKey = "", _vigGrad = null;
function vignetteFor(octx, W, H) {
  const key = W + "x" + H;
  if (key !== _vigKey) {
    const g = octx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0," + VIGNETTE + ")");
    _vigKey = key; _vigGrad = g;
  }
  return _vigGrad;
}

// Composes ONE frame of the finished show onto a 2D context: the right shot at the right point
// in its move, whatever the transition into it calls for, then the grade.
//
// Both the live preview and the exported file call this, so what is downloaded is frame for
// frame what was on screen - they cannot drift apart.
function composeShowFrame(octx, W, H, shots, tMs, opts) {
  const totalMs = shots.reduce((a, s) => a + s.spec.durationMs, 0);
  const t = ((tMs % totalMs) + totalMs) % totalMs;

  let acc = 0, idx = shots.length - 1;
  for (let i = 0; i < shots.length; i++) {
    if (t < acc + shots[i].spec.durationMs) { idx = i; break; }
    acc += shots[i].spec.durationMs;
  }
  if (idx === shots.length - 1) acc = totalMs - shots[idx].spec.durationMs;

  const shot = shots[idx];
  const local = t - acc;
  const fade = shot.spec.transitionMs || 0;

  // Done here rather than by each caller, so the preview and the export stay in lockstep.
  syncShowVideos(shots, idx, local);

  octx.globalAlpha = 1;
  if (fade > 0 && local < fade && shots.length > 1) {
    // Hold the outgoing shot underneath at its final frame and bring this one up over it.
    const prev = shots[(idx - 1 + shots.length) % shots.length];
    drawShot2D(octx, W, H, prev, 1);
    octx.globalAlpha = clamp01(local / fade);
  }
  drawShot2D(octx, W, H, shot, local / shot.spec.durationMs);
  octx.globalAlpha = 1;

  octx.fillStyle = vignetteFor(octx, W, H);
  octx.fillRect(0, 0, W, H);

  // Up from black at the top and down at the tail. In the looping preview this reads as a
  // deliberate top-and-tail rather than a seam.
  let dark = 0;
  if (t < SHOW_FADE_MS) dark = 1 - t / SHOW_FADE_MS;
  else if (t > totalMs - SHOW_FADE_MS) dark = 1 - (totalMs - t) / SHOW_FADE_MS;
  if (!opts || opts.fades !== false) {
    if (dark > 0.001) {
      octx.fillStyle = "rgba(0,0,0," + dark.toFixed(3) + ")";
      octx.fillRect(0, 0, W, H);
    }
  }
  return totalMs;
}

function Icon({ name, size = 16, className = "", style = {} }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className, style };
  switch (name) {
    case "upload": return <svg {...p}><path d="M12 3v12" /><path d="m7 8 5-5 5 5" /><path d="M5 21h14" /></svg>;
    case "play": return <svg {...p} fill="currentColor"><polygon points="6 3 20 12 6 21 6 3" /></svg>;
    case "pause": return <svg {...p} fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "chevronLeft": return <svg {...p}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevronRight": return <svg {...p}><polyline points="9 18 15 12 9 6" /></svg>;
    case "sparkles": return <svg {...p} fill="currentColor" stroke="none"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6z" /></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "arrowUp": return <svg {...p}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>;
    case "arrowDown": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></svg>;
    case "check": return <svg {...p}><polyline points="20 6 9 17 4 12" /></svg>;
    case "rotate": return <svg {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>;
    case "loader": return <svg {...p} className={"spin " + className}><circle cx="12" cy="12" r="9" strokeDasharray="40 20" /></svg>;
    case "film": return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="7" y1="3" x2="7" y2="21" /><line x1="17" y1="3" x2="17" y2="21" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /></svg>;
    case "volume": return <svg {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 5.5a9 9 0 0 1 0 13" /></svg>;
    case "music": return <svg {...p}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>;
    default: return null;
  }
}

// One Ken-Burns-animated image layer. Mounts at opacity 0 and fades in,
// and continuously updates its own transform via rAF while active.
function SceneLayer({ src, active, isPlaying, getProgress, kbParams, fadeMs }) {
  const imgRef = useRef(null);
  const [faded, setFaded] = useState(false);

  useEffect(() => {
    setFaded(false);
    const t = requestAnimationFrame(() => setFaded(true));
    return () => cancelAnimationFrame(t);
  }, [src]);

  useEffect(() => {
    if (!active) return;
    let raf;
    const tick = () => {
      applyKenBurns(imgRef.current, kbParams, getProgress());
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [active, isPlaying, kbParams]);

  useEffect(() => {
    if (!active) applyKenBurns(imgRef.current, kbParams, 0);
  }, [active, kbParams]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt=""
      className={`kb-img kb-fade absolute inset-0 w-full h-full object-cover ${faded ? "kb-fade-in" : ""}`}
      style={{ zIndex: active ? 2 : 1, ...(fadeMs ? { transitionDuration: `${fadeMs}ms` } : {}) }}
    />
  );
}

// The proxy only serves a URL the server signed, so both the url and its signature travel
// together everywhere a clip does.
function proxyUrlFor(clip) {
  const url = typeof clip === "string" ? clip : clip.url;
  const sig = typeof clip === "string" ? "" : clip.sig || "";
  return "/api/proxy-video?url=" + encodeURIComponent(url) + "&sig=" + encodeURIComponent(sig);
}

// Loads a generated clip into a <video> ready for canvas compositing. It is fetched through our
// own proxy and handed to the element as a blob: URL, which makes it same-origin - without that
// the canvas would be tainted and neither the player nor the export could read a pixel back.
async function loadClipVideo(clip) {
  const res = await fetch(proxyUrlFor(clip));
  if (!res.ok) throw new Error("Kunne ikke hente det genererede klip.");
  const blob = await res.blob();
  const v = document.createElement("video");
  v.src = URL.createObjectURL(blob);
  v.muted = true;
  v.playsInline = true;
  v.preload = "auto";
  v.loop = false;
  await new Promise((resolve, reject) => {
    v.onloadeddata = resolve;
    v.onerror = () => reject(new Error("Klippet kunne ikke afkodes."));
  });
  return v;
}

function releaseShot(shot) {
  if (shot && shot.video) {
    try { shot.video.pause(); } catch (e) {}
    if (shot.video.src.startsWith("blob:")) URL.revokeObjectURL(shot.video.src);
  }
}

// The whole walkthrough on ONE canvas. Each photo is prescaled once to a plate sized for the
// current output (see buildPlate) and then played back by moving a rectangle across it.
//
// Nothing is rebuilt during playback, which is what keeps the cuts clean: an earlier design gave
// every shot its own layer, and because each layer rebuilt when its source changed, the outgoing
// and incoming shots rebuilt at the same instant and neither drew anything - a black frame at
// every cut.
//
// Composition goes through composeShowFrame, the same function the exporter uses, so the file
// that is downloaded is frame for frame what was on screen.
function FlythroughStage({ stills, specs, clips, onError }) {
  const hostRef = useRef(null);

  useEffect(() => {
    const host = hostRef.current;
    if (!host || stills.length === 0) return;
    let disposed = false;
    let raf = 0;

    const out = document.createElement("canvas");
    out.style.width = "100%";
    out.style.height = "100%";
    out.style.display = "block";
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = "high";
    host.innerHTML = "";
    host.appendChild(out);

    let images = null;   // decoded photos, full size
    let videos = null;   // generated clips, when the high-quality pass has produced them
    let shots = null;    // { plate | video, spec } per shot, sized for the CURRENT canvas
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = 0, H = 0;

    // Rebuilds the plates whenever the canvas size changes materially. Reading the size here
    // rather than once at mount is what stops a late stylesheet or a rotated phone from leaving
    // a canvas that does not match its box - the cause of the black bars reported on mobile.
    const refit = () => {
      if (disposed) return false;
      const cw = host.clientWidth, ch = host.clientHeight;
      if (cw < 2 || ch < 2) return false;
      const nw = Math.round(cw * dpr), nh = Math.round(ch * dpr);
      if (nw === W && nh === H) return true;
      W = nw; H = nh;
      out.width = W;
      out.height = H;
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = "high";
      // A shot backed by a generated clip needs no plate: the clip carries its own camera move
      // and is simply cover-fitted, so a resize costs nothing for those.
      if (images) {
        shots = images.map((img, i) => (videos && videos[i]
          ? { video: videos[i], spec: specs[i] }
          : { plate: buildPlate(img, W, H), spec: specs[i] }));
      }
      return true;
    };

    const build = async () => {
      const loaded = [];
      for (let i = 0; i < stills.length; i++) {
        const img = await loadImageEl(stills[i]);
        if (disposed) return;
        loaded.push(img);
      }
      images = loaded;
      if (clips && clips.length) {
        // Any clip that fails to load simply falls back to its still, so one bad clip degrades
        // that single shot instead of taking down the whole walkthrough.
        videos = [];
        for (let i = 0; i < stills.length; i++) {
          if (!clips[i]) { videos.push(null); continue; }
          try {
            const v = await loadClipVideo(clips[i]);
            if (disposed) { releaseShot({ video: v }); return; }
            videos.push(v);
          } catch (e) { videos.push(null); }
        }
      }
      W = H = 0; // force a refit so the plates are built for the real canvas size
      refit();
      const t0 = performance.now();
      const tick = () => {
        if (disposed) return;
        raf = requestAnimationFrame(tick);
        if (!refit() || !shots) return;
        composeShowFrame(octx, W, H, shots, performance.now() - t0);
      };
      raf = requestAnimationFrame(tick);
    };

    build().catch((e) => { if (!disposed && onError) onError(e.message || "Kunne ikke indlæse billederne."); });

    const ro = new ResizeObserver(() => refit());
    ro.observe(host);

    return () => {
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      if (videos) videos.forEach((v) => releaseShot({ video: v }));
      images = null;
      shots = null;
      host.innerHTML = "";
    };
    // eslint-disable-next-line
  }, [stills, specs, clips]);

  return <div ref={hostRef} className="absolute inset-0 w-full h-full" />;
}

// ---- Video export -----------------------------------------------------------------------
// Renders the whole walkthrough frame by frame into one canvas and records it, reusing the
// exact scene and camera code the live preview uses. Runs entirely in the browser: no render
// server, no upload, no per-video cost.
// Full HD in every orientation. The old 720-line sizes were a phone-first compromise; a listing
// video goes on a property site and a big screen as often as it goes on Reels.
const EXPORT_FORMATS = {
  "16:9": { w: 1920, h: 1080, ar: 16 / 9, label: "Bredformat", where: "Boligsite, YouTube, storskærm" },
  "9:16": { w: 1080, h: 1920, ar: 9 / 16, label: "Højformat", where: "Reels, TikTok, Stories" },
  "1:1": { w: 1080, h: 1080, ar: 1, label: "Kvadratisk", where: "Instagram-feed" },
};

function pickRecorderMime() {
  const candidates = [
    // Codec pairs first, so the chosen container is one that can actually carry the music track.
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm",
  ];
  if (!window.MediaRecorder || !window.MediaRecorder.isTypeSupported) return "";
  for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

const HIDDEN_TAB_MSG =
  "Optagelsen kræver at denne fane er fremme. Browseren sætter canvas-optagelse på pause i en " +
  "baggrundsfane, og filen bliver tom. Lad fanen være synlig, og prøv igen.";

async function exportFlythroughVideo({ stills, specs, clips, format, fps = 30, onProgress, musicBytes }) {
  if (!window.MediaRecorder) throw new Error("Din browser understøtter ikke videooptagelse. Prøv Chrome eller Safari 17+.");
  const mime = pickRecorderMime();
  if (!mime) throw new Error("Din browser kan ikke optage video fra et canvas.");
  // A backgrounded tab throttles timers and stops compositing the canvas, so MediaRecorder
  // receives nothing and the recording comes out as a zero-byte file. Caught here rather than
  // handed to the user as a download link that yields a broken file.
  if (document.hidden) throw new Error(HIDDEN_TAB_MSG);
  const fmt = EXPORT_FORMATS[format];
  const w = fmt.w, h = fmt.h;

  const out = document.createElement("canvas");
  out.width = w;
  out.height = h;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = "high";
  octx.fillStyle = "#000";
  octx.fillRect(0, 0, w, h);

  const shots = [];
  const cleanup = () => { shots.forEach(releaseShot); shots.length = 0; };
  // Declared out here, not inside the try: the finally below shuts them down, and a `let` inside
  // the try block would not be in scope there.
  let audioCtx = null, musicNodes = null;

  try {
    // Sources are built up front, at this format's size, so no frame stalls mid-recording.
    // A generated clip is used where one exists; otherwise the still, so a half-generated
    // walkthrough still exports as a complete video.
    for (let i = 0; i < stills.length; i++) {
      let shot = null;
      if (clips && clips[i]) {
        try { shot = { video: await loadClipVideo(clips[i]), spec: specs[i] }; } catch (e) { shot = null; }
      }
      if (!shot) {
        const img = await loadImageEl(stills[i]);
        shot = { plate: buildPlate(img, w, h), spec: specs[i] };
      }
      shots.push(shot);
      if (onProgress) onProgress({ phase: "prepare", current: i + 1, total: stills.length });
    }

    const totalMs = shots.reduce((a, s) => a + s.spec.durationMs, 0);
    const totalFrames = Math.max(1, Math.round((totalMs / 1000) * fps));

    // Music is mixed in as a real audio track on the recorded stream, so the downloaded file
    // carries it rather than the agent having to add it in another program. It is faded out over
    // the last second, and cut to the video's length.
    const totalSeconds = totalMs / 1000;
    const buildMusicTrack = async () => {
      if (!musicBytes) return null;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
        const buf = await audioCtx.decodeAudioData(musicBytes.slice(0));
        const dest = audioCtx.createMediaStreamDestination();
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        // A track shorter than the video loops rather than leaving silence at the end.
        src.loop = true;
        const gain = audioCtx.createGain();
        const FADE = Math.min(1.2, totalSeconds / 4);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.85, audioCtx.currentTime + Math.min(1, FADE));
        gain.gain.setValueAtTime(0.85, audioCtx.currentTime + Math.max(0, totalSeconds - FADE));
        gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + totalSeconds);
        src.connect(gain); gain.connect(dest);
        musicNodes = { src, dest };
        return dest.stream.getAudioTracks()[0];
      } catch (e) {
        // Music is a nice-to-have; a video without it beats no video at all.
        return null;
      }
    };
    const musicTrack = await buildMusicTrack();

    const stream = out.captureStream(0);
    const track = stream.getVideoTracks()[0];
    // Safari and older Chrome don't expose requestFrame on the capture track; there the stream
    // has to sample the canvas on its own clock instead of being pushed one frame at a time.
    const manualFrames = typeof track.requestFrame === "function";
    const baseStream = manualFrames ? stream : out.captureStream(fps);
    const liveStream = musicTrack
      ? new MediaStream([...baseStream.getVideoTracks(), musicTrack])
      : baseStream;
    const chunks = [];
    // Scaled to the pixel count: 1080p needs roughly twice the bitrate 720p did, and a slow pan
    // across a detailed room is exactly the content that shows compression blocking.
    const bitrate = Math.round(Math.min(24e6, Math.max(10e6, (w * h * fps) / 1000 * 0.42)));
    const recorder = new MediaRecorder(liveStream, { mimeType: mime, videoBitsPerSecond: bitrate });
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const finished = new Promise((res) => { recorder.onstop = res; });
    recorder.start();
    if (musicNodes) { try { musicNodes.src.start(); } catch (e) {} }

    // If the tab is hidden part-way through, everything recorded from that point is lost. Stop
    // and say so, rather than finishing and handing over a truncated file.
    let wentHidden = false;
    const onVis = () => { if (document.hidden) wentHidden = true; };
    document.addEventListener("visibilitychange", onVis);

    // MediaRecorder timestamps frames by wall clock, so the loop is paced to real time rather
    // than run flat out - otherwise a slow machine would produce a correct-looking but
    // slow-motion file.
    const t0 = performance.now();
    try {
      for (let f = 0; f < totalFrames; f++) {
        if (wentHidden) break;
        const tMs = (f / fps) * 1000;
        // Same composer as the live preview, so the file is frame for frame what was on screen.
        composeShowFrame(octx, w, h, shots, tMs);
        if (manualFrames) track.requestFrame();

        if (f % 5 === 0 && onProgress) onProgress({ phase: "render", current: f + 1, total: totalFrames });
        const behind = performance.now() - t0;
        const wait = tMs - behind;
        await new Promise((r) => setTimeout(r, wait > 1 ? wait : 0));
      }
    } finally {
      document.removeEventListener("visibilitychange", onVis);
    }

    await new Promise((r) => setTimeout(r, 150));
    recorder.stop();
    await finished;
    const blob = new Blob(chunks, { type: mime.split(";")[0] });
    // Last line of defence: whatever the cause, never hand back a file that isn't a video.
    // An empty or near-empty blob means the recorder got nothing - most often a hidden tab.
    if (blob.size < 2048) throw new Error(wentHidden || document.hidden ? HIDDEN_TAB_MSG : "Optagelsen blev tom. Prøv igen med fanen fremme.");
    if (wentHidden) throw new Error(HIDDEN_TAB_MSG);
    return blob;
  } finally {
    cleanup();
    if (musicNodes) { try { musicNodes.src.stop(); } catch (e) {} }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
  }
}

function Rundvis() {
  const [step, setStep] = useState(1);
  const [videoMode, setVideoMode] = useState(null); // basic | highend
  const [propertyType, setPropertyType] = useState("villa"); // kept for the legacy script path
  const [images, setImages] = useState([]);
  const [address, setAddress] = useState("");
  const [agentName, setAgentName] = useState("");
  const [notes, setNotes] = useState("");
  const [scenes, setScenes] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [genError, setGenError] = useState("");

  const [isPlaying, setIsPlaying] = useState(false);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [prevIndex, setPrevIndex] = useState(null);
  const [voices, setVoices] = useState([]); // [{status:'idle'|'loading'|'ready'|'error', url, mode:'audio'|'browser'}]
  const [voicesPreparing, setVoicesPreparing] = useState(false);
  const [voiceOverallError, setVoiceOverallError] = useState("");
  const [musicOn, setMusicOn] = useState(false);

  // Walkthrough state: deterministic 2D camera motion (see the module-level
  // depth/parallax helpers above) - no AI video generation is involved any more, so there's no
  // upload step and no video URL to track, just the resized stills and their depth maps.
  const [flythroughStatus, setFlythroughStatus] = useState("idle"); // idle|processing|done|error
  const [flythroughError, setFlythroughError] = useState("");
  const [flythroughProgress, setFlythroughProgress] = useState({ current: 0, total: 0 });
  const [flythroughStills, setFlythroughStills] = useState([]); // resized data-URLs actually used, in upload order

  // Video export state: the walkthrough is rendered to a real file in the browser (see
  // exportFlythroughVideo), so an agent can actually post it instead of only viewing it here.
  const [exportStatus, setExportStatus] = useState("idle"); // idle|working|done|error
  const [exportProgress, setExportProgress] = useState({ phase: "", current: 0, total: 0 });
  const [exportError, setExportError] = useState("");
  const [exportFile, setExportFile] = useState(null); // { url, name }
  // Which shape the walkthrough is previewed in. Defaults to wide: that is how a listing video is
  // watched on a property site, and it is the format the photos were shot in.
  const [previewFormat, setPreviewFormat] = useState("16:9");

  // Music. The agent supplies the track: bundling one would mean shipping music we have no
  // licence to redistribute, and a listing video is published publicly. An uploaded file is
  // decoded once and reused for both the preview and the exported file.
  const [musicName, setMusicName] = useState("");
  const [musicError, setMusicError] = useState("");
  const [musicOnPreview, setMusicOnPreview] = useState(true);
  const musicBufferRef = useRef(null);   // decoded AudioBuffer
  const musicRawRef = useRef(null);      // the original bytes, re-decoded for each export
  const previewAudioRef = useRef(null);  // <audio> used only for the on-page preview

  // High-quality pass: each photo is sent to an image-to-video model, which returns a clip with
  // real camera movement through the room. Kept strictly separate from the free preview, because
  // it costs money per run - the preview is the storyboard the agent approves first.
  const [hqStatus, setHqStatus] = useState("idle"); // idle|working|done|error
  const [hqProgress, setHqProgress] = useState({ current: 0, total: 0, phase: "" });
  const [hqError, setHqError] = useState("");
  const [hqClips, setHqClips] = useState(null); // array of clip URLs, one per still (null = not generated)
  const [hqModel, setHqModel] = useState(null);   // chosen model key; null until the registry loads
  const [hqModels, setHqModels] = useState([]);   // registry from /api/generate-clip/models
  // Side-by-side bake-off: the same photo through every model at once. Which model suits real
  // listing photos is not answerable from documentation, and this makes answering it cost about
  // a krone per model instead of a whole property per model.
  const [compareRuns, setCompareRuns] = useState(null); // [{key,label,usdPerClip,status,clipUrl,error}]
  // Which photo the bake-off and the single-photo test use. Defaults to the SECOND photo, not
  // the first: by the app's own upload guidance photo 1 is the facade, and an exterior is the
  // easiest thing these models have to do - open scene, no doorframes, no furniture to bend.
  // Judging a model on the facade would flatter every one of them and could pick the wrong one.
  const [compareIndex, setCompareIndex] = useState(0);
  // Test quality trades resolution for price on models that support it. It exists because the
  // opposite default was a costly mistake: generating at full resolution while showing no price
  // burned through an account's credit in three clips.
  const [hqQuality, setHqQuality] = useState("test");
  useEffect(() => {
    if (flythroughStills.length > 1) setCompareIndex(1);
    else setCompareIndex(0);
  }, [flythroughStills.length]);

  // The model list comes from the server so there is only one place where models are defined.
  useEffect(() => {
    let cancelled = false;
    fetch("/api/generate-clip/models")
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        if (cancelled || !d) return;
        setHqModels(d.models || []);
        setHqModel((cur) => cur || d.defaultModel);
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const fileInputRef = useRef(null);
  const audioRef = useRef(null);
  const sceneStartRef = useRef(0);
  const audioCtxRef = useRef(null);
  const musicNodesRef = useRef(null);

  const kbParamsList = useMemo(() => scenes.map((_, i) => kenBurnsParamsFor(i)), [scenes.length]);

  const handleFiles = (fileList) => {
    const files = Array.from(fileList).slice(0, 20 - images.length);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = (e) => setImages((prev) => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, src: e.target.result }]);
      reader.readAsDataURL(file);
    });
  };
  const removeImage = (id) => setImages((prev) => prev.filter((i) => i.id !== id));
  const moveImage = (idx, dir) => {
    setImages((prev) => {
      const next = [...prev]; const target = idx + dir;
      if (target < 0 || target >= next.length) return prev;
      [next[idx], next[target]] = [next[target], next[idx]];
      return next;
    });
  };

  const generateScript = async () => {
    setGenerating(true); setGenError("");
    try {
      const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label || "bolig";
      const response = await fetch("/api/generate-script", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ propertyTypeLabel: typeLabel, address, agentName, notes, sceneCount: images.length }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ukendt fejl fra serveren.");
      const lines = data.lines || [];
      setScenes(images.map((img, i) => ({ imageId: img.id, text: lines[i] || "" })));
      setStep(3);
    } catch (err) {
      setGenError(`Kunne ikke generere manuskript: ${err.message}. Prøv igen, eller skriv scenerne manuelt herunder.`);
      if (scenes.length === 0) setScenes(images.map((img) => ({ imageId: img.id, text: "" })));
    } finally { setGenerating(false); }
  };

  const updateScene = (idx, text) => setScenes((prev) => { const n = [...prev]; n[idx] = { ...n[idx], text }; return n; });

  // ---- Voice generation (ElevenLabs, with per-scene browser-TTS fallback) ----
  const generateVoiceForIndex = async (idx, text) => {
    try {
      const res = await fetch("/api/generate-voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("voice-api-failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      return { status: "ready", url, mode: "audio" };
    } catch (err) {
      return { status: "ready", url: null, mode: "browser" };
    }
  };

  const prepareVoices = useCallback(async () => {
    if (!scenes.length) return;
    setVoicesPreparing(true);
    setVoiceOverallError("");
    const initial = scenes.map(() => ({ status: "loading", url: null, mode: null }));
    setVoices(initial);
    const results = new Array(scenes.length);
    const concurrency = 3;
    let cursor = 0;
    let anyAudioFailed = false;
    async function worker() {
      while (cursor < scenes.length) {
        const i = cursor++;
        const r = await generateVoiceForIndex(i, scenes[i].text);
        if (r.mode === "browser") anyAudioFailed = true;
        results[i] = r;
        setVoices((prev) => { const n = [...prev]; n[i] = r; return n; });
      }
    }
    await Promise.all(Array.from({ length: concurrency }, worker));
    if (anyAudioFailed) {
      setVoiceOverallError("Nogle scener kunne ikke få en AI-stemme (ElevenLabs) og bruger i stedet browserens indbyggede tale som reserve.");
    }
    setVoicesPreparing(false);
  }, [scenes]);

  useEffect(() => {
    if (step === 4 && scenes.length > 0 && voices.length === 0) {
      prepareVoices();
    }
  }, [step, scenes, voices.length, prepareVoices]);

  // ---- Ambient background music (Web Audio, no external file needed) ----
  const ensureAudioCtx = () => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  };
  const startMusic = () => {
    const ctx = ensureAudioCtx();
    if (!ctx || musicNodesRef.current) return;
    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.5);
    master.connect(ctx.destination);
    const freqs = [130.81, 164.81, 196.0]; // soft C major-ish pad
    const oscs = freqs.map((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.15;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(master);
      osc.start(); lfo.start();
      return { osc, lfo };
    });
    musicNodesRef.current = { master, oscs };
  };
  const stopMusic = () => {
    const nodes = musicNodesRef.current;
    const ctx = audioCtxRef.current;
    if (!nodes || !ctx) return;
    nodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    setTimeout(() => {
      nodes.oscs.forEach(({ osc, lfo }) => { try { osc.stop(); lfo.stop(); } catch (e) {} });
    }, 700);
    musicNodesRef.current = null;
  };
  useEffect(() => {
    if (isPlaying && musicOn) startMusic();
    if ((!isPlaying || !musicOn)) stopMusic();
    // eslint-disable-next-line
  }, [isPlaying, musicOn]);
  useEffect(() => () => { stopMusic(); if (audioCtxRef.current) audioCtxRef.current.close(); }, []);

  // ---- Playback engine ----
  const advanceScene = useCallback(() => {
    setCurrentIndex((i) => {
      if (i + 1 >= scenes.length) { setIsPlaying(false); return 0; }
      setPrevIndex(i);
      return i + 1;
    });
  }, [scenes.length]);

  useEffect(() => {
    if (!isPlaying) return;
    const voice = voices[currentIndex];
    if (!voice || voice.status !== "ready") return;
    sceneStartRef.current = performance.now();
    if (voice.mode === "audio" && voice.url) {
      const audio = audioRef.current;
      audio.src = voice.url;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      const onEnded = () => advanceScene();
      audio.addEventListener("ended", onEnded);
      return () => audio.removeEventListener("ended", onEnded);
    } else {
      const text = scenes[currentIndex]?.text || "";
      if (text && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const daVoice = window.speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("da"));
        if (daVoice) utter.voice = daVoice;
        utter.lang = "da-DK"; utter.rate = 0.96;
        utter.onend = () => advanceScene();
        utter.onerror = () => advanceScene();
        window.speechSynthesis.speak(utter);
        return () => window.speechSynthesis.cancel();
      } else {
        const t = setTimeout(advanceScene, FALLBACK_SCENE_MS);
        return () => clearTimeout(t);
      }
    }
    // eslint-disable-next-line
  }, [isPlaying, currentIndex, voices]);

  useEffect(() => {
    if (prevIndex === null) return;
    const t = setTimeout(() => setPrevIndex(null), 600);
    return () => clearTimeout(t);
  }, [prevIndex]);

  const getProgress = useCallback(() => {
    const voice = voices[currentIndex];
    if (voice && voice.mode === "audio" && audioRef.current && audioRef.current.duration) {
      return audioRef.current.currentTime / audioRef.current.duration;
    }
    const elapsed = performance.now() - sceneStartRef.current;
    return elapsed / FALLBACK_SCENE_MS;
  }, [voices, currentIndex]);

  const allVoicesReady = voices.length === scenes.length && voices.every((v) => v && v.status === "ready");

  // ---- Walkthrough: deterministic 2D camera motion - see the motion helpers
  // helpers near the top of this file. Every uploaded photo (up to MAX_FLYTHROUGH_IMAGES) gets a
  // real per-pixel depth map estimated entirely client-side, then a virtual camera moves through
  // the resulting 3D mesh along a fixed path. No AI video generation, no upload, no per-run cost,
  // and - critically - no risk of the camera "inventing" a wrong direction: the same photos
  // always produce the exact same depth maps and therefore the exact same moves. (The old
  // Luma-based AI clip code is still in api/generate-flythrough/ but is no longer wired in here.)
  // 20, not 8. A real listing video runs 40-50 seconds, and at this edit's pace that is 16-20
  // shots - the reference film the agent supplied had 14 clips across 40.7s. Eight photos made
  // a 20-second video, which is short for a property.
  const MAX_FLYTHROUGH_IMAGES = 20;
  // How many clips are generated at once. Sequentially, 18 clips at ~2 minutes each is over half
  // an hour of staring at a progress bar; three at a time brings that to about twelve minutes.
  // Kept low on purpose: the providers rate-limit, and a burst of twenty parallel jobs is the
  // kind of thing that gets an account throttled.
  const HQ_CONCURRENCY = 3;
  // Photos are kept at up to this size. A 1920-wide export at the tightest 10% crop samples at
  // most ~2130 source pixels across, so 2560 leaves headroom while keeping several photos in
  // memory comfortably. Anything smaller is left exactly as uploaded and never re-encoded.
  const SOURCE_MAX = 2560;

  // Downscale a data-URL image in the browser (canvas). Returns the original untouched when it
  // is already within bounds, so nothing is ever re-encoded for no reason.
  const resizeImageDataUrl = (dataUrl, maxDimension) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(dataUrl); return; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const c = canvas.getContext("2d");
        c.imageSmoothingEnabled = true;
        c.imageSmoothingQuality = "high";
        c.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.95));
      };
      img.onerror = () => resolve(dataUrl); // fall back to the original if decoding fails
      img.src = dataUrl;
    });

  // Prepares the photos for playback. There is no model to download and no inference to wait
  // for any more - only a resize where a photo is larger than the plates will ever need - so
  // this finishes in well under a second instead of the forty it used to take.
  const runFlythrough = async () => {
    setFlythroughStatus("processing");
    setFlythroughError("");
    setExportStatus("idle");
    setExportError("");
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    setHqClips(null);
    setHqStatus("idle");
    setHqError("");
    try {
      const used = images.slice(0, MAX_FLYTHROUGH_IMAGES);
      setFlythroughProgress({ current: 0, total: used.length });
      const stills = [];
      for (let i = 0; i < used.length; i++) {
        stills.push(await resizeImageDataUrl(used[i].src, SOURCE_MAX));
        setFlythroughProgress({ current: i + 1, total: used.length });
      }
      setFlythroughStills(stills);
      setFlythroughStatus("done");
    } catch (err) {
      setFlythroughError(err.message || "Gennemgangen fejlede.");
      setFlythroughStatus("error");
    }
  };

  const regenerateFlythrough = () => runFlythrough();

  // Decodes an uploaded track once. Keeping the raw bytes too, because an AudioBuffer cannot be
  // handed to a second AudioContext and the export makes its own.
  const handleMusicFile = async (file) => {
    if (!file) return;
    setMusicError("");
    try {
      const bytes = await file.arrayBuffer();
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) throw new Error("Din browser understøtter ikke lydafspilning.");
      const ctx = new Ctx();
      // decodeAudioData consumes the buffer it is given, so it gets a copy.
      const buf = await ctx.decodeAudioData(bytes.slice(0));
      ctx.close();
      musicRawRef.current = bytes;
      musicBufferRef.current = buf;
      setMusicName(`${file.name} · ${Math.round(buf.duration)} sek.`);
      if (previewAudioRef.current) {
        URL.revokeObjectURL(previewAudioRef.current.src);
        previewAudioRef.current.src = URL.createObjectURL(file);
      } else {
        const a = new Audio(URL.createObjectURL(file));
        a.loop = true;
        previewAudioRef.current = a;
      }
    } catch (err) {
      setMusicError("Kunne ikke læse lydfilen. Prøv en MP3, M4A eller WAV.");
      musicBufferRef.current = null;
      musicRawRef.current = null;
      setMusicName("");
    }
  };

  // The preview track follows the page: it plays while the walkthrough is on screen and stops
  // when it is not, so music never keeps running behind a different step.
  useEffect(() => {
    const a = previewAudioRef.current;
    if (!a) return;
    const spiller = step === 3 && musicOnPreview && flythroughStatus === "done";
    if (spiller) { a.currentTime = 0; a.play().catch(() => {}); } else { a.pause(); }
    return () => { a.pause(); };
  }, [step, musicOnPreview, flythroughStatus, musicName]);

  // ---- Model bake-off ----
  // Sends ONE photo to every model at once and shows the results side by side. Run in parallel
  // because the jobs are independent: three models finish in about the time one takes, instead
  // of three times as long.
  //
  // The photo is uploaded ONCE and the same URL handed to all three, so the comparison is of the
  // models and nothing else.
  // What one clip costs on a given model at the current quality, or null when the provider
  // bills it on the user's own account in a way we cannot price.
  const prisPrKlip = (m) => {
    if (!m) return null;
    if (m.priceByQuality) return m.priceByQuality[hqQuality] ?? m.priceByQuality.test;
    return m.usdPerClip > 0 ? m.usdPerClip : null;
  };

  const runModelComparison = async () => {
    if (!hqModels.length || flythroughStills.length === 0) return;
    if (compareRuns && compareRuns.some((r) => r.status === "working")) return;

    const initial = hqModels.map((m) => ({
      key: m.key, label: m.label, usdPerClip: m.usdPerClip, status: "working", clipUrl: null, error: "",
    }));
    setCompareRuns(initial);

    let imageUrl;
    try {
      const up = await fetch("/api/upload-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dataUrl: flythroughStills[compareIndex], filename: `rundvis-sammenlign-${Date.now()}.jpg` }),
      });
      const upJson = await up.json();
      if (!up.ok) throw new Error(upJson.error || "Kunne ikke uploade billedet.");
      imageUrl = upJson.url;
    } catch (err) {
      setCompareRuns(initial.map((r) => ({ ...r, status: "error", error: err.message })));
      return;
    }

    const motion = flythroughParams[compareIndex] ? flythroughParams[compareIndex].type : "push";
    const update = (key, patch) =>
      setCompareRuns((prev) => (prev || []).map((r) => (r.key === key ? { ...r, ...patch } : r)));

    await Promise.all(
      hqModels.map(async (m) => {
        try {
          const create = await fetch("/api/generate-clip/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ imageUrl, motion, model: m.key, aspectRatio: previewFormat, seed: 1000, quality: hqQuality }),
          });
          const created = await create.json();
          if (!create.ok) throw new Error(created.error || "Kunne ikke starte klippet.");

          for (let attempt = 0; attempt < 150; attempt++) {
            await new Promise((r) => setTimeout(r, 4000));
            const st = await fetch("/api/generate-clip/status", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                provider: created.provider, id: created.id,
                statusUrl: created.statusUrl, responseUrl: created.responseUrl,
              }),
            });
            const stJson = await st.json();
            if (!st.ok) throw new Error(stJson.error || "Kunne ikke hente status.");
            if (stJson.done) { update(m.key, { status: "done", clipUrl: stJson.videoUrl, sig: stJson.sig }); return; }
          }
          throw new Error("Blev ikke færdig i tide.");
        } catch (err) {
          // One model failing says something useful about that model; it must not take the
          // other two down with it.
          update(m.key, { status: "error", error: err.message });
        }
      })
    );
  };

  // The whole edit - shot design, beat-aligned durations, transitions and speed curves.
  const flythroughParams = useMemo(
    () => buildEditPlan(flythroughStills.length),
    [flythroughStills.length]
  );

  // ---- High-quality pass ----
  // Sends every photo to the video model and collects the finished clips. Sequential on purpose:
  // it keeps the progress readout honest, and it means a failure part-way through has cost the
  // price of the clips actually produced rather than all of them at once.
  // Generates clips for a set of photo indexes. Passing a single index is how the "test one
  // photo" button works: comparing three models then costs about a krone each instead of the
  // price of three whole properties.
  const runHighQuality = async (onlyIndexes) => {
    if (hqStatus === "working" || flythroughStills.length === 0) return;
    const indexes = onlyIndexes || flythroughStills.map((_, i) => i);
    setHqStatus("working");
    setHqError("");
    setExportStatus("idle");
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });

    // Keep clips we already paid for unless this is a full run.
    const clips = onlyIndexes && hqClips ? hqClips.slice() : new Array(flythroughStills.length).fill(null);
    if (!onlyIndexes) setHqClips(null);
    try {
      let done = 0;
      setHqProgress({ current: 0, total: indexes.length, phase: "generate" });

      // One photo, start to finish. Each runs independently, so a slow clip does not hold up
      // the others.
      const lavKlip = async (i) => {
        const up = await fetch("/api/upload-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dataUrl: flythroughStills[i], filename: `rundvis-${Date.now()}-${i}.jpg` }),
        });
        const upJson = await up.json();
        if (!up.ok) throw new Error(upJson.error || "Kunne ikke uploade billedet.");

        const create = await fetch("/api/generate-clip/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageUrl: upJson.url,
            motion: flythroughParams[i] ? flythroughParams[i].type : "push",
            model: hqModel,
            // Generate natively in the shape the video will be shown in, rather than cropping a
            // widescreen clip down afterwards - on the models that support it.
            aspectRatio: previewFormat,
            // Fixed per photo index, so on a model with a seed a regenerated walkthrough is
            // identical rather than merely similar.
            seed: 1000 + i,
            quality: hqQuality,
          }),
        });
        const created = await create.json();
        if (!create.ok) throw new Error(created.error || "Kunne ikke starte videoklippet.");

        for (let attempt = 0; attempt < 150; attempt++) {
          await new Promise((r) => setTimeout(r, 4000));
          const st = await fetch("/api/generate-clip/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider: created.provider, id: created.id,
              statusUrl: created.statusUrl, responseUrl: created.responseUrl,
            }),
          });
          const stJson = await st.json();
          if (!st.ok) throw new Error(stJson.error || "Kunne ikke hente status.");
          if (stJson.done) return { url: stJson.videoUrl, sig: stJson.sig };
        }
        throw new Error(`Klip ${i + 1} blev ikke færdigt i tide.`);
      };

      // A small worker pool: HQ_CONCURRENCY jobs in flight, each taking the next photo off the
      // queue as it finishes.
      const koe = indexes.slice();
      const fejl = [];
      const arbejder = async () => {
        while (koe.length) {
          const i = koe.shift();
          try {
            clips[i] = await lavKlip(i);
            // Published as we go, so the walkthrough visibly improves clip by clip rather than
            // leaving the agent watching a spinner.
            setHqClips(clips.slice());
          } catch (err) {
            // One photo failing is worth reporting, but it must not throw away the clips that
            // succeeded - those are already paid for.
            fejl.push(`Billede ${i + 1}: ${err.message}`);
          }
          done++;
          setHqProgress({ current: done, total: indexes.length, phase: "generate" });
        }
      };
      await Promise.all(Array.from({ length: Math.min(HQ_CONCURRENCY, koe.length) }, arbejder));

      if (fejl.length) {
        // Show the distinct reasons rather than only the first: when all clips fail the same
        // way that is one line, and when they fail differently that difference is the clue.
        const unikke = [...new Set(fejl.map((f) => f.replace(/^Billede \d+: /, "")))];
        setHqError(
          `${fejl.length} af ${indexes.length} klip fejlede. ` +
          unikke.slice(0, 2).join(" — ") +
          (unikke.length > 2 ? ` (+${unikke.length - 2} andre årsager)` : "")
        );
        setHqStatus(clips.some(Boolean) ? "done" : "error");
      } else {
        setHqStatus("done");
      }
    } catch (err) {
      setHqError(err.message || "Genereringen fejlede.");
      setHqStatus("error");
      // Whatever did finish is kept - those clips are already paid for.
      if (clips.some(Boolean)) setHqClips(clips.slice());
    }
  };

  // Renders the walkthrough to a downloadable file in the requested aspect ratio. The heavy
  // work happens in exportFlythroughVideo; this only tracks progress and hands back a blob URL.
  const handleExport = async (format) => {
    if (exportStatus === "working" || flythroughStills.length === 0) return;
    setExportStatus("working");
    setExportError("");
    setExportProgress({ phase: "prepare", current: 0, total: flythroughStills.length });
    if (exportFile) { URL.revokeObjectURL(exportFile.url); setExportFile(null); }
    try {
      const blob = await exportFlythroughVideo({
        stills: flythroughStills,
        specs: flythroughParams,
        clips: hqClips,
        musicBytes: musicRawRef.current,
        format,
        fps: 30,
        onProgress: setExportProgress,
      });
      const ext = blob.type.indexOf("mp4") !== -1 ? "mp4" : "webm";
      setExportFile({
        url: URL.createObjectURL(blob),
        name: `rundvis-gennemgang-${format.replace(":", "x")}.${ext}`,
      });
      setExportStatus("done");
    } catch (err) {
      setExportError(err.message || "Eksporten fejlede.");
      setExportStatus("error");
    }
  };

  const togglePlay = () => {
    if (isPlaying) {
      audioRef.current && audioRef.current.pause();
      window.speechSynthesis && window.speechSynthesis.cancel();
      setIsPlaying(false);
    } else {
      if (!allVoicesReady) return;
      if (currentIndex >= scenes.length) setCurrentIndex(0);
      setIsPlaying(true);
    }
  };
  const restart = () => {
    audioRef.current && audioRef.current.pause();
    window.speechSynthesis && window.speechSynthesis.cancel();
    setPrevIndex(null);
    setCurrentIndex(0);
    setIsPlaying(true);
  };

  const canGoStep = (n) => {
    if (n === 1) return true;
    if (n === 2) return !!videoMode;
    if (n === 3) return !!videoMode && images.length >= 2;
    return false;
  };
  const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label;

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: INK, color: TEXT, fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <audio ref={audioRef} className="hidden" />
      <header className="border-b px-5 py-4" style={{ borderColor: LINE }}>
        <div className="max-w-3xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="flex items-center justify-center rounded" style={{ width: 28, height: 28, backgroundColor: ACCENT }}>
              <Icon name="film" size={15} style={{ color: "#fff" }} />
            </div>
            <span className="font-display text-lg">Rundvis</span>
          </div>
          <span className="text-xs hidden sm:block" style={{ color: MUTED }}>Prototype til intern test</span>
        </div>
      </header>

      <div className="max-w-3xl mx-auto px-5 pt-5">
        <div className="flex gap-2 overflow-x-auto pb-1">
          {STEPS.map((s) => <StepPill key={s.id} step={s.id} active={step === s.id} done={step > s.id} disabled={!canGoStep(s.id)} onClick={() => setStep(s.id)} />)}
        </div>
      </div>

      <main className="max-w-3xl mx-auto px-5 py-8">
        {step === 1 && (
          <section>
            <h1 className="font-display text-2xl mb-1">Hvilken video skal vi lave?</h1>
            <p className="text-sm mb-6" style={{ color: MUTED }}>
              Begge bruger samme klipning og samme formater. Forskellen er hvordan billederne bevæger sig.
            </p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {VIDEO_MODES.map((m) => {
                const on = videoMode === m.id;
                return (
                  <button
                    key={m.id}
                    onClick={() => setVideoMode(m.id)}
                    className="text-left rounded-xl p-5 transition-colors h-full flex flex-col"
                    style={{
                      backgroundColor: on ? ACCENT_SOFT : SURFACE,
                      border: `1px solid ${on ? ACCENT : LINE}`,
                    }}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <span className="font-display text-lg">{m.label}</span>
                      {on && <Icon name="check" size={16} style={{ color: ACCENT }} />}
                    </div>
                    <span className="text-xs mb-3" style={{ color: on ? ACCENT : MUTED }}>{m.tagline}</span>
                    <ul className="space-y-1.5 mb-3 flex-1">
                      {m.points.map((p, i) => (
                        <li key={i} className="flex gap-2 text-xs" style={{ color: TEXT }}>
                          <span style={{ color: MUTED }}>·</span>
                          <span>{p}</span>
                        </li>
                      ))}
                    </ul>
                    <span className="text-[11px]" style={{ color: MUTED }}>{m.bedst}</span>
                  </button>
                );
              })}
            </div>

                  {musicError && <p className="text-xs mt-2" style={{ color: AMBER }}>{musicError}</p>}
                  {!musicName && !musicError && (
                    <p className="text-[10px] mt-2" style={{ color: MUTED }}>
                      Brug musik du har rettighederne til — videoen skal offentliggøres. Er tracket kortere
                      end videoen, gentages det, og det tones ud til sidst.
                    </p>
                  )}
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div className="mb-4">
                  <p className="text-xs mb-2" style={{ color: TEXT }}>Hent som videofil</p>
                  <div className="flex flex-wrap gap-2 mb-2">
                    {Object.keys(EXPORT_FORMATS).map((f) => (
                      <button
                        key={f}
                        onClick={() => handleExport(f)}
                        disabled={exportStatus === "working"}
                        className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap"
                        style={{
                          border: `1px solid ${LINE}`,
                          backgroundColor: SURFACE_2,
                          color: TEXT,
                          opacity: exportStatus === "working" ? 0.5 : 1,
                          cursor: exportStatus === "working" ? "not-allowed" : "pointer",
                        }}
                      >
                        {EXPORT_FORMATS[f].label}{" "}
                        <span style={{ color: MUTED }}>{EXPORT_FORMATS[f].w}×{EXPORT_FORMATS[f].h}</span>
                      </button>
                    ))}
                  </div>

                  {exportStatus === "working" && (
                    <div className="flex items-center gap-2 text-xs" style={{ color: MUTED }}>
                      <Icon name="loader" size={13} />
                      {exportProgress.phase === "prepare"
                        ? `Forbereder billede ${exportProgress.current} af ${exportProgress.total}…`
                        : `Optager video ${Math.round((exportProgress.current / Math.max(1, exportProgress.total)) * 100)}%…`}
                    </div>
                  )}

                  {exportStatus === "working" && (
                    <p className="text-[10px] mt-1" style={{ color: AMBER }}>
                      Optagelsen kører i realtid og tager omtrent lige så lang tid som videoen varer. <strong>Bliv på denne fane imens</strong> — browseren pauser optagelsen i en baggrundsfane, og så bliver filen tom.
                    </p>
                  )}

                  {exportStatus === "error" && <p className="text-xs" style={{ color: AMBER }}>{exportError}</p>}

                  {exportStatus === "done" && exportFile && (
                    <div>
                      <a href={exportFile.url} download={exportFile.name} className="inline-flex items-center gap-1.5 text-xs" style={{ color: ACCENT }}>
                        <Icon name="arrowDown" size={13} /> Hent {exportFile.name}
                      </a>
                      {exportFile.name.endsWith(".webm") && (
                        <p className="text-[10px] mt-1" style={{ color: MUTED }}>
                          Din browser optager i WebM. Instagram og TikTok foretrækker MP4 — åbn siden i Safari 17+ for at få en MP4 direkte, eller konvertér filen.
                        </p>
                      )}
                    </div>
                  )}
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <p className="text-[10px] mb-4" style={{ color: MUTED }}>
                  Alt beregnes i din browser: ingen upload, ingen ventetid, ingen omkostning pr. video — og samme billeder giver altid præcis samme video.
                </p>
              )}

              {flythroughStatus === "error" && flythroughStills.length === 0 && (
                <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs mt-1" style={{ color: MUTED }}>
                  <Icon name="rotate" size={12} /> Prøv igen
                </button>
              )}
            </div>

<button onClick={() => setStep(2)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm mt-6" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> Tilbage til billeder</button>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Rundvis />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rundvis — AI boligvideo prototype</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body, #root { height: 100%; }
  body { margin: 0; background: #F1F2F0; font-family: 'Instrument Sans', system-ui, sans-serif;
         color: #171B1A; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D8DBD6; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes aande { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  .aande { animation: aande 1.9s ease-in-out infinite; }
  .spin { animation: spin 1s linear infinite; }
  .kb-img { will-change: transform; transform-origin: center center; filter: saturate(1.08) contrast(1.04); }
  .kb-fade { opacity: 0; transition: opacity 550ms ease; }
  .kb-fade.kb-fade-in { opacity: 1; }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%); }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .aande { animation: none; opacity: 0.8; }
    .kb-img { transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

// The page is paper, ink and one hairline; the property photographs supply all the colour. That
// is the whole idea, and it is why there is no brand hue washing over anything: on a page selling
// a house, any colour of ours competes with the rooms.
//
// Cool rather than warm. A warm cream ground with a serif and a clay accent is where a brief like
// "lighter, more exclusive" lands by default, and it is everywhere. Danish property photography is
// cool, grey-green and full of daylight, so the paper is limewash and the ink is a green-black.
const INK = "#F1F2F0",        // the page itself - limewash, a breath of green in the grey
  SURFACE = "#FFFFFF",        // raised: the player, the photographs sit on clean white
  SURFACE_2 = "#E9EBE8",      // recessed: quiet fills
  TEXT = "#171B1A",           // green-black, never a tinted near-black standing in for it
  MUTED = "#6E7570",
  ACCENT = "#1F3A34",         // deep petrol-green, spent only on the one action worth taking
  ACCENT_SOFT = "#D7DEDA",
  AMBER = "#8A6A2F",          // legible on paper, unlike the old amber
  LINE = "#DCDFDA";

const PROPERTY_TYPES = [
  { id: "villa", label: "Villa", hint: "Roligt tempo, fokus på rum og lys" },
  { id: "sommerhus", label: "Sommerhus", hint: "Udeliv, terrasse, udsigt" },
  { id: "liebhaver", label: "Liebhaverbolig", hint: "Langsomt, cinematisk, detaljer" },
  { id: "nyhed", label: "Nyhed på markedet", hint: "Energisk tempo, skaber interesse" },
  { id: "prisnedsaettelse", label: "Prisnedsættelse", hint: "Tydeligt fokus på ny pris" },
  { id: "aabenthus", label: "Åbent hus", hint: "Dato og tidspunkt fremhævet" },
];
// Three steps, in the order the work actually happens. The old flow had four, two of which
// (property type, script) only fed a voiceover feature that the walkthrough never used - so they
// asked the agent for decisions that changed nothing they could see.
const STEPS = [{ id: 1, label: "Billeder" }, { id: 2, label: "Video" }];

const FALLBACK_SCENE_MS = 6000;

function seededRandom(seed) {
  const s = Math.sin(seed) * 10000;
  return s - Math.floor(s);
}
function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

// Deterministic per-scene camera-move: a mix of zoom in/out and a pan direction,
// varied by index so consecutive scenes don't all move the same way.
function kenBurnsParamsFor(index) {
  const r1 = seededRandom(index * 12.9898 + 3.7);
  const r2 = seededRandom(index * 78.233 + 1.3);
  const r3 = seededRandom(index * 37.719 + 2.1);
  const r4 = seededRandom(index * 5.234 + 4.9);
  const zoomIn = r1 > 0.5;
  const scaleAmt = 1.08 + r2 * 0.09; // 1.08 - 1.17
  const panX = (r3 - 0.5) * 7; // -3.5% .. 3.5%
  const panY = (r4 - 0.5) * 5; // -2.5% .. 2.5%
  return {
    scaleFrom: zoomIn ? 1.02 : scaleAmt,
    scaleTo: zoomIn ? scaleAmt : 1.02,
    panX, panY,
  };
}
function applyKenBurns(el, params, t) {
  if (!el) return;
  const e = easeInOutSine(Math.max(0, Math.min(1, t)));
  const scale = params.scaleFrom + (params.scaleTo - params.scaleFrom) * e;
  const tx = -params.panX / 2 + params.panX * e;
  const ty = -params.panY / 2 + params.panY * e;
  el.style.transform = `scale(${scale.toFixed(4)}) translate(${tx.toFixed(2)}%, ${ty.toFixed(2)}%)`;
}

// ---- Cinematic 2D motion --------------------------------------------------------------------
// The camera moves the FRAME, never the pixels. Each shot is a rectangle travelling across the
// photograph; every output pixel is a straight resample of the original, so straight lines stay
// straight and nothing bends, tears or shimmers.
//
// This replaced a depth-estimated 3D mesh. That approach displaces every pixel by an ESTIMATED
// depth, and the estimate is never perfect: ceiling boards that are straight in the photo came
// out curved, and hard depth edges either tore or stretched. No amount of tuning fixes that -
// bending the photo is what the technique does. Fidelity to the uploaded photo was the higher
// requirement, so the depth model, the mesh and Three.js are gone.
//
// The trade is parallax. In exchange: nothing to go wrong, no model to download, no waiting, and
// a far smaller crop (about 4-10% here against the 22% the 3D camera needed for room to turn).

// Tightest any shot ever frames: a 10% crop, and only at one end of a move. Briefly raised to
// 1.14 to chase the reference, then put back: the reference's MEDIAN shot zooms 1.040 in total,
// less than ours already does. Its average of 6.4% per second is two 0.7-second punch-ins at 36%
// dragging the number up, not a house style. We were never zooming too little.
const KB_MAX_ZOOM = 1.1;
// Fraction of the available slack a full move uses.
//
// Was 0.9. For the common case - a 3:2 photo in a 16:9 frame - all the slack is vertical and
// worth about 16% of the photo's height, so 0.9 swept the frame through 14% of the picture on
// every shot. In the reference the median shot drifts by under 1% of the frame and the widest by
// about 9%: the move is a push with a drift on it, not a tour of the photograph. At 0.32 a full
// move covers around 5%, still more than the reference uses.
//
// (An earlier version of this note cited horizontal travel. That number was meaningless here: a
// 3:2 photo in a 16:9 frame has NO horizontal slack, so what was being measured was the zoom.)
const KB_TRAVEL = 0.32;

function clamp01(t) { return Math.max(0, Math.min(1, t)); }
function clampU(u) { return Math.max(-1, Math.min(1, u)); }

// The largest rectangle of the output's shape that fits inside the image. Whatever slack is left
// over - the mismatch between the photo's shape and the video's - is free room to move through,
// costing no crop at all. A 3:2 photo in a 16:9 frame has ~16% of vertical slack before any zoom.
function coverRect(iw, ih, outAspect) {
  return iw / ih > outAspect
    ? { w: ih * outAspect, h: ih }
    : { w: iw, h: iw / outAspect };
}

// Prescales the photo so the most tightly framed moment of a shot lands near 1:1 on the output.
// Drawing every frame from this plate keeps the picture crisp: the browser is then resampling by
// a hair rather than squeezing a 2560px photo into a 1080px frame sixty times a second.
// Downscaling is done in halving steps, which is much cleaner than one big jump.
function buildPlate(img, outW, outH) {
  const base = coverRect(img.width, img.height, outW / outH);
  const scale = Math.min(1, (outW * KB_MAX_ZOOM) / base.w);
  let src = img, sw = img.width, sh = img.height;
  const targetW = Math.max(16, Math.round(img.width * scale));
  const targetH = Math.max(16, Math.round(img.height * scale));
  while (sw / 2 >= targetW && sh / 2 >= targetH && sw > 32) {
    const c = document.createElement("canvas");
    c.width = Math.round(sw / 2); c.height = Math.round(sh / 2);
    const cx = c.getContext("2d");
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";
    cx.drawImage(src, 0, 0, c.width, c.height);
    src = c; sw = c.width; sh = c.height;
  }
  if (sw === targetW && sh === targetH) return { canvas: src, w: sw, h: sh };
  const out = document.createElement("canvas");
  out.width = targetW; out.height = targetH;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(src, 0, 0, targetW, targetH);
  return { canvas: out, w: targetW, h: targetH };
}

// Where a shot's frame sits at time t. Returned in the plate's pixel coordinates.
// By construction the rectangle can never leave the photo: its half-width plus the largest
// possible offset is exactly the plate's half-width. That is the whole black-edge guarantee -
// no projection maths, no search, nothing to get wrong.
function shotRectAt(spec, plateW, plateH, outAspect, t) {
  const e = easeShot(t, spec.ease);
  // Bounded at BOTH ends, because e can exceed 1 while this shot fades out under the next one.
  // The floor is the one that matters: a pull or pullback ends near 1.0, so overshooting drives
  // the zoom BELOW 1 - the crop rectangle grows larger than the photo behind it and the frame
  // fills with black at the edges. Held at 1 or above, the rectangle is always inside the plate,
  // which is what makes black edges impossible rather than merely unlikely.
  const z = Math.min(KB_MAX_ZOOM, Math.max(1, spec.zFrom + (spec.zTo - spec.zFrom) * e));
  const base = coverRect(plateW, plateH, outAspect);
  const rw = base.w / z, rh = base.h / z;
  const slackX = Math.max(0, plateW - rw), slackY = Math.max(0, plateH - rh);
  const ux = clampU(spec.fromU.x + (spec.toU.x - spec.fromU.x) * e);
  const uy = clampU(spec.fromU.y + (spec.toU.y - spec.fromU.y) * e);
  return {
    x: plateW / 2 + (ux * slackX) / 2 - rw / 2,
    y: plateH / 2 + (uy * slackY) / 2 - rh / 2,
    w: rw,
    h: rh,
  };
}

// Draws one shot at time t (0..1 through its own clip).
//
// A shot is backed by EITHER a still photo or a generated video clip, and everything downstream
// - the dissolves, the grade, the export - is written against this one function, so the two
// kinds compose together in the same sequence without anything else knowing the difference.
//
// A generated clip already contains its camera move, so the frame is not moved across it: it is
// cover-fitted and played. Only stills get the travelling frame.
// How much of a picture's WIDTH a cover-crop throws away for a given frame.
//
// Width, not area, and that distinction is the whole rule. A 3:2 photo in a 16:9 frame keeps its
// full width and loses some ceiling and floor; in 9:16 it keeps 37% of its width, and with a 1.07
// zoom on top, 35%. Two thirds of the room cut off at the sides is exactly what an agent means by
// "it does not show the picture properly", and panning does not rescue it - at any one instant you
// are still looking at a third of a room.
//
// Area loss was tried first and got this wrong in a way that only showed up on screen: a portrait
// phone photo in a 16:9 frame loses 58% of its AREA, so it tripped the same rule and came out as a
// narrow strip on a blurred bed, when cropping its ceiling and floor would have been fine. Height
// is where a room has nothing to say; width is where it does.
function widthLoss(iw, ih, outAspect) {
  return 1 - coverRect(iw, ih, outAspect).w / iw;
}
// Past this, fit the whole picture instead of cropping it. Landscape photos in 9:16 lose 58-63% of
// their width and are always over it; everything else - including portrait photos in a landscape
// frame - stays under and is cropped as before.
const FIT_WHEN_LOSS_OVER = 0.4;

// The bed is built once and kept, at a fraction of the output size.
//
// Blurring at full size every frame is what it used to do, and it cost the earth: measured in
// Chromium, a vertical frame took 41.6ms against 16.7ms for a horizontal one, and 119 of 120
// frames missed the frame deadline. That is the stutter - and because the exporter records the
// canvas in real time, it was being baked into the downloaded file as well.
//
// Building it small is free and looks identical: the thing is blurred past recognition, so there
// is no detail to lose, and the upscale does some of the blurring itself. 3px of blur across 96px
// is the same picture as 26px across a full frame.
const BED_W = 96;
function buildBed(src, sw, sh, outAspect) {
  const bw = BED_W, bh = Math.max(1, Math.round(BED_W / outAspect));
  const c = document.createElement("canvas");
  c.width = bw; c.height = bh;
  const x = c.getContext("2d");
  if (!x) return null;
  const r = coverRect(sw, sh, outAspect);
  // The grade is baked in here, once, so the per-frame draw needs no filter at all. In fit mode
  // the bed is a second full-frame draw on top of the picture, and a filtered full-frame draw is
  // the expensive kind.
  x.filter = `${GRADE_FILTER} blur(3px) brightness(0.52) saturate(0.9)`;
  x.drawImage(src, (sw - r.w) / 2, (sh - r.h) / 2, r.w, r.h, 0, 0, bw, bh);
  return c;
}

// The picture, whole, on a bed made from itself: the same frame blown up to fill, blurred far past
// recognition and dimmed. It reads as depth of field rather than as the bars it really is, and it
// keeps the colour of the room instead of punching a grey hole in the video.
function drawBedded(octx, W, H, shot, src, sw, sh, scale, dx, dy, bedKey) {
  if (!shot._bed || shot._bedKey !== bedKey) {
    shot._bed = buildBed(src, sw, sh, W / H);
    shot._bedKey = bedKey;
  }
  if (shot._bed) {
    const prevFilter = octx.filter;
    octx.filter = "none";   // already graded in buildBed
    octx.drawImage(shot._bed, 0, 0, shot._bed.width, shot._bed.height,
      -W * 0.06, -H * 0.06, W * 1.12, H * 1.12);
    octx.filter = prevFilter;
  }

  // The picture itself, fitted whole, with the shot's move applied as a gentle drift inside it
  // rather than as a crop across it.
  //
  // Drawn from a copy cut to the size it is actually shown at. The plate is built for a cover
  // crop, so in a vertical frame it is about twice the width the fitted picture needs - four
  // times the pixels, resampled on every frame. Resizing it once here and reusing it is the
  // other half of the stutter fix; the first half was the bed.
  const fit = Math.min(W / sw, H / sh);
  const fgKey = `${bedKey}:${Math.round(fit * 1000)}`;
  if (!shot._fg || shot._fgKey !== fgKey) {
    // A little over the fitted size, so the shot's own zoom never has to scale it up.
    const fw = Math.max(1, Math.round(sw * fit * 1.06));
    const fh = Math.max(1, Math.round(sh * fit * 1.06));
    const c = document.createElement("canvas");
    c.width = fw; c.height = fh;
    const x = c.getContext("2d");
    if (x) {
      x.imageSmoothingEnabled = true;
      x.imageSmoothingQuality = "high";
      x.drawImage(src, 0, 0, sw, sh, 0, 0, fw, fh);
      shot._fg = c;
      shot._fgKey = fgKey;
    }
  }
  const from = shot._fg || src;
  const fsw = shot._fg ? shot._fg.width : sw;
  const fsh = shot._fg ? shot._fg.height : sh;
  const dw = sw * fit * scale, dh = sh * fit * scale;
  octx.drawImage(from, 0, 0, fsw, fsh, (W - dw) / 2 + dx, (H - dh) / 2 + dy, dw, dh);
}

function drawShot2D(octx, W, H, shot, t) {
  if (shot.video) {
    const v = shot.video;
    const vw = v.videoWidth, vh = v.videoHeight;
    if (!vw || !vh) return;
    // A clip is generated in the format that was chosen at the time. Switch the player to another
    // one afterwards and the clip is cover-cropped like any photo, so it gets the same treatment.
    if (widthLoss(vw, vh, W / H) > FIT_WHEN_LOSS_OVER) {
      drawBedded(octx, W, H, shot, v, vw, vh, 1, 0, 0,
        `${W}x${H}:${Math.floor((v.currentTime || 0) * 2)}`);
      return;
    }
    const base = coverRect(vw, vh, W / H);
    octx.drawImage(v, (vw - base.w) / 2, (vh - base.h) / 2, base.w, base.h, 0, 0, W, H);
    return;
  }

  const pw = shot.plate.w, ph = shot.plate.h;
  if (widthLoss(pw, ph, W / H) > FIT_WHEN_LOSS_OVER) {
    const e = easeShot(t, shot.spec.ease);
    // A small move, because there is no slack to travel through once the picture is whole - and a
    // big one over a fitted picture only draws attention to the bed behind it.
    const z = 1 + 0.045 * e;
    const dx = (shot.spec.toU.x - shot.spec.fromU.x) * e * W * 0.012;
    const dy = (shot.spec.toU.y - shot.spec.fromU.y) * e * H * 0.012;
    drawBedded(octx, W, H, shot, shot.plate.canvas, pw, ph, z, dx, dy, `${W}x${H}`);
    return;
  }

  const r = shotRectAt(shot.spec, pw, ph, W / H, t);
  octx.drawImage(shot.plate.canvas, r.x, r.y, r.w, r.h, 0, 0, W, H);
}

// Keeps the generated clips lined up with the edit: the shot on screen plays, and so does the one
// fading out underneath it. Pausing the outgoing clip was the video half of the same mistake as
// parking the outgoing 2D frame - it turned every dissolve into a still image crossfading into a
// clip that had not started moving yet.
//
// The clips are played rather than seeked frame by frame - seeking every frame stutters badly.
// A resync only happens when playback has drifted more than about a third of a second, which in
// practice means after a loop or a stall.
//
// Generated clips run 5s while the edit uses only the first couple of seconds of each. That is
// deliberate twice over: it matches the pacing measured in the reference films, AND the opening
// seconds are where an image-to-video model stays closest to the photograph it was given, since
// drift grows the longer a clip runs. Using the head of each clip buys both at once.
// Where in the clip this shot starts playing. Measured, not guessed: buildEditPlan has already
// fitted the hold to the clip's moving part and recorded where that part begins.
//
// The guess this replaces skipped into the clip by a fraction of the unused tail, on the theory
// that the start was an ease-in worth stepping over. Measuring showed the opposite - these clips
// come out of the gate moving and ease to a STOP - so that skipped past real motion to sit closer
// to the dead end.
function clipStartFor(shot) {
  const v = shot.video;
  const clip = v && isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
  if (!clip) return 0;
  const hold = shot.spec.durationMs / 1000;
  const want = shot.spec.clipStart || 0;
  // Never so far in that the shot outruns the end of the clip.
  return Math.max(0, Math.min(want, clip - hold));
}

function syncShowVideos(shots, idx, localMs, prevIdx) {
  for (let i = 0; i < shots.length; i++) {
    const v = shots[i].video;
    if (!v) continue;
    const outgoing = prevIdx === i && i !== idx;
    if (i !== idx && !outgoing) {
      if (!v.paused) v.pause();
      continue;
    }
    const shot = shots[i];
    const from = clipStartFor(shot);
    // The outgoing clip carries on from where its shot ended, for as long as the dissolve lasts.
    const into = outgoing ? shot.spec.durationMs + localMs : localMs;
    const want = Math.min(from + into / 1000, Math.max(0, (v.duration || 99) - 0.05));
    try {
      if (v.paused) {
        v.currentTime = want;
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
      } else if (Math.abs(v.currentTime - want) > 0.34) {
        v.currentTime = want;
      }
    } catch (e) {}
  }
}

// Three speed curves, picked per shot by where its cut falls (see buildEditPlan). None of them
// decelerate to a standstill: a clip that parks before the cut is the single clearest giveaway
// of a slideshow, and the old easeInOutSine did exactly that at BOTH ends.
//   glide  - gentle start, still moving at full speed when a dissolve begins
//   ramp   - accelerates into a hard cut, so the cut lands on motion (the "speed ramp" look)
//   settle - leaves a hard cut already at speed, then eases off
// Each is a blend of a linear term and a shaped one. The linear part is the point: a pure
// power curve has zero velocity at one end, so a shot built on one comes to a dead stop either
// just before its cut or just after it. Blended, the camera is never slower than ~0.35x its
// average - it always reads as moving, even at the very edges of a clip.
// The first number IS the speed each shot opens at, as a fraction of its own average: for a*t +
// b*t^p the shaped term contributes nothing at t=0. They were 0.65, 0.35 and 0.55, so a shot on
// the ramp curve opened at barely a third of its own pace and read as standing still for a moment
// before it got going. Measured on the reference, a shot is at 70% of its peak speed within the
// first 0.3 seconds and only 3 of 18 open below half. Raised to match.
const SHOT_EASES = {
  glide: (t) => 0.80 * t + 0.20 * Math.pow(t, 1.6),
  ramp: (t) => 0.62 * t + 0.38 * Math.pow(t, 2.0),
  settle: (t) => 0.72 * t + 0.28 * (1 - Math.pow(1 - t, 2)),
};
// t may run PAST 1. A shot stays on screen under the dissolve that replaces it, and clamping
// there parked it on its last frame for the whole crossfade - the exact standstill the curves
// above were shaped to avoid, reintroduced one line later. Past the end the curve continues in a
// straight line at the speed it finished with, so the outgoing picture is still travelling while
// it fades out. Capped, because a long dissolve should not send the frame somewhere the shot was
// never framed for.
const EASE_OVERSHOOT_MAX = 1.3;
function easeShot(t, kind) {
  const f = SHOT_EASES[kind] || SHOT_EASES.glide;
  if (t <= 1) return f(Math.max(0, t));
  const h = 1e-3;
  const endSpeed = (f(1) - f(1 - h)) / h;
  return f(1) + endSpeed * (Math.min(t, EASE_OVERSHOOT_MAX) - 1);
}

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error("Kunne ikke indlæse billedet."));
    i.src = src;
  });
}

// ---- The edit ---------------------------------------------------------------------------
// Everything below decides the CUT rather than the camera: how long each shot runs, where the
// cuts land, and what happens across them. A listing video reads as expensive mostly because of
// this layer - the moves themselves are the easy part.

// Measured off a reference listing film the agent supplied: 14 cuts across 40.7s, with clip
// lengths clustering at ~2.05s and ~4.1s - one unit and two units of the same grid, i.e. a beat
// around 117 BPM. Ours ran at 96 and felt slower than the target, so it now matches.
const SHOW_BPM = 116;
const BEAT_MS = 60000 / SHOW_BPM;         // ~517ms
const DISSOLVE_MS = 460;                  // longer now that dissolves are rare and deliberate
const SHOW_FADE_MS = 520;                 // up from black at the top, down at the tail
const VIGNETTE = 0.26;                    // corner darkening; reads as "graded" rather than flat

// THE GRADE. A vignette alone is not a grade, and ungraded footage is the single clearest tell
// that a property video was made by software rather than shot. This is the standard clean
// architectural look: a little more contrast and colour, highlights warmed, shadows lifted off
// pure black and cooled slightly.
//
// Done with canvas filters and two composited fills rather than per-pixel work. Reading and
// writing 1920x1080 pixels thirty times a second in JavaScript would not hold frame rate; these
// are GPU paths and cost almost nothing.
//
// It runs over generated clips and stills alike, which is most of why the two read as one film
// instead of as two sources cut together.
const GRADE_FILTER = "contrast(1.06) saturate(1.07) brightness(1.01)";
// Lifted, slightly cool black floor. Composited with "lighten", so it only touches pixels darker
// than itself: shadows come off pure black - the filmic part - and everything else is untouched.
const GRADE_LIFT = "rgb(12, 15, 22)";
// Warm highlights, in soft-light so it lands on the bright end and leaves the shadows alone.
const GRADE_WARM = "rgba(255, 216, 170, 0.10)";

// Lays out the whole sequence at once. Doing it as one plan - rather than deriving each shot
// independently the way parallaxPathFor used to - is what makes structure possible: an opening
// that breathes, a middle with rhythm, a close that settles, and cuts that alternate direction
// instead of drifting the same way eight times in a row.
//
// Every duration is a whole number of beats, so all cuts land on one grid. That is what "cut to
// the beat" means, and it holds whether or not music is playing over it.
// THE TEMPO ARC. How long each shot holds, by where it falls in the film.
//
// A property film is not a metronome. It opens roomy so the viewer can take the place in, tightens
// through the middle where the rooms are already established, then opens out again to land the
// ending. Every shot running 4-5 beats regardless of position was the single thing that made this
// read as a slideshow: correct on the beat, but with no shape over the two minutes.
//
// Held to half-beats, which are still on the music.
function paceBeats(i, count) {
  if (count <= 3) return 6;
  const p = (i - 1) / Math.max(1, count - 3);        // 0 at the first interior, 1 at the last
  const openness = 1 - Math.sin(Math.PI * clamp01(p)); // 1 at both ends, 0 across the middle
  // A little jitter so the arc is felt rather than counted, fixed per position so a rebuild of
  // the same property cuts identically.
  const jitter = (seededRandom(i * 19.4 + 3.1) - 0.5) * 0.8;
  // Raised from 3 + 2.5 * openness. The middle was running 1.3-1.5 seconds a shot, which is
  // quick even by listing-video standards and left no time to actually look at a room.
  return Math.max(3, Math.round((4 + openness * 3 + jitter) * 2) / 2);
}

// A CLIP IS FIVE SECONDS. The shot showing it was usually on screen for under three, so nearly
// half of every generated clip was paid for and never seen. A shot carrying a clip therefore
// holds longer - a BONUS on top of its place in the arc rather than a flat floor, so a partly
// upgraded property keeps its shape: upgraded rooms run ~4.7s against ~1.9s for the quick ones.
//
// UPGRADING EVERY ROOM DOES flatten the arc, and that is a deliberate trade, not an oversight.
// Every shot then hits the cap and the film becomes a run of ~4.7s shots. The cap is the length
// of the clip, so the only way to keep the ends longest under a full upgrade is to hold the
// middle shots BELOW what was paid for them - which is the exact waste this whole thing exists to
// remove. Utilisation wins. The arc is intact in the free edit and in the selective upgrade,
// which is the path the interface steers towards anyway.
//
// A shot carrying a clip may run longer than its place in the arc, but never longer than the clip
// actually moves (see measureClipMotion). Capped at 9 beats (4.66s) of a nominal 5-second clip:
// "5s" is what we ask Luma for, not a guarantee of what comes back, and a shot outlasting its own
// footage parks on a frozen frame.
const CLIP_BONUS_BEATS = 2.5;
const CLIP_MAX_BEATS = 9;
// A clip is only worth showing if it moves for most of what the shot wants to hold. Below this
// the free 2D move is the better picture: it moves for the whole shot, every time. Holding the
// arc and dropping the clip beats shrinking the shot to fit a clip that stops early - which would
// turn a four-second establishing shot into a one-second flicker.
const CLIP_MIN_COVERAGE = 0.6;

// clipMotion(i) -> { start, moving } in seconds, from measureClipMotion, or null when the shot has
// no clip or it has not been measured yet. Unmeasured is treated as no clip: the shot keeps its
// arc length and the clip, if any, plays from its start. That is the safe direction to be wrong in.
function buildEditPlan(count, clipMotion) {
  if (count === 0) return [];
  const beats = (n) => Math.round(n * BEAT_MS);
  const motionAt = typeof clipMotion === "function" ? clipMotion : () => null;
  const plan = [];

  const T = KB_TRAVEL;
  for (let i = 0; i < count; i++) {
    const isFirst = i === 0;
    const isLast = i === count - 1 && count > 2;
    const d = i % 2 === 0 ? 1 : -1; // strict alternation, so consecutive shots counter-move
    let type, nBeats, zFrom, zTo, fromU, toU;

    if (isFirst) {
      // Establishing shot: opens on the FULL frame - no crop at all - and eases in. The first
      // thing the viewer sees is the photograph exactly as the agent shot it.
      // Eight beats, over four seconds. The opening shot is the one the viewer decides on, and
      // cutting away from it quickly is how a film announces that it is in a hurry.
      type = "push"; nBeats = 9;
      zFrom = 1.0; zTo = 1.07;
      fromU = { x: 0, y: 0 }; toU = { x: 0.18, y: -0.12 };
    } else if (isLast) {
      // Close by pulling back out to the full frame again, rising slightly: the standard
      // "leave the room" move, and it ends on an uncropped picture.
      type = "pull"; nBeats = 9;
      zFrom = 1.08; zTo = 1.0;
      fromU = { x: -0.2 * d, y: 0.45 }; toU = { x: 0, y: -0.1 };
    } else {
      // The move, chosen rather than cycled.
      //
      // A fixed cycle repeats: with seven moves and eighteen rooms you see the identical run of
      // seven two and a half times over, which is the sort of thing nobody can name but everyone
      // notices. Instead each shot picks from the set under two rules an editor would apply
      // without thinking - never the same move twice running, and never two moves of the same
      // family back to back, so a push-in is not followed by a lean-in nor a pull-out by a
      // pullback. Seeded on the position, so rebuilding the same property cuts identically.
      //
      // "orbit" is in the set although 2D cannot really orbit - it renders as an arcing travel,
      // and becomes a true arc around the room once that shot is upgraded. That is the honest
      // place to put a move the free version can only suggest: it is what the upgrade buys.
      const family = { push: "in", lean: "in", pull: "out", pullback: "out", pan: "across", orbit: "around", drift: "up" };
      const prev = plan[i - 1] ? plan[i - 1].type : "push";
      // No pullback in the body of the film. Measured against a Reel-E listing video - 18 shots,
      // 40 seconds - 12 shots push IN, 4 hold their zoom, and only 2 pull out. Ours had pullback
      // in the general pool on the reasoning that a run of push-ins with one pull-out at the end
      // reads as a template; what it actually produced was a film that kept backing away from
      // rooms it had just moved into. Moving in is what a walkthrough does. The closing shot
      // still pulls out - that is the one place the reference does it too.
      const ALL = ["pan", "push", "orbit", "drift", "lean"];
      const recent = plan.slice(-3).map((q) => q.type);
      const legal = ALL.filter((m) => m !== prev && family[m] !== family[prev]);
      // Also prefer something not used in the last three shots. Without this the draw clumps -
      // one run came out with six pans in sixteen shots and not a single lean - which looks
      // less varied than the fixed cycle this replaced. Falls back to the looser set when
      // being this picky leaves nothing.
      const fresh = legal.filter((m) => recent.indexOf(m) === -1);
      const pool = fresh.length ? fresh : legal;
      type = pool[Math.floor(seededRandom(i * 7.13 + 2.7) * pool.length) % pool.length];
      nBeats = paceBeats(i, count);

      // Every shot gets its own amount, not just its own direction. Earlier all pushes moved
      // exactly 7% and all pans held zoom at zero, which reads as a template rather than as a
      // camera: a real edit varies how far each move travels.
      const v = 0.75 + seededRandom(i * 31.7 + 8.2) * 0.5;   // 0.75-1.25 on the move
      const vz = 0.7 + seededRandom(i * 47.3 + 1.9) * 0.6;   // 0.7-1.3 on the zoom

      if (type === "pan") {
        // A travelling frame. Both axes are driven; because each is scaled by its OWN slack, the
        // move runs along whichever axis the photo actually has room in - wide for a 9:16 frame,
        // tall for a 16:9 one - with no special-casing. A touch of zoom keeps it from feeling
        // locked off.
        // Capped at the full slack. Uncapped, a high v put the endpoints past what the photo has
        // room for, and the clamp then held the frame still at each end - the parking that the
        // eases were shaped to get rid of in the first place.
        const ampX = Math.min(T * v, 1);
        zFrom = 1.05; zTo = 1.05 + 0.025 * vz;
        fromU = { x: -ampX * d, y: T * 0.25 * d * v }; toU = { x: ampX * d, y: -T * 0.25 * d * v };
      } else if (type === "drift") {
        zFrom = 1.02; zTo = 1.02 + 0.07 * vz;
        fromU = { x: -T * 0.55 * d * v, y: -T * 0.5 * d * v }; toU = { x: T * 0.55 * d * v, y: T * 0.5 * d * v };
      } else if (type === "orbit") {
        // Sideways travel with the vertical running the other way and a slow push: the frame
        // swings rather than slides, which is as close to an arc as a flat photo goes.
        zFrom = 1.03; zTo = 1.03 + 0.05 * vz;
        fromU = { x: -T * 0.7 * d * v, y: T * 0.35 * v }; toU = { x: T * 0.7 * d * v, y: -T * 0.35 * v };
      } else if (type === "lean") {
        // Push in with the frame easing to one side - a step into the room rather than a zoom.
        zFrom = 1.0; zTo = 1.0 + 0.1 * vz;
        fromU = { x: -T * 0.2 * d * v, y: T * 0.1 * v }; toU = { x: T * 0.35 * d * v, y: -T * 0.2 * v };
      } else if (type === "pullback") {
        // Opens tight and opens up. Mixed into the body of the edit, not saved for the ending,
        // so the video is not a run of push-ins with one pull-out at the very end.
        zFrom = 1.04 + 0.05 * vz; zTo = 1.005;
        fromU = { x: T * 0.4 * d * v, y: T * 0.3 * d * v }; toU = { x: -T * 0.15 * d * v, y: -T * 0.1 * d * v };
      } else {
        zFrom = 1.01; zTo = 1.01 + 0.075 * vz;
        fromU = { x: T * 0.3 * d * v, y: T * 0.25 * d * v }; toU = { x: -T * 0.3 * d * v, y: -T * 0.25 * d * v };
      }
    }

    // Fit the shot to the clip's MOVING part, not to its duration.
    let useClip = true, clipStart = 0;
    const m = motionAt(i);
    // isFinite guards the arithmetic below: a malformed measurement would otherwise turn the
    // shot's duration into NaN, and one NaN duration takes down the whole timeline.
    if (m && isFinite(m.moving) && isFinite(m.start)) {
      const movingBeats = Math.floor(((m.moving * 1000) / BEAT_MS) * 2) / 2;
      if (movingBeats < nBeats * CLIP_MIN_COVERAGE) {
        // The clip stops too early to carry this shot. Keep the arc, show the 2D move instead.
        useClip = false;
      } else {
        clipStart = m.start;
        nBeats = Math.min(nBeats + CLIP_BONUS_BEATS, CLIP_MAX_BEATS, movingBeats);
      }
    }

    // The zoom ceiling, applied here rather than trusted shot by shot. KB_MAX_ZOOM was only ever
    // used to prescale the image plate; nothing enforced it on the moves themselves, so "lean"
    // reached 1.13 - a 13% crop where 10% was documented, and resampled above 1:1 off a plate
    // built for 1.1, which is the one thing this whole approach exists to avoid.
    zFrom = Math.min(zFrom, KB_MAX_ZOOM); zTo = Math.min(zTo, KB_MAX_ZOOM);

    plan.push({ type, dirSign: d, zFrom, zTo, fromU, toU, durationMs: beats(nBeats), useClip, clipStart });
  }

  // Transitions. Mostly dissolves, with a hard cut every third shot for lift. The hard cut is
  // what stops a sequence of dissolves from turning into a lullaby.
  // Cuts by default, dissolves by exception - the other way round from how this started.
  //
  // A sequence carried on dissolves reads as a wedding video: everything melts into everything
  // else and nothing has an edge. High-end property films cut, hard and on the beat, and spend a
  // dissolve only where it means something - moving INTO the property after the establishing
  // shot, once across the middle to mark a change of part, and out to the closing shot.
  const lastIdx = count - 1;
  const dissolves = new Set();
  if (count > 2) {
    dissolves.add(1);                       // into the property
    dissolves.add(lastIdx);                 // out to the closing shot
    if (count >= 7) dissolves.add(Math.floor(count / 2)); // a breath across the middle
  }
  plan.forEach((p, i) => {
    p.transition = dissolves.has(i) ? "dissolve" : "cut";
    p.transitionMs = dissolves.has(i) ? DISSOLVE_MS : 0;
  });

  // Speed curves follow the tempo arc rather than the cuts.
  //
  // They used to key off the cuts - accelerate into a hard one - which worked while cuts were
  // rare. Now that cuts are the default, that rule would put an accelerating ramp under nearly
  // every shot in the film, and a whole reel of shots all winding up is relentless to watch.
  // Tying it to the arc instead means the tight middle shots carry the energy and the roomy
  // shots at either end settle, which is the same thing an editor does by hand.
  plan.forEach((p, i) => {
    if (i === 0 || i === plan.length - 1) { p.ease = "settle"; return; }
    const tight = p.durationMs <= 3.5 * BEAT_MS;
    p.ease = tight ? "ramp" : p.transition === "dissolve" ? "glide" : "settle";
  });

  return plan;
}

// Vignette, cached per size - rebuilding the gradient every frame is wasted work.
let _vigKey = "", _vigGrad = null;
function vignetteFor(octx, W, H) {
  const key = W + "x" + H;
  if (key !== _vigKey) {
    const g = octx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0," + VIGNETTE + ")");
    _vigKey = key; _vigGrad = g;
  }
  return _vigGrad;
}

// Titles. The film is a deliverable an agent posts under their own name, and a walkthrough with
// no address and no agent on it is footage rather than a product - so the address opens it and
// the agent closes it, the way a produced property film is topped and tailed.
//
// Both are optional and empty by default. Type over a photograph is the easiest thing in this
// whole pipeline to make look cheap, so: light weight, wide letter-spacing, sized relative to the
// frame so it holds at 1080p and in the preview alike, and set over a soft scrim rather than
// dropped straight onto the picture.
const TITLE_FONT = '"Helvetica Neue", Inter, system-ui, -apple-system, sans-serif';

function scrim(octx, W, H, from, strength) {
  const g = octx.createLinearGradient(0, from === "bottom" ? H : 0, 0, from === "bottom" ? H * 0.55 : H * 0.45);
  g.addColorStop(0, `rgba(0,0,0,${strength})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  octx.fillStyle = g;
  octx.fillRect(0, 0, W, H);
}

// Fades a caption up, holds it, and takes it away again, all within one shot.
function captionAlpha(local, durationMs, inAt, holdMs) {
  const FADE = 620;
  if (local < inAt) return 0;
  const since = local - inAt;
  if (since < FADE) return since / FADE;
  if (since < FADE + holdMs) return 1;
  const out = since - FADE - holdMs;
  return out < FADE ? 1 - out / FADE : 0;
}

function drawTitles(octx, W, H, titles, idx, lastIdx, local, durationMs) {
  if (!titles) return;
  const head = (titles.headline || "").trim();
  const agent = (titles.agent || "").trim();
  const opening = idx === 0 && head;
  const closing = idx === lastIdx && lastIdx > 0 && (agent || head);
  if (!opening && !closing) return;

  const a = opening
    ? captionAlpha(local, durationMs, 900, Math.max(600, durationMs - 3000))
    : captionAlpha(local, durationMs, 700, Math.max(900, durationMs - 2200));
  if (a <= 0.002) return;

  octx.save();
  octx.globalAlpha = a;
  octx.textBaseline = "alphabetic";

  if (opening) {
    // Lower left, the way a location card sits.
    scrim(octx, W, H, "bottom", 0.42 * a);
    const size = Math.round(W * 0.042);
    octx.globalAlpha = a;
    octx.fillStyle = "rgba(255,255,255,0.97)";
    octx.font = `300 ${size}px ${TITLE_FONT}`;
    if ("letterSpacing" in octx) octx.letterSpacing = `${Math.round(size * 0.02)}px`;
    octx.textAlign = "left";
    octx.fillText(head, Math.round(W * 0.07), Math.round(H * 0.88));
  } else {
    // Centred end card, the address small above the name.
    scrim(octx, W, H, "bottom", 0.5 * a);
    octx.textAlign = "center";
    const cx = Math.round(W / 2);
    if (head) {
      const small = Math.round(W * 0.021);
      octx.fillStyle = "rgba(255,255,255,0.72)";
      octx.font = `400 ${small}px ${TITLE_FONT}`;
      if ("letterSpacing" in octx) octx.letterSpacing = `${Math.round(small * 0.18)}px`;
      octx.fillText(head.toUpperCase(), cx, Math.round(H * 0.79));
    }
    if (agent) {
      const size = Math.round(W * 0.046);
      octx.fillStyle = "rgba(255,255,255,0.97)";
      octx.font = `300 ${size}px ${TITLE_FONT}`;
      if ("letterSpacing" in octx) octx.letterSpacing = `${Math.round(size * 0.02)}px`;
      octx.fillText(agent, cx, Math.round(H * 0.86));
    }
  }

  if ("letterSpacing" in octx) octx.letterSpacing = "0px";
  octx.restore();
}

// Composes ONE frame of the finished show onto a 2D context: the right shot at the right point
// in its move, whatever the transition into it calls for, then the grade.
//
// Both the live preview and the exported file call this, so what is downloaded is frame for
// frame what was on screen - they cannot drift apart.
function composeShowFrame(octx, W, H, shots, tMs, opts) {
  const totalMs = shots.reduce((a, s) => a + s.spec.durationMs, 0);
  const t = ((tMs % totalMs) + totalMs) % totalMs;

  let acc = 0, idx = shots.length - 1;
  for (let i = 0; i < shots.length; i++) {
    if (t < acc + shots[i].spec.durationMs) { idx = i; break; }
    acc += shots[i].spec.durationMs;
  }
  if (idx === shots.length - 1) acc = totalMs - shots[idx].spec.durationMs;

  const shot = shots[idx];
  const local = t - acc;
  const fade = shot.spec.transitionMs || 0;

  // Done here rather than by each caller, so the preview and the export stay in lockstep.
  const fadeNow = (shot.spec.transitionMs || 0) > 0 && local < (shot.spec.transitionMs || 0) && shots.length > 1;
  syncShowVideos(shots, idx, local, fadeNow ? (idx - 1 + shots.length) % shots.length : -1);

  octx.globalAlpha = 1;
  // Contrast and saturation ride on the draw itself, so a dissolve grades both shots identically
  // and the blend happens between two already-graded images.
  octx.filter = GRADE_FILTER;
  if (fade > 0 && local < fade && shots.length > 1) {
    // Hold the outgoing shot underneath at its final frame and bring this one up over it.
    const prev = shots[(idx - 1 + shots.length) % shots.length];
    // Carried on past its own end rather than held at its last frame, so the picture underneath
    // is still moving while this one comes up over it.
    drawShot2D(octx, W, H, prev, 1 + local / Math.max(1, prev.spec.durationMs));
    octx.globalAlpha = clamp01(local / fade);
  }
  drawShot2D(octx, W, H, shot, local / shot.spec.durationMs);
  octx.filter = "none";
  octx.globalAlpha = 1;

  // Shadows off pure black and slightly cool, then highlights warmed. Order matters: lifting
  // first means the warmth lands on a shadow that already has some light in it.
  octx.globalCompositeOperation = "lighten";
  octx.fillStyle = GRADE_LIFT;
  octx.fillRect(0, 0, W, H);
  octx.globalCompositeOperation = "soft-light";
  octx.fillStyle = GRADE_WARM;
  octx.fillRect(0, 0, W, H);
  octx.globalCompositeOperation = "source-over";

  octx.fillStyle = vignetteFor(octx, W, H);
  octx.fillRect(0, 0, W, H);

  // Before the top-and-tail fade, so the title comes up out of black with the picture rather
  // than sitting on top of it.
  drawTitles(octx, W, H, opts && opts.titles, idx, shots.length - 1, local, shot.spec.durationMs);

  // Up from black at the top and down at the tail. In the looping preview this reads as a
  // deliberate top-and-tail rather than a seam.
  let dark = 0;
  if (t < SHOW_FADE_MS) dark = 1 - t / SHOW_FADE_MS;
  else if (t > totalMs - SHOW_FADE_MS) dark = 1 - (totalMs - t) / SHOW_FADE_MS;
  if (!opts || opts.fades !== false) {
    if (dark > 0.001) {
      octx.fillStyle = "rgba(0,0,0," + dark.toFixed(3) + ")";
      octx.fillRect(0, 0, W, H);
    }
  }
  return totalMs;
}

function Icon({ name, size = 16, className = "", style = {} }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className, style };
  switch (name) {
    case "upload": return <svg {...p}><path d="M12 3v12" /><path d="m7 8 5-5 5 5" /><path d="M5 21h14" /></svg>;
    case "play": return <svg {...p} fill="currentColor"><polygon points="6 3 20 12 6 21 6 3" /></svg>;
    case "pause": return <svg {...p} fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "chevronLeft": return <svg {...p}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevronRight": return <svg {...p}><polyline points="9 18 15 12 9 6" /></svg>;
    case "sparkles": return <svg {...p} fill="currentColor" stroke="none"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6z" /></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "arrowUp": return <svg {...p}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>;
    case "arrowDown": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></svg>;
    case "check": return <svg {...p}><polyline points="20 6 9 17 4 12" /></svg>;
    case "rotate": return <svg {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>;
    case "loader": return <svg {...p} className={"spin " + className}><circle cx="12" cy="12" r="9" strokeDasharray="40 20" /></svg>;
    case "film": return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="7" y1="3" x2="7" y2="21" /><line x1="17" y1="3" x2="17" y2="21" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /></svg>;
    case "volume": return <svg {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 5.5a9 9 0 0 1 0 13" /></svg>;
    case "music": return <svg {...p}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>;
    default: return null;
  }
}

function StepPill({ step, active, done, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className="flex items-center gap-2 px-3 py-2 rounded-full text-sm whitespace-nowrap transition-colors shrink-0"
      style={{ backgroundColor: active ? ACCENT : done ? SURFACE_2 : "transparent", color: active ? "#fff" : done ? TEXT : MUTED,
        border: `1px solid ${active ? ACCENT : LINE}`, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1 }}>
      <span className="flex items-center justify-center rounded-full text-xs font-medium" style={{ width: 18, height: 18,
        backgroundColor: done && !active ? ACCENT : "transparent", border: active || (done && !active) ? "none" : `1px solid ${MUTED}`,
        color: active ? "#fff" : done ? "#fff" : MUTED }}>
        {done && !active ? <Icon name="check" size={11} /> : step}
      </span>
      {STEPS[step - 1].label}
    </button>
  );
}

// One Ken-Burns-animated image layer. Mounts at opacity 0 and fades in,
// and continuously updates its own transform via rAF while active.
function SceneLayer({ src, active, isPlaying, getProgress, kbParams, fadeMs }) {
  const imgRef = useRef(null);
  const [faded, setFaded] = useState(false);

  useEffect(() => {
    setFaded(false);
    const t = requestAnimationFrame(() => setFaded(true));
    return () => cancelAnimationFrame(t);
  }, [src]);

  useEffect(() => {
    if (!active) return;
    let raf;
    const tick = () => {
      applyKenBurns(imgRef.current, kbParams, getProgress());
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [active, isPlaying, kbParams]);

  useEffect(() => {
    if (!active) applyKenBurns(imgRef.current, kbParams, 0);
  }, [active, kbParams]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt=""
      className={`kb-img kb-fade absolute inset-0 w-full h-full object-cover ${faded ? "kb-fade-in" : ""}`}
      style={{ zIndex: active ? 2 : 1, ...(fadeMs ? { transitionDuration: `${fadeMs}ms` } : {}) }}
    />
  );
}

// The proxy only serves a URL the server signed, so both the url and its signature travel
// together everywhere a clip does.
function proxyUrlFor(clip) {
  const url = typeof clip === "string" ? clip : clip.url;
  const sig = typeof clip === "string" ? "" : clip.sig || "";
  return "/api/proxy-video?url=" + encodeURIComponent(url) + "&sig=" + encodeURIComponent(sig);
}

// Loads a generated clip into a <video> ready for canvas compositing. It is fetched through our
// own proxy and handed to the element as a blob: URL, which makes it same-origin - without that
// the canvas would be tainted and neither the player nor the export could read a pixel back.
async function loadClipVideo(clip) {
  const res = await fetch(proxyUrlFor(clip));
  if (!res.ok) throw new Error("Kunne ikke hente det genererede klip.");
  const blob = await res.blob();
  const v = document.createElement("video");
  v.src = URL.createObjectURL(blob);
  v.muted = true;
  v.playsInline = true;
  v.preload = "auto";
  v.loop = false;
  await new Promise((resolve, reject) => {
    v.onloadeddata = resolve;
    v.onerror = () => reject(new Error("Klippet kunne ikke afkodes."));
  });
  return v;
}

// HOW LONG DOES THIS CLIP ACTUALLY MOVE?
//
// Measured, because it cannot be assumed and it is not the same twice. Ray 3.2 runs its camera
// move and then STOPS, holding the last frame for whatever is left of the five seconds. How long
// it moves for varies per clip: one room was still travelling at 4.7s while another had come to
// rest by 0.6s. Read off a recording of eight rooms, the moving part ran anywhere from under a
// second to the full clip.
//
// This was found the hard way. The edit had just been changed to hold a clip-carrying shot for
// 4.66s of its 5 seconds - on the reasoning that a clip we paid for should be seen - and that
// pushed several shots deep into the dead tail, so they showed real motion and then froze on
// screen for two seconds. The utilisation figure that justified it counted the clip's DURATION,
// not its MOTION, which is the only part worth paying for.
//
// Samples six times a second into a 64x36 buffer. The threshold floats with the clip's own peak,
// because a slow dolly and a fast orbit are nowhere near each other in absolute terms.
async function measureClipMotion(v) {
  const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
  if (!dur) return null;
  const W = 64, H = 36, STEP = 1 / 6;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const cx = c.getContext("2d", { willReadFrequently: true });
  if (!cx) return null;

  const seek = (t) => new Promise((done) => {
    let settled = false;
    const finish = () => { if (settled) return; settled = true; v.removeEventListener("seeked", finish); done(); };
    v.addEventListener("seeked", finish);
    // A seek that never reports back must not hang the whole walkthrough.
    setTimeout(finish, 400);
    try { v.currentTime = Math.min(t, Math.max(0, dur - 0.02)); } catch (e) { finish(); }
  });

  const samples = [];
  let prev = null;
  for (let t = 0; t < dur; t += STEP) {
    await seek(t);
    try { cx.drawImage(v, 0, 0, W, H); } catch (e) { return null; }
    let px;
    try { px = cx.getImageData(0, 0, W, H).data; } catch (e) { return null; }
    if (prev) {
      let sum = 0;
      for (let k = 0; k < px.length; k += 4) sum += Math.abs(px[k] - prev[k]);
      samples.push({ t, d: sum / (px.length / 4) });
    }
    prev = new Uint8ClampedArray(px);
  }
  if (samples.length < 2) return null;

  // Smoothed over three samples, so one noisy frame cannot decide where the move begins.
  const sm = samples.map((s, i) => {
    const a = samples[Math.max(0, i - 1)].d, b = s.d, c = samples[Math.min(samples.length - 1, i + 1)].d;
    return { t: s.t, d: (a + b + c) / 3 };
  });
  const peak = sm.reduce((m, s) => Math.max(m, s.d), 0);
  // Two different questions, so two different thresholds.
  //
  // AT PACE decides where to cut in. These clips do not start at speed: they hold the photograph
  // for a moment, wind up, and then travel. Cutting in at the first flicker of movement therefore
  // lands on the wind-up, and the film cuts from a shot travelling at full speed to one that is
  // barely moving - which reads as a stumble even though both shots are fine on their own.
  // Landing where the camera is already at pace is what makes the two sides of a cut match.
  //
  // DEAD is the other end: below it the picture is only carrying compression noise.
  const atPace = peak * 0.45;
  const dead = Math.max(0.6, peak * 0.18);
  const first = sm.find((s) => s.d >= atPace);
  if (!first) return { start: 0, moving: 0, dur };
  let last = sm[sm.length - 1];
  for (let i = sm.length - 1; i >= 0; i--) { if (sm[i].d >= dead) { last = sm[i]; break; } }
  const start = Math.max(0, Math.min(first.t, dur));
  const end = Math.min(dur, last.t + STEP);
  return { start, moving: Math.max(0, end - start), dur };
}

function releaseShot(shot) {
  if (shot && shot.video) {
    try { shot.video.pause(); } catch (e) {}
    if (shot.video.src.startsWith("blob:")) URL.revokeObjectURL(shot.video.src);
  }
}

// The whole walkthrough on ONE canvas. Each photo is prescaled once to a plate sized for the
// current output (see buildPlate) and then played back by moving a rectangle across it.
//
// Nothing is rebuilt during playback, which is what keeps the cuts clean: an earlier design gave
// every shot its own layer, and because each layer rebuilt when its source changed, the outgoing
// and incoming shots rebuilt at the same instant and neither drew anything - a black frame at
// every cut.
//
// Composition goes through composeShowFrame, the same function the exporter uses, so the file
// that is downloaded is frame for frame what was on screen.
function FlythroughStage({ stills, specs, clips, onError, titles, clockRef }) {
  // Held in a ref, not a dependency: typing an address must update the frame on the next tick,
  // not tear down the canvas and rebuild every plate on each keystroke.
  const titlesRef = React.useRef(titles);
  titlesRef.current = titles;
  const hostRef = useRef(null);

  useEffect(() => {
    const host = hostRef.current;
    if (!host || stills.length === 0) return;
    let disposed = false;
    let raf = 0;

    const out = document.createElement("canvas");
    out.style.width = "100%";
    out.style.height = "100%";
    out.style.display = "block";
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = "high";
    host.innerHTML = "";
    host.appendChild(out);

    let images = null;   // decoded photos, full size
    let videos = null;   // generated clips, when the high-quality pass has produced them
    let shots = null;    // { plate | video, spec } per shot, sized for the CURRENT canvas
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = 0, H = 0;

    // Rebuilds the plates whenever the canvas size changes materially. Reading the size here
    // rather than once at mount is what stops a late stylesheet or a rotated phone from leaving
    // a canvas that does not match its box - the cause of the black bars reported on mobile.
    const refit = () => {
      if (disposed) return false;
      const cw = host.clientWidth, ch = host.clientHeight;
      if (cw < 2 || ch < 2) return false;
      const nw = Math.round(cw * dpr), nh = Math.round(ch * dpr);
      if (nw === W && nh === H) return true;
      W = nw; H = nh;
      out.width = W;
      out.height = H;
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = "high";
      // A shot backed by a generated clip needs no plate: the clip carries its own camera move
      // and is simply cover-fitted, so a resize costs nothing for those.
      if (images) {
        shots = images.map((img, i) => (videos && videos[i]
          ? { video: videos[i], spec: specs[i] }
          : { plate: buildPlate(img, W, H), spec: specs[i] }));
      }
      return true;
    };

    const build = async () => {
      const loaded = [];
      for (let i = 0; i < stills.length; i++) {
        const img = await loadImageEl(stills[i]);
        if (disposed) return;
        loaded.push(img);
      }
      images = loaded;
      if (clips && clips.length) {
        // Any clip that fails to load simply falls back to its still, so one bad clip degrades
        // that single shot instead of taking down the whole walkthrough.
        videos = [];
        for (let i = 0; i < stills.length; i++) {
          // A clip the plan rejected for barely moving is not loaded at all - that also saves
          // the phone a video element it would only have decoded to stand still.
          if (!clips[i] || (specs[i] && specs[i].useClip === false)) { videos.push(null); continue; }
          try {
            const v = await loadClipVideo(clips[i]);
            if (disposed) { releaseShot({ video: v }); return; }
            videos.push(v);
          } catch (e) { videos.push(null); }
        }
      }
      W = H = 0; // force a refit so the plates are built for the real canvas size
      refit();
      const t0 = performance.now();
      const tick = () => {
        if (disposed) return;
        raf = requestAnimationFrame(tick);
        if (!refit() || !shots) return;
        const c = clockRef && clockRef.current;
        const tMs = c
          ? (c.playing ? c.baseMs + (performance.now() - c.since) : c.baseMs)
          : performance.now() - t0;
        composeShowFrame(octx, W, H, shots, tMs, { titles: titlesRef.current });
      };
      raf = requestAnimationFrame(tick);
    };

    build().catch((e) => { if (!disposed && onError) onError(e.message || "Kunne ikke indlæse billederne."); });

    const ro = new ResizeObserver(() => refit());
    ro.observe(host);

    return () => {
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      if (videos) videos.forEach((v) => releaseShot({ video: v }));
      images = null;
      shots = null;
      host.innerHTML = "";
    };
    // eslint-disable-next-line
  }, [stills, specs, clips]);

  return <div ref={hostRef} className="absolute inset-0 w-full h-full" />;
}

// ---- Video export -----------------------------------------------------------------------
// Renders the whole walkthrough frame by frame into one canvas and records it, reusing the
// exact scene and camera code the live preview uses. Runs entirely in the browser: no render
// server, no upload, no per-video cost.
// Full HD in every orientation. The old 720-line sizes were a phone-first compromise; a listing
// video goes on a property site and a big screen as often as it goes on Reels.
const EXPORT_FORMATS = {
  "16:9": { w: 1920, h: 1080, ar: 16 / 9, label: "Bredformat", where: "Boligsite, YouTube, storskærm" },
  "9:16": { w: 1080, h: 1920, ar: 9 / 16, label: "Højformat", where: "Reels, TikTok, Stories" },
  "1:1": { w: 1080, h: 1080, ar: 1, label: "Kvadratisk", where: "Instagram-feed" },
};

function pickRecorderMime() {
  const candidates = [
    // Codec pairs first, so the chosen container is one that can actually carry the music track.
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm",
  ];
  if (!window.MediaRecorder || !window.MediaRecorder.isTypeSupported) return "";
  for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

const HIDDEN_TAB_MSG =
  "Optagelsen kræver at denne fane er fremme. Browseren sætter canvas-optagelse på pause i en " +
  "baggrundsfane, og filen bliver tom. Lad fanen være synlig, og prøv igen.";

async function exportFlythroughVideo({ stills, specs, clips, format, fps = 30, onProgress, musicBytes, titles }) {
  if (!window.MediaRecorder) throw new Error("Din browser understøtter ikke videooptagelse. Prøv Chrome eller Safari 17+.");
  const mime = pickRecorderMime();
  if (!mime) throw new Error("Din browser kan ikke optage video fra et canvas.");
  // A backgrounded tab throttles timers and stops compositing the canvas, so MediaRecorder
  // receives nothing and the recording comes out as a zero-byte file. Caught here rather than
  // handed to the user as a download link that yields a broken file.
  if (document.hidden) throw new Error(HIDDEN_TAB_MSG);
  const fmt = EXPORT_FORMATS[format];
  const w = fmt.w, h = fmt.h;

  const out = document.createElement("canvas");
  out.width = w;
  out.height = h;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = "high";
  octx.fillStyle = "#000";
  octx.fillRect(0, 0, w, h);

  const shots = [];
  const cleanup = () => { shots.forEach(releaseShot); shots.length = 0; };
  // Declared out here, not inside the try: the finally below shuts them down, and a `let` inside
  // the try block would not be in scope there.
  let audioCtx = null, musicNodes = null;

  try {
    // Sources are built up front, at this format's size, so no frame stalls mid-recording.
    // A generated clip is used where one exists; otherwise the still, so a half-generated
    // walkthrough still exports as a complete video.
    for (let i = 0; i < stills.length; i++) {
      let shot = null;
      // The same test the player uses. Without it the downloaded file kept the clips the player
      // had dropped for barely moving, so the export showed frozen rooms that were not on screen
      // - the one divergence between preview and file that composeShowFrame exists to prevent.
      if (clips && clips[i] && !(specs[i] && specs[i].useClip === false)) {
        try { shot = { video: await loadClipVideo(clips[i]), spec: specs[i] }; } catch (e) { shot = null; }
      }
      if (!shot) {
        const img = await loadImageEl(stills[i]);
        shot = { plate: buildPlate(img, w, h), spec: specs[i] };
      }
      shots.push(shot);
      if (onProgress) onProgress({ phase: "prepare", current: i + 1, total: stills.length });
    }

    const totalMs = shots.reduce((a, s) => a + s.spec.durationMs, 0);
    const totalFrames = Math.max(1, Math.round((totalMs / 1000) * fps));

    // Music is mixed in as a real audio track on the recorded stream, so the downloaded file
    // carries it rather than the agent having to add it in another program. It is faded out over
    // the last second, and cut to the video's length.
    const totalSeconds = totalMs / 1000;
    const buildMusicTrack = async () => {
      if (!musicBytes) return null;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
        const buf = await audioCtx.decodeAudioData(musicBytes.slice(0));
        const dest = audioCtx.createMediaStreamDestination();
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        // A track shorter than the video loops rather than leaving silence at the end.
        src.loop = true;
        const gain = audioCtx.createGain();
        const FADE = Math.min(1.2, totalSeconds / 4);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.85, audioCtx.currentTime + Math.min(1, FADE));
        gain.gain.setValueAtTime(0.85, audioCtx.currentTime + Math.max(0, totalSeconds - FADE));
        gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + totalSeconds);
        src.connect(gain); gain.connect(dest);
        musicNodes = { src, dest };
        return dest.stream.getAudioTracks()[0];
      } catch (e) {
        // Music is a nice-to-have; a video without it beats no video at all.
        return null;
      }
    };
    const musicTrack = await buildMusicTrack();

    const stream = out.captureStream(0);
    const track = stream.getVideoTracks()[0];
    // Safari and older Chrome don't expose requestFrame on the capture track; there the stream
    // has to sample the canvas on its own clock instead of being pushed one frame at a time.
    const manualFrames = typeof track.requestFrame === "function";
    const baseStream = manualFrames ? stream : out.captureStream(fps);
    const liveStream = musicTrack
      ? new MediaStream([...baseStream.getVideoTracks(), musicTrack])
      : baseStream;
    const chunks = [];
    // Scaled to the pixel count: 1080p needs roughly twice the bitrate 720p did, and a slow pan
    // across a detailed room is exactly the content that shows compression blocking.
    const bitrate = Math.round(Math.min(24e6, Math.max(10e6, (w * h * fps) / 1000 * 0.42)));
    const recorder = new MediaRecorder(liveStream, { mimeType: mime, videoBitsPerSecond: bitrate });
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const finished = new Promise((res) => { recorder.onstop = res; });
    recorder.start();
    if (musicNodes) { try { musicNodes.src.start(); } catch (e) {} }

    // If the tab is hidden part-way through, everything recorded from that point is lost. Stop
    // and say so, rather than finishing and handing over a truncated file.
    let wentHidden = false;
    const onVis = () => { if (document.hidden) wentHidden = true; };
    document.addEventListener("visibilitychange", onVis);

    // MediaRecorder timestamps frames by wall clock, so the loop is paced to real time rather
    // than run flat out - otherwise a slow machine would produce a correct-looking but
    // slow-motion file.
    const t0 = performance.now();
    try {
      for (let f = 0; f < totalFrames; f++) {
        if (wentHidden) break;
        const tMs = (f / fps) * 1000;
        // Same composer as the live preview, so the file is frame for frame what was on screen.
        composeShowFrame(octx, w, h, shots, tMs, { titles });
        if (manualFrames) track.requestFrame();

        if (f % 5 === 0 && onProgress) onProgress({ phase: "render", current: f + 1, total: totalFrames });
        const behind = performance.now() - t0;
        const wait = tMs - behind;
        await new Promise((r) => setTimeout(r, wait > 1 ? wait : 0));
      }
    } finally {
      document.removeEventListener("visibilitychange", onVis);
    }

    await new Promise((r) => setTimeout(r, 150));
    recorder.stop();
    await finished;
    const blob = new Blob(chunks, { type: mime.split(";")[0] });
    // Last line of defence: whatever the cause, never hand back a file that isn't a video.
    // An empty or near-empty blob means the recorder got nothing - most often a hidden tab.
    if (blob.size < 2048) throw new Error(wentHidden || document.hidden ? HIDDEN_TAB_MSG : "Optagelsen blev tom. Prøv igen med fanen fremme.");
    if (wentHidden) throw new Error(HIDDEN_TAB_MSG);
    return blob;
  } finally {
    cleanup();
    if (musicNodes) { try { musicNodes.src.stop(); } catch (e) {} }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
  }
}

function Rundvis() {
  const [step, setStep] = useState(1);
  // No mode choice. The free video is made the moment the photos are in, and paying for real
  // camera movement is an upgrade afterwards - once there is something to compare it against.
  const [propertyType, setPropertyType] = useState("villa"); // kept for the legacy script path
  const [images, setImages] = useState([]);
  const [address, setAddress] = useState("");
  const [agentName, setAgentName] = useState("");
  const [notes, setNotes] = useState("");
  const [scenes, setScenes] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [genError, setGenError] = useState("");

  const [isPlaying, setIsPlaying] = useState(false);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [prevIndex, setPrevIndex] = useState(null);
  const [voices, setVoices] = useState([]); // [{status:'idle'|'loading'|'ready'|'error', url, mode:'audio'|'browser'}]
  const [voicesPreparing, setVoicesPreparing] = useState(false);
  const [voiceOverallError, setVoiceOverallError] = useState("");
  const [musicOn, setMusicOn] = useState(false);

  // Walkthrough state: deterministic 2D camera motion (see the module-level
  // depth/parallax helpers above) - no AI video generation is involved any more, so there's no
  // upload step and no video URL to track, just the resized stills and their depth maps.
  const [flythroughStatus, setFlythroughStatus] = useState("idle"); // idle|processing|done|error
  const [flythroughError, setFlythroughError] = useState("");
  const [flythroughProgress, setFlythroughProgress] = useState({ current: 0, total: 0 });
  const [flythroughStills, setFlythroughStills] = useState([]); // resized data-URLs actually used, in upload order

  // Video export state: the walkthrough is rendered to a real file in the browser (see
  // exportFlythroughVideo), so an agent can actually post it instead of only viewing it here.
  const [exportStatus, setExportStatus] = useState("idle"); // idle|working|done|error
  const [exportProgress, setExportProgress] = useState({ phase: "", current: 0, total: 0 });
  const [exportError, setExportError] = useState("");
  const [exportFile, setExportFile] = useState(null); // { url, name }
  // Which shape the walkthrough is previewed in. Defaults to wide: that is how a listing video is
  // watched on a property site, and it is the format the photos were shot in.
  const [previewFormat, setPreviewFormat] = useState("16:9");

  // PREVIEW ONLY. The exporter runs its own loop at a fixed frame rate and never looks at this,
  // so pausing or running at double speed changes what you are watching and nothing about the
  // file you download.
  //
  // Held in a ref rather than state: the canvas effect would tear down and rebuild every plate if
  // this were a dependency, and pressing pause is not a reason to rebuild a film.
  const clockRef = useRef({ playing: true, baseMs: 0, since: 0 });
  const [playing, setPlaying] = useState(true);   // for how the button looks
  const scrubRef = useRef(null);
  const scrubBarRef = useRef(null);

  const filmNow = () => {
    const c = clockRef.current;
    return c.playing ? c.baseMs + (performance.now() - c.since) : c.baseMs;
  };
  const setClock = (patch) => {
    const c = clockRef.current;
    const now = performance.now();
    // Bank the time run so far before changing anything, or pausing would rewrite history.
    c.baseMs = c.playing ? c.baseMs + (now - c.since) : c.baseMs;
    c.since = now;
    Object.assign(c, patch);
  };

  // Music. The agent supplies the track: bundling one would mean shipping music we have no
  // licence to redistribute, and a listing video is published publicly. An uploaded file is
  // decoded once and reused for both the preview and the exported file.
  // Address and agent for the opening and closing cards. Empty means no cards at all: the film
  // is complete without them, and a half-filled title is worse than none.
  const [titles, setTitles] = useState({ headline: "", agent: "" });
  const [musicName, setMusicName] = useState("");
  const [musicError, setMusicError] = useState("");
  const [musicOnPreview, setMusicOnPreview] = useState(true);
  const musicBufferRef = useRef(null);   // decoded AudioBuffer
  const musicRawRef = useRef(null);      // the original bytes, re-decoded for each export
  const previewAudioRef = useRef(null);  // <audio> used only for the on-page preview

  // High-quality pass: each photo is sent to an image-to-video model, which returns a clip with
  // real camera movement through the room. Kept strictly separate from the free preview, because
  // it costs money per run - the preview is the storyboard the agent approves first.
  const [hqStatus, setHqStatus] = useState("idle"); // idle|working|done|error
  const [hqProgress, setHqProgress] = useState({ current: 0, total: 0, phase: "" });
  // Per room: "venter", "igang", "klar" or "fejl". A single count cannot say WHERE the work is,
  // and with six clips in flight at once that is most of what is happening.
  const [hqRoom, setHqRoom] = useState({});
  // Veo, for comparison only. Kept in its own array so a Veo test never overwrites a clip that
  // was paid for, and so the player can be switched between the two on the same room.
  const [veoClips, setVeoClips] = useState(null);
  const [veoStatus, setVeoStatus] = useState("idle");
  const [veoError, setVeoError] = useState("");
  const [veoRoom, setVeoRoom] = useState({});   // same per-room states as hqRoom
  const veoStartedRef = useRef({});
  const [showSource, setShowSource] = useState("luma");
  // Ticks while generating, only so the bar can advance on elapsed time. A clip takes about three
  // minutes, so a bar that moves only when one finishes stands perfectly still for minutes and
  // then jumps, which reads as broken rather than as patient.
  const [hqTick, setHqTick] = useState(0);
  const hqStartedRef = useRef({});
  const [hqError, setHqError] = useState("");
  const [hqClips, setHqClips] = useState(null); // array of clip URLs, one per still (null = not generated)
  // What each clip's camera actually does, measured once per clip. null = not measured yet.
  const [hqMotion, setHqMotion] = useState(null);
  // One model, so no picker. Quality is the only choice left, and it is a real one: Test exists
  // so a room can be checked for half the price before a whole property is committed to.
  // 1.20 for full quality is measured from a bill (9 clips, 10.80 $), not estimated.
  const QUALITIES = { test: { label: "Test", usd: 0.45 }, final: { label: "Fuld kvalitet", usd: 1.20 } };
  // Which photo the bake-off and the single-photo test use. Defaults to the SECOND photo, not
  // the first: by the app's own upload guidance photo 1 is the facade, and an exterior is the
  // easiest thing these models have to do - open scene, no doorframes, no furniture to bend.
  // Judging a model on the facade would flatter every one of them and could pick the wrong one.
  const [compareIndex, setCompareIndex] = useState(0);
  const [dragFrom, setDragFrom] = useState(null);   // index currently being dragged, or null
  const stripRef = useRef(null);
  // Test quality trades resolution for price on models that support it. It exists because the
  // opposite default was a costly mistake: generating at full resolution while showing no price
  // burned through an account's credit in three clips.
  // The quality picker is no longer in the interface, so this is where the choice lives now.
  // "final" is 1080p; "test" is 720p at roughly half the cost.
  const [hqQuality, setHqQuality] = useState("final");
  useEffect(() => {
    if (flythroughStills.length > 1) setCompareIndex(1);
    else setCompareIndex(0);
  }, [flythroughStills.length]);

  // The model list comes from the server so there is only one place where models are defined.
  useEffect(() => {
    let cancelled = false;
    fetch("/api/generate-clip/models")
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        if (cancelled || !d) return;
        setHqModels(d.models || []);
        setHqModel((cur) => cur || d.defaultModel);
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const fileInputRef = useRef(null);
  const audioRef = useRef(null);
  const sceneStartRef = useRef(0);
  const audioCtxRef = useRef(null);
  const musicNodesRef = useRef(null);

  const kbParamsList = useMemo(() => scenes.map((_, i) => kenBurnsParamsFor(i)), [scenes.length]);

  const handleFiles = (fileList) => {
    const files = Array.from(fileList).slice(0, 20 - images.length);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = (e) => setImages((prev) => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, src: e.target.result }]);
      reader.readAsDataURL(file);
    });
  };
  const removeImage = (id) => setImages((prev) => prev.filter((i) => i.id !== id));
  // The photo grid wraps onto several rows, so the index under the pointer is found from the live
  // layout rather than from arithmetic on a row width. No vertical tolerance here, unlike the
  // single-row strip on the video page: in a grid, generosity above and below a tile means the
  // row over and the row under.
  const imgGridRef = useRef(null);
  const [imgDragFrom, setImgDragFrom] = useState(null);
  const imageIndexAt = (x, y) => {
    const el = imgGridRef.current;
    if (!el) return null;
    const kids = el.querySelectorAll("[data-img]");
    for (let i = 0; i < kids.length; i++) {
      const r = kids[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
    }
    return null;
  };
  const reorderImage = (from, to) => {
    if (from === to || from < 0 || to < 0) return;
    setImages((prev) => {
      if (from >= prev.length || to >= prev.length) return prev;
      const next = [...prev];
      const [x] = next.splice(from, 1);
      next.splice(to, 0, x);
      return next;
    });
  };

  const moveImage = (idx, dir) => {
    setImages((prev) => {
      const next = [...prev]; const target = idx + dir;
      if (target < 0 || target >= next.length) return prev;
      [next[idx], next[target]] = [next[target], next[idx]];
      return next;
    });
  };

  // Reordering from the video page. The photo, its generated clip and the source list are moved
  // together: a clip the agent has already paid for must follow its photo rather than being
  // thrown away or, worse, ending up under a different room.
  // How many rooms still have no generated clip. Drives both the price shown on step 2 and
  // whether there is anything left to buy.
  // Only runs while something is generating, and does nothing but force a repaint so the bars can
  // advance on elapsed time.
  useEffect(() => {
    if (hqStatus !== "working" && veoStatus !== "working") return;
    const t = setInterval(() => setHqTick((n) => n + 1), 250);
    return () => clearInterval(t);
  }, [hqStatus, veoStatus]);

  // How far along one room is. A finished room is full; a room in flight fills against the three

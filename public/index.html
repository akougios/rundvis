<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rundvis — AI boligvideo prototype</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body, #root { height: 100%; }
  body { margin: 0; background: #15191C; font-family: 'IBM Plex Sans', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #2C3237; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  .kb-img { will-change: transform; transform-origin: center center; filter: saturate(1.08) contrast(1.04); }
  .kb-fade { opacity: 0; transition: opacity 550ms ease; }
  .kb-fade.kb-fade-in { opacity: 1; }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%); }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .kb-img { transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

const INK = "#15191C", SURFACE = "#1D2226", SURFACE_2 = "#242A2E", TEXT = "#F2EFE7",
  MUTED = "#98A0A6", ACCENT = "#3860E8", ACCENT_SOFT = "#293B72", AMBER = "#E3A33D", LINE = "#2C3237";

const PROPERTY_TYPES = [
  { id: "villa", label: "Villa", hint: "Roligt tempo, fokus på rum og lys" },
  { id: "sommerhus", label: "Sommerhus", hint: "Udeliv, terrasse, udsigt" },
  { id: "liebhaver", label: "Liebhaverbolig", hint: "Langsomt, cinematisk, detaljer" },
  { id: "nyhed", label: "Nyhed på markedet", hint: "Energisk tempo, skaber interesse" },
  { id: "prisnedsaettelse", label: "Prisnedsættelse", hint: "Tydeligt fokus på ny pris" },
  { id: "aabenthus", label: "Åbent hus", hint: "Dato og tidspunkt fremhævet" },
];
const STEPS = [{ id: 1, label: "Boligtype" }, { id: 2, label: "Billeder" }, { id: 3, label: "Manuskript" }, { id: 4, label: "Afspil" }];
const FALLBACK_SCENE_MS = 6000;

function seededRandom(seed) {
  const s = Math.sin(seed) * 10000;
  return s - Math.floor(s);
}
function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

// Deterministic per-scene camera-move: a mix of zoom in/out and a pan direction,
// varied by index so consecutive scenes don't all move the same way.
function kenBurnsParamsFor(index) {
  const r1 = seededRandom(index * 12.9898 + 3.7);
  const r2 = seededRandom(index * 78.233 + 1.3);
  const r3 = seededRandom(index * 37.719 + 2.1);
  const r4 = seededRandom(index * 5.234 + 4.9);
  const zoomIn = r1 > 0.5;
  const scaleAmt = 1.08 + r2 * 0.09; // 1.08 - 1.17
  const panX = (r3 - 0.5) * 7; // -3.5% .. 3.5%
  const panY = (r4 - 0.5) * 5; // -2.5% .. 2.5%
  return {
    scaleFrom: zoomIn ? 1.02 : scaleAmt,
    scaleTo: zoomIn ? scaleAmt : 1.02,
    panX, panY,
  };
}
function applyKenBurns(el, params, t) {
  if (!el) return;
  const e = easeInOutSine(Math.max(0, Math.min(1, t)));
  const scale = params.scaleFrom + (params.scaleTo - params.scaleFrom) * e;
  const tx = -params.panX / 2 + params.panX * e;
  const ty = -params.panY / 2 + params.panY * e;
  el.style.transform = `scale(${scale.toFixed(4)}) translate(${tx.toFixed(2)}%, ${ty.toFixed(2)}%)`;
}

function Icon({ name, size = 16, className = "", style = {} }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className, style };
  switch (name) {
    case "upload": return <svg {...p}><path d="M12 3v12" /><path d="m7 8 5-5 5 5" /><path d="M5 21h14" /></svg>;
    case "play": return <svg {...p} fill="currentColor"><polygon points="6 3 20 12 6 21 6 3" /></svg>;
    case "pause": return <svg {...p} fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "chevronLeft": return <svg {...p}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevronRight": return <svg {...p}><polyline points="9 18 15 12 9 6" /></svg>;
    case "sparkles": return <svg {...p} fill="currentColor" stroke="none"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6z" /></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "arrowUp": return <svg {...p}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>;
    case "arrowDown": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></svg>;
    case "check": return <svg {...p}><polyline points="20 6 9 17 4 12" /></svg>;
    case "rotate": return <svg {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>;
    case "loader": return <svg {...p} className={"spin " + className}><circle cx="12" cy="12" r="9" strokeDasharray="40 20" /></svg>;
    case "film": return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="7" y1="3" x2="7" y2="21" /><line x1="17" y1="3" x2="17" y2="21" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /></svg>;
    case "volume": return <svg {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 5.5a9 9 0 0 1 0 13" /></svg>;
    case "music": return <svg {...p}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>;
    default: return null;
  }
}

function StepPill({ step, active, done, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className="flex items-center gap-2 px-3 py-2 rounded-full text-sm whitespace-nowrap transition-colors shrink-0"
      style={{ backgroundColor: active ? ACCENT : done ? SURFACE_2 : "transparent", color: active ? "#fff" : done ? TEXT : MUTED,
        border: `1px solid ${active ? ACCENT : LINE}`, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1 }}>
      <span className="flex items-center justify-center rounded-full text-xs font-medium" style={{ width: 18, height: 18,
        backgroundColor: done && !active ? ACCENT : "transparent", border: active || (done && !active) ? "none" : `1px solid ${MUTED}`,
        color: active ? "#fff" : done ? "#fff" : MUTED }}>
        {done && !active ? <Icon name="check" size={11} /> : step}
      </span>
      {STEPS[step - 1].label}
    </button>
  );
}

// One Ken-Burns-animated image layer. Mounts at opacity 0 and fades in,
// and continuously updates its own transform via rAF while active.
function SceneLayer({ src, active, isPlaying, getProgress, kbParams }) {
  const imgRef = useRef(null);
  const [faded, setFaded] = useState(false);

  useEffect(() => {
    setFaded(false);
    const t = requestAnimationFrame(() => setFaded(true));
    return () => cancelAnimationFrame(t);
  }, [src]);

  useEffect(() => {
    if (!active) return;
    let raf;
    const tick = () => {
      applyKenBurns(imgRef.current, kbParams, getProgress());
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [active, isPlaying, kbParams]);

  useEffect(() => {
    if (!active) applyKenBurns(imgRef.current, kbParams, 0);
  }, [active, kbParams]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt=""
      className={`kb-img kb-fade absolute inset-0 w-full h-full object-cover ${faded ? "kb-fade-in" : ""}`}
      style={{ zIndex: active ? 2 : 1 }}
    />
  );
}

function Rundvis() {
  const [step, setStep] = useState(1);
  const [propertyType, setPropertyType] = useState(null);
  const [images, setImages] = useState([]);
  const [address, setAddress] = useState("");
  const [agentName, setAgentName] = useState("");
  const [notes, setNotes] = useState("");
  const [scenes, setScenes] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [genError, setGenError] = useState("");

  const [isPlaying, setIsPlaying] = useState(false);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [prevIndex, setPrevIndex] = useState(null);
  const [voices, setVoices] = useState([]); // [{status:'idle'|'loading'|'ready'|'error', url, mode:'audio'|'browser'}]
  const [voicesPreparing, setVoicesPreparing] = useState(false);
  const [voiceOverallError, setVoiceOverallError] = useState("");
  const [musicOn, setMusicOn] = useState(false);

  const [flythroughStatus, setFlythroughStatus] = useState("idle"); // idle|uploading|generating|done|error
  const [flythroughError, setFlythroughError] = useState("");
  const [flythroughVideoUrl, setFlythroughVideoUrl] = useState(null); // the one Luma AI clip: exterior -> through the front door
  const [flythroughImageUrls, setFlythroughImageUrls] = useState([]); // uploaded blob URLs, kept around so the entry clip can be regenerated without re-uploading
  const flythroughVideoRef = useRef(null);
  const [flythroughStills, setFlythroughStills] = useState([]); // local data-URLs of the images actually used: [0]=facade, [1]=entry photo (both feed the Luma clip), [2..]=room photos shown as a Ken-Burns montage after it
  const [showIntroFreeze, setShowIntroFreeze] = useState(false);
  const introFreezeTimerRef = useRef(null);
  const [flythroughPhase, setFlythroughPhase] = useState("entry"); // "entry" (playing the Luma clip) | "rooms" (Ken-Burns montage of the remaining photos)
  const [flythroughRoomIndex, setFlythroughRoomIndex] = useState(0);
  const [flythroughPrevRoomIndex, setFlythroughPrevRoomIndex] = useState(null);
  const flythroughRoomStartRef = useRef(0);

  const fileInputRef = useRef(null);
  const audioRef = useRef(null);
  const sceneStartRef = useRef(0);
  const audioCtxRef = useRef(null);
  const musicNodesRef = useRef(null);

  const kbParamsList = useMemo(() => scenes.map((_, i) => kenBurnsParamsFor(i)), [scenes.length]);

  const handleFiles = (fileList) => {
    const files = Array.from(fileList).slice(0, 20 - images.length);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = (e) => setImages((prev) => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, src: e.target.result }]);
      reader.readAsDataURL(file);
    });
  };
  const removeImage = (id) => setImages((prev) => prev.filter((i) => i.id !== id));
  const moveImage = (idx, dir) => {
    setImages((prev) => {
      const next = [...prev]; const target = idx + dir;
      if (target < 0 || target >= next.length) return prev;
      [next[idx], next[target]] = [next[target], next[idx]];
      return next;
    });
  };

  const generateScript = async () => {
    setGenerating(true); setGenError("");
    try {
      const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label || "bolig";
      const response = await fetch("/api/generate-script", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ propertyTypeLabel: typeLabel, address, agentName, notes, sceneCount: images.length }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ukendt fejl fra serveren.");
      const lines = data.lines || [];
      setScenes(images.map((img, i) => ({ imageId: img.id, text: lines[i] || "" })));
      setStep(3);
    } catch (err) {
      setGenError(`Kunne ikke generere manuskript: ${err.message}. Prøv igen, eller skriv scenerne manuelt herunder.`);
      if (scenes.length === 0) setScenes(images.map((img) => ({ imageId: img.id, text: "" })));
    } finally { setGenerating(false); }
  };

  const updateScene = (idx, text) => setScenes((prev) => { const n = [...prev]; n[idx] = { ...n[idx], text }; return n; });

  // ---- Voice generation (ElevenLabs, with per-scene browser-TTS fallback) ----
  const generateVoiceForIndex = async (idx, text) => {
    try {
      const res = await fetch("/api/generate-voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("voice-api-failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      return { status: "ready", url, mode: "audio" };
    } catch (err) {
      return { status: "ready", url: null, mode: "browser" };
    }
  };

  const prepareVoices = useCallback(async () => {
    if (!scenes.length) return;
    setVoicesPreparing(true);
    setVoiceOverallError("");
    const initial = scenes.map(() => ({ status: "loading", url: null, mode: null }));
    setVoices(initial);
    const results = new Array(scenes.length);
    const concurrency = 3;
    let cursor = 0;
    let anyAudioFailed = false;
    async function worker() {
      while (cursor < scenes.length) {
        const i = cursor++;
        const r = await generateVoiceForIndex(i, scenes[i].text);
        if (r.mode === "browser") anyAudioFailed = true;
        results[i] = r;
        setVoices((prev) => { const n = [...prev]; n[i] = r; return n; });
      }
    }
    await Promise.all(Array.from({ length: concurrency }, worker));
    if (anyAudioFailed) {
      setVoiceOverallError("Nogle scener kunne ikke få en AI-stemme (ElevenLabs) og bruger i stedet browserens indbyggede tale som reserve.");
    }
    setVoicesPreparing(false);
  }, [scenes]);

  useEffect(() => {
    if (step === 4 && scenes.length > 0 && voices.length === 0) {
      prepareVoices();
    }
  }, [step, scenes, voices.length, prepareVoices]);

  // ---- Ambient background music (Web Audio, no external file needed) ----
  const ensureAudioCtx = () => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  };
  const startMusic = () => {
    const ctx = ensureAudioCtx();
    if (!ctx || musicNodesRef.current) return;
    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.5);
    master.connect(ctx.destination);
    const freqs = [130.81, 164.81, 196.0]; // soft C major-ish pad
    const oscs = freqs.map((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.15;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(master);
      osc.start(); lfo.start();
      return { osc, lfo };
    });
    musicNodesRef.current = { master, oscs };
  };
  const stopMusic = () => {
    const nodes = musicNodesRef.current;
    const ctx = audioCtxRef.current;
    if (!nodes || !ctx) return;
    nodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    setTimeout(() => {
      nodes.oscs.forEach(({ osc, lfo }) => { try { osc.stop(); lfo.stop(); } catch (e) {} });
    }, 700);
    musicNodesRef.current = null;
  };
  useEffect(() => {
    if (isPlaying && musicOn) startMusic();
    if ((!isPlaying || !musicOn)) stopMusic();
    // eslint-disable-next-line
  }, [isPlaying, musicOn]);
  useEffect(() => () => { stopMusic(); if (audioCtxRef.current) audioCtxRef.current.close(); }, []);

  // ---- Playback engine ----
  const advanceScene = useCallback(() => {
    setCurrentIndex((i) => {
      if (i + 1 >= scenes.length) { setIsPlaying(false); return 0; }
      setPrevIndex(i);
      return i + 1;
    });
  }, [scenes.length]);

  useEffect(() => {
    if (!isPlaying) return;
    const voice = voices[currentIndex];
    if (!voice || voice.status !== "ready") return;
    sceneStartRef.current = performance.now();
    if (voice.mode === "audio" && voice.url) {
      const audio = audioRef.current;
      audio.src = voice.url;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      const onEnded = () => advanceScene();
      audio.addEventListener("ended", onEnded);
      return () => audio.removeEventListener("ended", onEnded);
    } else {
      const text = scenes[currentIndex]?.text || "";
      if (text && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const daVoice = window.speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("da"));
        if (daVoice) utter.voice = daVoice;
        utter.lang = "da-DK"; utter.rate = 0.96;
        utter.onend = () => advanceScene();
        utter.onerror = () => advanceScene();
        window.speechSynthesis.speak(utter);
        return () => window.speechSynthesis.cancel();
      } else {
        const t = setTimeout(advanceScene, FALLBACK_SCENE_MS);
        return () => clearTimeout(t);
      }
    }
    // eslint-disable-next-line
  }, [isPlaying, currentIndex, voices]);

  useEffect(() => {
    if (prevIndex === null) return;
    const t = setTimeout(() => setPrevIndex(null), 600);
    return () => clearTimeout(t);
  }, [prevIndex]);

  const getProgress = useCallback(() => {
    const voice = voices[currentIndex];
    if (voice && voice.mode === "audio" && audioRef.current && audioRef.current.duration) {
      return audioRef.current.currentTime / audioRef.current.duration;
    }
    const elapsed = performance.now() - sceneStartRef.current;
    return elapsed / FALLBACK_SCENE_MS;
  }, [voices, currentIndex]);

  const allVoicesReady = voices.length === scenes.length && voices.every((v) => v && v.status === "ready");

  // ---- AI-gennemgang (experimental): ONE short Luma AI clip for the exterior->through-the-door
  // arrival, followed by a Ken-Burns pan/zoom montage of the remaining room photos (reusing the
  // same SceneLayer/kenBurnsParamsFor technique as the scripted voiceover flow above). This
  // matches how real estate walkthrough videos are actually cut in practice - not one continuous
  // AI-generated flight through every room (which Luma can't reliably plan structure/order for),
  // but a real "coming through the door" moment plus a nicely edited slideshow of the individual
  // rooms. It's also far cheaper: only 2 photos ever go to Luma, no matter how many rooms there are.
  const MAX_FLYTHROUGH_IMAGES = 8;
  const FLYTHROUGH_ENTRY_KEYFRAME_COUNT = 2; // must match ENTRY_KEYFRAME_COUNT in api/generate-flythrough/create.js - only facade + first room go into the one AI clip; the rest are shown as a Ken-Burns montage, no AI
  const FLYTHROUGH_MAX_DIMENSION = 1600; // client-side resize cap before upload - Luma renders at 720p anyway, so a full-res phone photo (often 5-15MB) only slows the upload and inflates storage for no visual gain

  // Downscale a data-URL image in the browser (canvas) before it's uploaded.
  const resizeImageDataUrl = (dataUrl, maxDimension) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(dataUrl); return; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => resolve(dataUrl); // fall back to the original if decoding fails
      img.src = dataUrl;
    });

  const uploadImageForFlythrough = async (src, index) => {
    const resized = await resizeImageDataUrl(src, FLYTHROUGH_MAX_DIMENSION);
    const res = await fetch("/api/upload-image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dataUrl: resized, filename: `rundvis-${Date.now()}-${index}.jpg` }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Upload fejlede.");
    return data.url;
  };

  const pollGeneration = async (id) => {
    // eslint-disable-next-line no-constant-condition
    while (true) {
      await new Promise((r) => setTimeout(r, 3000));
      const res = await fetch(`/api/generate-flythrough/status?id=${encodeURIComponent(id)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Statusopslag fejlede.");
      if (data.state === "completed") return data.videoUrl;
      if (data.state === "failed") throw new Error(data.failureReason || "Gennemgangen fejlede hos Luma.");
    }
  };

  // Uploads (if needed) all photos and starts ONE Luma clip using only the
  // first two (facade -> entry photo). The remaining photos never go to
  // Luma at all - they're shown as a Ken-Burns montage client-side, so
  // there's nothing there for the AI to get "confused" about.
  const runFlythrough = async (reuseUploadedUrls) => {
    setFlythroughStatus(reuseUploadedUrls ? "generating" : "uploading");
    setFlythroughError("");
    setFlythroughVideoUrl(null);
    try {
      let urls = reuseUploadedUrls;
      if (!urls) {
        const used = images.slice(0, MAX_FLYTHROUGH_IMAGES);
        setFlythroughStills(used.map((img) => img.src));
        urls = [];
        for (let i = 0; i < used.length; i++) {
          urls.push(await uploadImageForFlythrough(used[i].src, i));
        }
        setFlythroughImageUrls(urls);
        setFlythroughStatus("generating");
      }
      const res = await fetch("/api/generate-flythrough/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageUrls: urls.slice(0, FLYTHROUGH_ENTRY_KEYFRAME_COUNT), aspectRatio: "9:16" }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Kunne ikke starte gennemgangen.");
      const videoUrl = await pollGeneration(data.id);
      setFlythroughVideoUrl(videoUrl);
      setFlythroughPhase("entry");
      setFlythroughRoomIndex(0);
      setFlythroughPrevRoomIndex(null);
      setFlythroughStatus("done");
    } catch (err) {
      setFlythroughError(err.message);
      setFlythroughStatus("error");
    }
  };

  // Re-runs just the entry clip without re-uploading the same photos.
  const regenerateFlythrough = () => {
    if (flythroughImageUrls.length > 0) runFlythrough(flythroughImageUrls);
  };

  // Room photos (everything after the AI entry clip): a classic real-estate-listing
  // still-photo presentation, but with a bit more life than pure "either zoom OR pan" -
  // each photo gets one dominant move (zoom-in, zoom-out, or a pan) plus a small amount
  // of the other axis mixed in, the way a real Ken Burns edit rarely holds perfectly still
  // on one axis. Alternates dominant move room to room for variety, still calm and slow.
  // Deterministic per index (seededRandom) so it doesn't reshuffle on every re-render.
  const flythroughRoomStills = flythroughStills.slice(FLYTHROUGH_ENTRY_KEYFRAME_COUNT);
  const flythroughRoomParams = useMemo(
    () =>
      flythroughRoomStills.map((_, i) => {
        const r1 = seededRandom(i * 53.173 + 9.31);
        const r2 = seededRandom(i * 19.61 + 4.7);
        const r3 = seededRandom(i * 8.11 + 1.9);
        const r4 = seededRandom(i * 31.47 + 6.2);
        const moveType = i % 3; // cycle: zoom-in, pan, zoom-out (then repeats) for natural variety
        const scaleAmt = 1.035 + r2 * 0.025; // 1.035 - 1.06: gentle but visible zoom
        const panAmt = 2.0 + r3 * 1.6; // 2.0% - 3.6% travel
        const panHorizontal = r2 > 0.5;
        const panSign = r1 > 0.5 ? 1 : -1;
        const microPan = 0.5 + r4 * 0.5; // 0.5% - 1.0%: a touch of secondary drift so zooms never sit dead-still
        const microScale = 1.008 + r4 * 0.006; // a hair of zoom mixed into pure pans
        const durationMs = 5600 + r2 * 2000; // ~5.6-7.6s, slow classic listing pace
        let kb;
        if (moveType === 1) {
          // Pan, with a whisper of zoom so it doesn't feel flat
          kb = {
            scaleFrom: 1.0,
            scaleTo: microScale,
            panX: panHorizontal ? panSign * panAmt : panSign * microPan,
            panY: panHorizontal ? panSign * microPan : panSign * panAmt,
          };
        } else {
          // Zoom in or out, with a faint drift on the other axis
          const zoomIn = moveType === 0;
          kb = {
            scaleFrom: zoomIn ? 1.0 : scaleAmt,
            scaleTo: zoomIn ? scaleAmt : 1.0,
            panX: panHorizontal ? panSign * microPan : 0,
            panY: panHorizontal ? 0 : panSign * microPan,
          };
        }
        return { durationMs, kb };
      }),
    // eslint-disable-next-line
    [flythroughRoomStills.length]
  );

  const getFlythroughRoomProgress = () => {
    const dur = flythroughRoomParams[flythroughRoomIndex]?.durationMs || 3000;
    return (performance.now() - flythroughRoomStartRef.current) / dur;
  };

  const advanceFlythroughRoom = () => {
    setFlythroughRoomIndex((i) => {
      const next = i + 1;
      setFlythroughPrevRoomIndex(i);
      if (next >= flythroughRoomStills.length) {
        // Montage finished - loop back to the start of the whole thing.
        setFlythroughPhase("entry");
        return 0;
      }
      return next;
    });
  };

  // Drives the room montage: shows each room photo for its own duration,
  // then advances (or loops back to the entry clip after the last one).
  useEffect(() => {
    if (flythroughStatus !== "done" || flythroughPhase !== "rooms") return;
    if (flythroughRoomStills.length === 0) { setFlythroughPhase("entry"); return; }
    flythroughRoomStartRef.current = performance.now();
    const dur = flythroughRoomParams[flythroughRoomIndex]?.durationMs || 3000;
    const t = setTimeout(advanceFlythroughRoom, dur);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [flythroughStatus, flythroughPhase, flythroughRoomIndex, flythroughRoomStills.length]);

  // Clears the outgoing room layer shortly after the incoming one has
  // finished its crossfade-in (mirrors the scripted-scene player above).
  useEffect(() => {
    if (flythroughPrevRoomIndex === null) return;
    const t = setTimeout(() => setFlythroughPrevRoomIndex(null), 600);
    return () => clearTimeout(t);
  }, [flythroughPrevRoomIndex]);

  // Entry-clip playback: held under the literal uploaded facade photo for a
  // beat before playback starts, so the opening frame is guaranteed to be
  // exactly the uploaded photo regardless of any AI drift on frame 0 - per
  // the "starten skal være ens hver gang" requirement.
  useEffect(() => {
    if (flythroughStatus !== "done" || flythroughPhase !== "entry" || !flythroughVideoUrl) return;
    const el = flythroughVideoRef.current;
    if (el) {
      el.currentTime = 0;
      el.play().catch(() => {});

    setShowIntroFreeze(true);
    if (introFreezeTimerRef.current) clearTimeout(introFreezeTimerRef.current);
    introFreezeTimerRef.current = setTimeout(() => setShowIntroFreeze(false), 700);
    // eslint-disable-next-line
  }, [flythroughStatus, flythroughPhase, flythroughVideoUrl]);

  const handleFlythroughEntryEnded = () => {
    if (flythroughRoomStills.length > 0) {
      setFlythroughRoomIndex(0);
      setFlythroughPrevRoomIndex(null);
      setFlythroughPhase("rooms");
    } else {
      // No room photos - just loop the entry clip on its own.
      const el = flythroughVideoRef.current;
      if (el) { el.currentTime = 0; el.play().catch(() => {}); }
      setShowIntroFreeze(true);
      if (introFreezeTimerRef.current) clearTimeout(introFreezeTimerRef.current);
      introFreezeTimerRef.current = setTimeout(() => setShowIntroFreeze(false), 700);

                <div className="space-y-3 mb-6">

                      <div className="flex-1">

                  kbParams={kbParamsList[prevIndex] || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}

              <div className="absolute inset-0 vignette pointer-events-none" style={{ zIndex: 3 }} />

              {flythroughStatus === "error" && <p className="text-xs" style={{ color: AMBER }}>{flythroughError}</p>}

              {flythroughStatus === "done" && flythroughVideoUrl && (
                <div className="relative rounded-lg overflow-hidden mb-4" style={{ backgroundColor: "#000", aspectRatio: "9/16", maxWidth: 320 }}>
                  <video ref={flythroughVideoRef} src={flythroughVideoUrl} className="absolute inset-0 w-full h-full object-cover transition-opacity duration-500"
                    style={{ opacity: flythroughPhase === "entry" ? 1 : 0, zIndex: flythroughPhase === "entry" ? 2 : 1 }}
                    playsInline autoPlay onEnded={handleFlythroughEntryEnded} />
                  {flythroughPhase === "entry" && flythroughStills[0] && (
                    <img src={flythroughStills[0]} alt="" className="absolute inset-0 w-full h-full object-cover transition-opacity duration-500"
                      style={{ opacity: showIntroFreeze ? 1 : 0, zIndex: 3, pointerEvents: "none" }} />
                  )}
                  {flythroughPhase === "rooms" && flythroughRoomStills.length > 0 && (
                    <>
                      {flythroughPrevRoomIndex !== null && (
                        <SceneLayer
                          src={flythroughRoomStills[flythroughPrevRoomIndex]}
                          active={false}
                          isPlaying={true}
                          getProgress={() => 1}
                          kbParams={flythroughRoomParams[flythroughPrevRoomIndex]?.kb || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}
                        />
                      )}
                      <SceneLayer
                        key={`room-${flythroughRoomIndex}`}
                        src={flythroughRoomStills[flythroughRoomIndex]}
                        active={true}
                        isPlaying={true}
                        getProgress={getFlythroughRoomProgress}
                        kbParams={flythroughRoomParams[flythroughRoomIndex]?.kb || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}
                      />
                    </>
                  )}
                </div>
              )}

              {flythroughStatus === "done" && flythroughVideoUrl && (
                <div className="flex items-center gap-4 mb-2">
                  <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs" style={{ color: MUTED }}>
                    <Icon name="rotate" size={12} /> Generér indgangsklip forfra
                  </button>
                  <a href={flythroughVideoUrl} download="rundvis-indgang.mp4" target="_blank" rel="noreferrer" className="flex items-center gap-1.5 text-xs" style={{ color: MUTED }}>
                    <Icon name="upload" size={12} className="rotate-180" /> Gem indgangsklip
                  </a>
                </div>
              )}

              {flythroughStatus === "done" && flythroughVideoUrl && (
                <p className="text-[10px] mb-4" style={{ color: MUTED }}>
                  Kun AI-indgangsklippet kan gemmes som video (link fra Luma udløber efter ca. 1 time) — resten af gennemgangen er en live pan/zoom-visning her på siden, ikke en samlet videofil endnu.
                </p>
              )}

              {flythroughStatus === "error" && flythroughImageUrls.length > 0 && (
                <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs mt-1" style={{ color: MUTED }}>
                  <Icon name="rotate" size={12} /> Prøv igen
                </button>
              )}
            </div>

<button onClick={() => setStep(scenes.length > 0 ? 3 : 2)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm mt-6" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> {scenes.length > 0 ? "Ret manuskript" : "Tilbage til billeder"}</button>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Rundvis />);
</script>
</body>
</html>

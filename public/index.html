      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ukendt fejl fra serveren.");
      const lines = data.lines || [];
      setScenes(images.map((img, i) => ({ imageId: img.id, text: lines[i] || "" })));
      setStep(3);
    } catch (err) {
      setGenError(`Kunne ikke generere manuskript: ${err.message}. Prøv igen, eller skriv scenerne manuelt herunder.`);
      if (scenes.length === 0) setScenes(images.map((img) => ({ imageId: img.id, text: "" })));
    } finally { setGenerating(false); }
  };

  const updateScene = (idx, text) => setScenes((prev) => { const n = [...prev]; n[idx] = { ...n[idx], text }; return n; });

  // ---- Voice generation (ElevenLabs, with per-scene browser-TTS fallback) ----
  const generateVoiceForIndex = async (idx, text) => {
    try {
      const res = await fetch("/api/generate-voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("voice-api-failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      return { status: "ready", url, mode: "audio" };
    } catch (err) {
      return { status: "ready", url: null, mode: "browser" };
    }
  };

  const prepareVoices = useCallback(async () => {
    if (!scenes.length) return;
    setVoicesPreparing(true);
    setVoiceOverallError("");
    const initial = scenes.map(() => ({ status: "loading", url: null, mode: null }));
    setVoices(initial);
    const results = new Array(scenes.length);
    const concurrency = 3;
    let cursor = 0;
    let anyAudioFailed = false;
    async function worker() {
      while (cursor < scenes.length) {
        const i = cursor++;
        const r = await generateVoiceForIndex(i, scenes[i].text);
        if (r.mode === "browser") anyAudioFailed = true;
        results[i] = r;
        setVoices((prev) => { const n = [...prev]; n[i] = r; return n; });
      }
    }
    await Promise.all(Array.from({ length: concurrency }, worker));
    if (anyAudioFailed) {
      setVoiceOverallError("Nogle scener kunne ikke få en AI-stemme (ElevenLabs) og bruger i stedet browserens indbyggede tale som reserve.");
    }
    setVoicesPreparing(false);
  }, [scenes]);

  useEffect(() => {
    if (step === 4 && scenes.length > 0 && voices.length === 0) {
      prepareVoices();
    }
  }, [step, scenes, voices.length, prepareVoices]);

  // ---- Ambient background music (Web Audio, no external file needed) ----
  const ensureAudioCtx = () => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  };
  const startMusic = () => {
    const ctx = ensureAudioCtx();
    if (!ctx || musicNodesRef.current) return;
    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.5);
    master.connect(ctx.destination);
    const freqs = [130.81, 164.81, 196.0]; // soft C major-ish pad
    const oscs = freqs.map((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.15;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(master);
      osc.start(); lfo.start();
      return { osc, lfo };
    });
    musicNodesRef.current = { master, oscs };
  };
  const stopMusic = () => {
    const nodes = musicNodesRef.current;
    const ctx = audioCtxRef.current;
    if (!nodes || !ctx) return;
    nodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    setTimeout(() => {
      nodes.oscs.forEach(({ osc, lfo }) => { try { osc.stop(); lfo.stop(); } catch (e) {} });
    }, 700);
    musicNodesRef.current = null;
  };
  useEffect(() => {
    if (isPlaying && musicOn) startMusic();
    if ((!isPlaying || !musicOn)) stopMusic();
    // eslint-disable-next-line
  }, [isPlaying, musicOn]);
  useEffect(() => () => { stopMusic(); if (audioCtxRef.current) audioCtxRef.current.close(); }, []);

  // ---- Playback engine ----
  const advanceScene = useCallback(() => {
    setCurrentIndex((i) => {
      if (i + 1 >= scenes.length) { setIsPlaying(false); return 0; }
      setPrevIndex(i);
      return i + 1;
    });
  }, [scenes.length]);

  useEffect(() => {
    if (!isPlaying) return;
    const voice = voices[currentIndex];
    if (!voice || voice.status !== "ready") return;
    sceneStartRef.current = performance.now();
    if (voice.mode === "audio" && voice.url) {
      const audio = audioRef.current;
      audio.src = voice.url;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      const onEnded = () => advanceScene();
      audio.addEventListener("ended", onEnded);
      return () => audio.removeEventListener("ended", onEnded);
    } else {
      const text = scenes[currentIndex]?.text || "";
      if (text && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const daVoice = window.speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("da"));
        if (daVoice) utter.voice = daVoice;
        utter.lang = "da-DK"; utter.rate = 0.96;
        utter.onend = () => advanceScene();
        utter.onerror = () => advanceScene();
        window.speechSynthesis.speak(utter);
        return () => window.speechSynthesis.cancel();
      } else {
        const t = setTimeout(advanceScene, FALLBACK_SCENE_MS);
        return () => clearTimeout(t);
      }
    }
    // eslint-disable-next-line
  }, [isPlaying, currentIndex, voices]);

  useEffect(() => {
    if (prevIndex === null) return;
    const t = setTimeout(() => setPrevIndex(null), 600);
    return () => clearTimeout(t);
  }, [prevIndex]);

  const getProgress = useCallback(() => {
    const voice = voices[currentIndex];
    if (voice && voice.mode === "audio" && audioRef.current && audioRef.current.duration) {
      return audioRef.current.currentTime / audioRef.current.duration;
    }
    const elapsed = performance.now() - sceneStartRef.current;
    return elapsed / FALLBACK_SCENE_MS;
  }, [voices, currentIndex]);

  const allVoicesReady = voices.length === scenes.length && voices.every((v) => v && v.status === "ready");

  // ---- AI-gennemgang: a deterministic, non-generative "3D Ken Burns" - see the depth/parallax
  // helpers near the top of this file. Every uploaded photo (up to MAX_FLYTHROUGH_IMAGES) gets a
  // real per-pixel depth map estimated entirely client-side, then a virtual camera moves through
  // the resulting 3D mesh along a fixed path. No AI video generation, no upload, no per-run cost,
  // and - critically - no risk of the camera "inventing" a wrong direction: the same photos
  // always produce the exact same depth maps and therefore the exact same moves. (The old
  // Luma-based AI clip code is still in api/generate-flythrough/ but is no longer wired in here.)
  const MAX_FLYTHROUGH_IMAGES = 8;
  // Two different sizes, for two different jobs. Depth estimation is the slow step and gains
  // nothing from a large input - a depth map is smooth by nature. The TEXTURE is what the viewer
  // actually looks at, and downscaling it to match the depth input (as this used to) threw away
  // the sharpness of the photos the agent uploaded. They are now kept apart.
  const DEPTH_INPUT_MAX = 1024;   // what the model sees
  const TEXTURE_MAX = 2560;       // what the viewer sees; enough for a 1080p export with room to push in

  // Downscale a data-URL image in the browser (canvas). Returns the original untouched when it
  // is already within bounds, so nothing is ever re-encoded for no reason.
  const resizeImageDataUrl = (dataUrl, maxDimension) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(dataUrl); return; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const c = canvas.getContext("2d");
        c.imageSmoothingEnabled = true;
        c.imageSmoothingQuality = "high";
        c.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.95));
      };
      img.onerror = () => resolve(dataUrl); // fall back to the original if decoding fails
      img.src = dataUrl;
    });

  // Estimates a depth map for every uploaded photo (in order) entirely in the browser, then
  // starts the show. Runs sequentially so the progress readout stays accurate and the model
  // (loaded once, cached in getDepthEstimator) isn't asked to do several images at once.
  const runFlythrough = async () => {
    setFlythroughStatus("processing");
    setFlythroughError("");
    setExportStatus("idle");
    setExportError("");
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    try {
      const used = images.slice(0, MAX_FLYTHROUGH_IMAGES);
      setFlythroughProgress({ current: 0, total: used.length });
      const stills = [];
      const depths = [];
      for (let i = 0; i < used.length; i++) {
        const forDepth = await resizeImageDataUrl(used[i].src, DEPTH_INPUT_MAX);
        const forTexture = await resizeImageDataUrl(used[i].src, TEXTURE_MAX);
        const depthCanvas = await estimateDepthCanvas(forDepth);
        stills.push(forTexture);
        depths.push(depthCanvas);
        setFlythroughProgress({ current: i + 1, total: used.length });
      }
      setFlythroughStills(stills);
      setFlythroughDepths(depths);
      setFlythroughStatus("done");
    } catch (err) {
      setFlythroughError(err.message || "3D-gennemgangen fejlede.");
      setFlythroughStatus("error");
    }
  };

  // Re-runs the whole thing (depth is cheap and local, so there's nothing to reuse).
  const regenerateFlythrough = () => runFlythrough();

  // The whole edit - shot design, beat-aligned durations, transitions and speed curves.
  const flythroughParams = useMemo(
    () => buildEditPlan(flythroughStills.length),
    [flythroughStills.length]
  );

  // Renders the walkthrough to a downloadable file in the requested aspect ratio. The heavy
  // work happens in exportFlythroughVideo; this only tracks progress and hands back a blob URL.
  const handleExport = async (format) => {
    if (exportStatus === "working" || flythroughStills.length === 0) return;
    setExportStatus("working");
    setExportError("");
    setExportProgress({ phase: "prepare", current: 0, total: flythroughStills.length });
    if (exportFile) { URL.revokeObjectURL(exportFile.url); setExportFile(null); }
    try {
      const blob = await exportFlythroughVideo({
        stills: flythroughStills,
        depths: flythroughDepths,
        specs: flythroughParams,
        format,
        fps: 30,
        onProgress: setExportProgress,
      });
      const ext = blob.type.indexOf("mp4") !== -1 ? "mp4" : "webm";
      setExportFile({
        url: URL.createObjectURL(blob),
        name: `rundvis-gennemgang-${format.replace(":", "x")}.${ext}`,
      });
      setExportStatus("done");
    } catch (err) {
      setExportError(err.message || "Eksporten fejlede.");
      setExportStatus("error");
    }
  };

  const togglePlay = () => {
    if (isPlaying) {
      audioRef.current && audioRef.current.pause();
      window.speechSynthesis && window.speechSynthesis.cancel();
      setIsPlaying(false);
    } else {
      if (!allVoicesReady) return;
      if (currentIndex >= scenes.length) setCurrentIndex(0);
      setIsPlaying(true);
    }
  };
  const restart = () => {
    audioRef.current && audioRef.current.pause();
    window.speechSynthesis && window.speechSynthesis.cancel();
    setPrevIndex(null);
    setCurrentIndex(0);
    setIsPlaying(true);
  };

  const canGoStep = (n) => {
    if (n === 1) return true;
    if (n === 2) return !!propertyType;
    if (n === 3) return !!propertyType && images.length >= 3;
    if (n === 4) return images.length >= 2 || (scenes.length > 0 && scenes.every((s) => s.text));
    return false;
  };
  const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label;

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: INK, color: TEXT, fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <audio ref={audioRef} className="hidden" />
      <header className="border-b px-5 py-4" style={{ borderColor: LINE }}>
        <div className="max-w-3xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="flex items-center justify-center rounded" style={{ width: 28, height: 28, backgroundColor: ACCENT }}>
              <Icon name="film" size={15} style={{ color: "#fff" }} />
            </div>
            <span className="font-display text-lg">Rundvis</span>
          </div>
          <span className="text-xs hidden sm:block" style={{ color: MUTED }}>Prototype til intern test</span>
        </div>
      </header>

      <div className="max-w-3xl mx-auto px-5 pt-5">
        <div className="flex gap-2 overflow-x-auto pb-1">
          {STEPS.map((s) => <StepPill key={s.id} step={s.id} active={step === s.id} done={step > s.id} disabled={!canGoStep(s.id)} onClick={() => setStep(s.id)} />)}
        </div>
      </div>

      <main className="max-w-3xl mx-auto px-5 py-8">
        {step === 1 && (
          <section>
            <h1 className="font-display text-2xl mb-1">Hvilken slags video?</h1>
            <p className="text-sm mb-6" style={{ color: MUTED }}>Vælger tone og tempo for manuskript og fremvisning.</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {PROPERTY_TYPES.map((t) => (
                <button key={t.id} onClick={() => setPropertyType(t.id)} className="text-left rounded-lg p-4 transition-colors"
                  style={{ backgroundColor: propertyType === t.id ? ACCENT_SOFT : SURFACE, border: `1px solid ${propertyType === t.id ? ACCENT : LINE}` }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-medium text-sm">{t.label}</span>
                    {propertyType === t.id && <Icon name="check" size={15} style={{ color: ACCENT }} />}
                  </div>
                  <span className="text-xs" style={{ color: MUTED }}>{t.hint}</span>
                </button>
              ))}
            </div>
            <button onClick={() => setStep(2)} disabled={!propertyType} className="mt-7 flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium"
              style={{ backgroundColor: propertyType ? ACCENT : SURFACE_2, color: propertyType ? "#fff" : MUTED, cursor: propertyType ? "pointer" : "not-allowed" }}>
              Fortsæt <Icon name="chevronRight" size={15} />
            </button>
          </section>
        )}

        {step === 2 && (
          <section>
            <h1 className="font-display text-2xl mb-1">Upload boligbilleder</h1>
            <p className="text-sm mb-6" style={{ color: MUTED }}>10–20 billeder giver det bedste resultat. Rækkefølgen bliver scenerækkefølgen.</p>
            <div onClick={() => fileInputRef.current?.click()} onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
              className="rounded-lg p-8 text-center cursor-pointer mb-5" style={{ border: `1.5px dashed ${LINE}`, backgroundColor: SURFACE }}>
              <Icon name="upload" size={22} style={{ color: MUTED, margin: "0 auto 10px" }} />
              <p className="text-sm">Træk billeder herind, eller <span style={{ color: ACCENT }}>vælg filer</span></p>
              <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFiles(e.target.files)} />
            </div>
            {images.length > 0 && (
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-7">
                {images.map((img, idx) => (
                  <div key={img.id} className="relative rounded-md overflow-hidden" style={{ backgroundColor: SURFACE, aspectRatio: "4/3" }}>
                    <img src={img.src} alt="" className="w-full h-full object-cover" />
                    <div className="absolute top-1 left-1 px-1.5 py-0.5 rounded text-[10px] font-medium" style={{ backgroundColor: "rgba(0,0,0,0.6)", color: "#fff" }}>{idx + 1}</div>
                    <div className="absolute top-1 right-1 flex gap-1">
                      <button onClick={() => removeImage(img.id)} className="p-1 rounded" style={{ backgroundColor: "rgba(0,0,0,0.6)" }}><Icon name="x" size={12} style={{ color: "#fff" }} /></button>
                    </div>
                    <div className="absolute bottom-1 right-1 flex gap-1">
                      <button onClick={() => moveImage(idx, -1)} disabled={idx === 0} className="p-1 rounded" style={{ backgroundColor: "rgba(0,0,0,0.6)", opacity: idx === 0 ? 0.4 : 1 }}><Icon name="arrowUp" size={12} style={{ color: "#fff" }} /></button>
                      <button onClick={() => moveImage(idx, 1)} disabled={idx === images.length - 1} className="p-1 rounded" style={{ backgroundColor: "rgba(0,0,0,0.6)", opacity: idx === images.length - 1 ? 0.4 : 1 }}><Icon name="arrowDown" size={12} style={{ color: "#fff" }} /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="flex items-center gap-3 flex-wrap">
              <button onClick={() => setStep(1)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> Tilbage</button>
              <button onClick={() => setStep(3)} disabled={images.length < 3} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium"
                style={{ backgroundColor: images.length >= 3 ? ACCENT : SURFACE_2, color: images.length >= 3 ? "#fff" : MUTED, cursor: images.length >= 3 ? "pointer" : "not-allowed" }}>
                Fortsæt <Icon name="chevronRight" size={15} />
              </button>
              {images.length > 0 && images.length < 3 && <span className="text-xs" style={{ color: MUTED }}>Mindst 3 billeder</span>}
            </div>
            {images.length >= 2 && (
              <button onClick={() => setStep(4)} className="flex items-center gap-1.5 text-xs mt-4" style={{ color: MUTED }}>
                <Icon name="sparkles" size={12} /> Eller spring manuskript over og lav en AI-gennemgang med det samme
              </button>
            )}
          </section>
        )}

        {step === 3 && (
          <section>
            <h1 className="font-display text-2xl mb-1">Manuskript</h1>
            <p className="text-sm mb-6" style={{ color: MUTED }}>Udfyld detaljer og generér forslag til voiceover — ret linjerne til bagefter.</p>
            {scenes.length === 0 && (
              <div className="space-y-3 mb-6">
                <div>
                  <label className="text-xs block mb-1" style={{ color: MUTED }}>Adresse</label>
                  <input value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Fx Strandvejen 12, 2900 Hellerup"
                    className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}`, color: TEXT }} />
                </div>
                <div>
                  <label className="text-xs block mb-1" style={{ color: MUTED }}>Mæglernavn</label>
                  <input value={agentName} onChange={(e) => setAgentName(e.target.value)} placeholder="Fx Mette Holm, Home Hellerup"
                    className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}`, color: TEXT }} />
                </div>
                <div>
                  <label className="text-xs block mb-1" style={{ color: MUTED }}>Nøgledetaljer fra salgsopstilling (valgfrit)</label>
                  <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Fx 4 værelser, sydvendt terrasse, nyt køkken 2023, gåafstand til station" rows={3}
                    className="w-full rounded-md px-3 py-2 text-sm outline-none resize-none" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}`, color: TEXT }} />
                </div>
                {genError && <p className="text-xs" style={{ color: AMBER }}>{genError}</p>}
                <button onClick={generateScript} disabled={generating} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium" style={{ backgroundColor: ACCENT, color: "#fff" }}>
                  {generating ? <><Icon name="loader" size={15} /> Genererer…</> : <><Icon name="sparkles" size={15} /> Generér manuskript</>}
                </button>
              </div>
            )}
            {scenes.length > 0 && (
              <>
                <div className="space-y-3 mb-6">
                  {scenes.map((scene, idx) => (
                    <div key={scene.imageId} className="flex gap-3 rounded-md p-2" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}` }}>
                      <img src={images.find((i) => i.id === scene.imageId)?.src} alt="" className="rounded object-cover shrink-0" style={{ width: 64, height: 64 }} />
                      <div className="flex-1">
                        <span className="text-[10px]" style={{ color: MUTED }}>Scene {idx + 1}</span>
                        <textarea value={scene.text} onChange={(e) => updateScene(idx, e.target.value)} rows={2}
                          className="w-full bg-transparent text-sm outline-none resize-none mt-0.5" style={{ color: TEXT }} />
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={() => { setScenes([]); setGenError(""); setVoices([]); }} className="flex items-center gap-1.5 text-xs mb-6" style={{ color: MUTED }}>
                  <Icon name="rotate" size={12} /> Start manuskript forfra
                </button>
              </>
            )}
            <div className="flex items-center gap-3 flex-wrap">
              <button onClick={() => setStep(2)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> Tilbage</button>
              {scenes.length > 0 && (
                <button onClick={() => setStep(4)} disabled={!scenes.every((s) => s.text)} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium"
                  style={{ backgroundColor: scenes.every((s) => s.text) ? ACCENT : SURFACE_2, color: scenes.every((s) => s.text) ? "#fff" : MUTED }}>
                  Gå til afspilning <Icon name="chevronRight" size={15} />
                </button>
              )}
            </div>
          </section>
        )}

        {step === 4 && (images.length >= 2 || scenes.length > 0) && (
          <section>
            {scenes.length > 0 && (
              <>
                <h1 className="font-display text-2xl mb-1">Afspil</h1>
                <p className="text-sm mb-5" style={{ color: MUTED }}>
                  {voicesPreparing ? "Genererer AI-stemme for hver scene…" : "Filmisk kamerabevægelse, med rigtig AI-stemme."}
                </p>
                {voiceOverallError && <p className="text-xs mb-4" style={{ color: AMBER }}>{voiceOverallError}</p>}

            <div className="relative rounded-lg overflow-hidden mb-4" style={{ backgroundColor: "#000", aspectRatio: "16/9" }}>
              {prevIndex !== null && (
                <SceneLayer
                  src={images[prevIndex]?.src}
                  active={false}
                  isPlaying={isPlaying}
                  getProgress={() => 1}
                  kbParams={kbParamsList[prevIndex] || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}
                />
              )}
              <SceneLayer
                key={currentIndex}
                src={images[currentIndex]?.src}
                active={true}
                isPlaying={isPlaying}
                getProgress={getProgress}
                kbParams={kbParamsList[currentIndex] || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}
              />
              <div className="absolute inset-0 vignette pointer-events-none" style={{ zIndex: 3 }} />
              <div className="absolute inset-x-0 bottom-0 p-4" style={{ background: "linear-gradient(to top, rgba(0,0,0,0.8), transparent)", zIndex: 4 }}>
                {(agentName || address) && (
                  <div className="flex items-center justify-between mb-2 text-[10px]" style={{ color: "rgba(255,255,255,0.7)" }}>
                    <span>{agentName}</span><span>{address}</span>
                  </div>
                )}
                <p className="text-white text-sm sm:text-base font-medium leading-snug">{scenes[currentIndex]?.text}</p>
              </div>
              <div className="absolute top-3 right-3 px-2 py-1 rounded text-[10px] font-medium flex items-center gap-1" style={{ backgroundColor: "rgba(0,0,0,0.55)", color: "#fff", zIndex: 4 }}>
                <Icon name="volume" size={11} /> {typeLabel}
              </div>
              {voicesPreparing && (
                <div className="absolute inset-0 flex items-center justify-center" style={{ backgroundColor: "rgba(0,0,0,0.45)", zIndex: 5 }}>
                  <div className="flex items-center gap-2 px-4 py-2 rounded-full text-xs" style={{ backgroundColor: "rgba(0,0,0,0.6)", color: "#fff" }}>
                    <Icon name="loader" size={14} /> Genererer stemmer ({voices.filter((v) => v && v.status === "ready").length}/{scenes.length})
                  </div>
                </div>
              )}
            </div>

            <div className="flex items-center justify-center gap-2 mb-5">
              {scenes.map((_, i) => (
                <button key={i} onClick={() => {
                    audioRef.current && audioRef.current.pause();
                    window.speechSynthesis && window.speechSynthesis.cancel();
                    setPrevIndex(currentIndex);
                    setCurrentIndex(i);
                    if (allVoicesReady) setIsPlaying(true);
                  }}
                  className="rounded-full transition-all" style={{ width: i === currentIndex ? 20 : 6, height: 6, backgroundColor: i === currentIndex ? ACCENT : LINE }} />
              ))}
            </div>

            <div className="flex items-center justify-center gap-3 mb-4">
              <button onClick={restart} disabled={!allVoicesReady} className="p-3 rounded-full" style={{ border: `1px solid ${LINE}`, color: MUTED, opacity: allVoicesReady ? 1 : 0.5 }}><Icon name="rotate" size={16} /></button>
              <button onClick={togglePlay} disabled={!allVoicesReady} className="p-4 rounded-full" style={{ backgroundColor: ACCENT, color: "#fff", opacity: allVoicesReady ? 1 : 0.5 }}>
                {voicesPreparing ? <Icon name="loader" size={20} /> : <Icon name={isPlaying ? "pause" : "play"} size={20} />}
              </button>
              <button title="Kræver tilkobling af en AI-videomodel i produktionsversionen" className="px-4 py-3 rounded-full text-xs" style={{ border: `1px solid ${LINE}`, color: MUTED, cursor: "default" }}>Eksportér (kommer snart)</button>
            </div>

            <label className="flex items-center justify-center gap-2 text-xs mb-8 cursor-pointer" style={{ color: MUTED }}>
              <input type="checkbox" checked={musicOn} onChange={(e) => setMusicOn(e.target.checked)} />
              <Icon name="music" size={13} /> Blød baggrundsmusik
            </label>
              </>
            )}

            <div className={scenes.length > 0 ? "pt-6 mt-2 border-t" : ""} style={{ borderColor: LINE }}>
              {scenes.length === 0 && <h1 className="font-display text-2xl mb-1">AI-gennemgang</h1>}
              {scenes.length > 0 && <h2 className="font-display text-lg mb-1">AI-gennemgang <span className="text-xs font-normal" style={{ color: MUTED }}>(eksperimentel)</span></h2>}
              <p className="text-xs mb-1" style={{ color: MUTED }}>
                Laver en filmisk gennemgang af op til {MAX_FLYTHROUGH_IMAGES} af dine billeder, hvor kameraet både bevæger sig og drejer i ægte 3D — beregnet ud fra et dybdekort af hvert billede, så forgrund og baggrund forskyder sig i forhold til hinanden, ligesom et kamera der faktisk panorerer rundt i rummet. Bagefter kan du hente resultatet som videofil i tre formater.
              </p>
              <p className="text-xs mb-1" style={{ color: MUTED }}>
                Ingen AI-videogenerering er involveret — dybden beregnes lokalt i din browser med nøjagtig samme resultat hver gang, så der er ingen risiko for at kameraet "opfinder" en forkert bevægelse. Upload i den rækkefølge man skal bevæge sig igennem: facade/udefra først, så indgang, så rum for rum.
              </p>
              {images.length >= 1 && flythroughStatus === "idle" && (
                <p className="text-xs mb-4" style={{ color: MUTED }}>
                  Beregner en 3D-kamerabevægelse for hvert af de {Math.min(images.length, MAX_FLYTHROUGH_IMAGES)} billeder du har uploadet indtil videre — tager typisk nogle få sekunder pr. billede, direkte i browseren.
                </p>
              )}

              {flythroughStatus === "idle" && (
                <button onClick={() => runFlythrough()} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium" style={{ backgroundColor: ACCENT, color: "#fff" }}>
                  <Icon name="sparkles" size={15} /> Generér AI-gennemgang
                </button>
              )}

              {flythroughStatus === "processing" && (
                <div className="flex items-center gap-2 text-sm mb-4" style={{ color: MUTED }}>
                  <Icon name="loader" size={15} /> Beregner 3D-dybde for billede {flythroughProgress.current} af {flythroughProgress.total}…
                </div>
              )}

              {flythroughStatus === "error" && <p className="text-xs" style={{ color: AMBER }}>{flythroughError}</p>}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div className="mb-3 flex flex-wrap items-center gap-2">
                  {Object.keys(EXPORT_FORMATS).map((f) => {
                    const on = previewFormat === f;
                    return (
                      <button
                        key={f}
                        onClick={() => setPreviewFormat(f)}
                        className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap transition-colors"
                        style={{
                          border: `1px solid ${on ? ACCENT : LINE}`,
                          backgroundColor: on ? ACCENT : "transparent",
                          color: on ? "#fff" : MUTED,
                        }}
                      >
                        {EXPORT_FORMATS[f].label} <span style={{ opacity: 0.75 }}>{f}</span>
                      </button>
                    );
                  })}
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div
                  className="relative rounded-xl overflow-hidden mb-3 w-full"
                  style={{
                    backgroundColor: "#000",
                    aspectRatio: previewFormat.replace(":", "/"),
                    maxWidth: previewFormat === "9:16" ? 460 : "100%",
                    boxShadow: "0 18px 50px rgba(0,0,0,0.45)",
                  }}
                >
                  <FlythroughStage
                    key={previewFormat}
                    stills={flythroughStills}
                    depths={flythroughDepths}
                    specs={flythroughParams}
                    onError={(m) => { setFlythroughError(m); setFlythroughStatus("error"); }}
                  />
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div className="flex items-center gap-4 mb-4">
                  <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs" style={{ color: MUTED }}>
                    <Icon name="rotate" size={12} /> Generér forfra
                  </button>
                  <span className="text-[10px]" style={{ color: MUTED }}>
                    {EXPORT_FORMATS[previewFormat].where}
                  </span>
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div className="mb-4">
                  <p className="text-xs mb-2" style={{ color: TEXT }}>Hent som videofil</p>
                  <div className="flex flex-wrap gap-2 mb-2">
                    {Object.keys(EXPORT_FORMATS).map((f) => (
                      <button
                        key={f}
                        onClick={() => handleExport(f)}
                        disabled={exportStatus === "working"}
                        className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap"
                        style={{
                          border: `1px solid ${LINE}`,
                          backgroundColor: SURFACE_2,
                          color: TEXT,
                          opacity: exportStatus === "working" ? 0.5 : 1,
                          cursor: exportStatus === "working" ? "not-allowed" : "pointer",
                        }}
                      >
                        {EXPORT_FORMATS[f].label}{" "}
                        <span style={{ color: MUTED }}>{EXPORT_FORMATS[f].w}×{EXPORT_FORMATS[f].h}</span>
                      </button>
                    ))}
                  </div>

                  {exportStatus === "working" && (
                    <div className="flex items-center gap-2 text-xs" style={{ color: MUTED }}>
                      <Icon name="loader" size={13} />
                      {exportProgress.phase === "prepare"
                        ? `Forbereder billede ${exportProgress.current} af ${exportProgress.total}…`
                        : `Optager video ${Math.round((exportProgress.current / Math.max(1, exportProgress.total)) * 100)}%…`}
                    </div>
                  )}

                  {exportStatus === "working" && (
                    <p className="text-[10px] mt-1" style={{ color: AMBER }}>
                      Optagelsen kører i realtid og tager omtrent lige så lang tid som videoen varer. <strong>Bliv på denne fane imens</strong> — browseren pauser optagelsen i en baggrundsfane, og så bliver filen tom.
                    </p>
                  )}

                  {exportStatus === "error" && <p className="text-xs" style={{ color: AMBER }}>{exportError}</p>}

                  {exportStatus === "done" && exportFile && (
                    <div>
                      <a href={exportFile.url} download={exportFile.name} className="inline-flex items-center gap-1.5 text-xs" style={{ color: ACCENT }}>
                        <Icon name="arrowDown" size={13} /> Hent {exportFile.name}
                      </a>
                      {exportFile.name.endsWith(".webm") && (
                        <p className="text-[10px] mt-1" style={{ color: MUTED }}>
                          Din browser optager i WebM. Instagram og TikTok foretrækker MP4 — åbn siden i Safari 17+ for at få en MP4 direkte, eller konvertér filen.
                        </p>
                      )}
                    </div>
                  )}
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <p className="text-[10px] mb-4" style={{ color: MUTED }}>
                  Ægte 3D-kamerabevægelse beregnet direkte i din browser ud fra dine billeder — ingen AI-videogenerering, så resultatet er identisk hver gang, og der er ingen omkostning pr. video.
                </p>
              )}

              {flythroughStatus === "error" && flythroughStills.length === 0 && (
                <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs mt-1" style={{ color: MUTED }}>
                  <Icon name="rotate" size={12} /> Prøv igen
                </button>
              )}
            </div>

<button onClick={() => setStep(scenes.length > 0 ? 3 : 2)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm mt-6" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> {scenes.length > 0 ? "Ret manuskript" : "Tilbage til billeder"}</button>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Rundvis />);
</script>
</body>
</html>

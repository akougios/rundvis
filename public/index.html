  // minutes a clip usually takes, and stops at 92% so it never sits full while still working.
  const hqRoomFill = (i) => {
    const st = hqRoom[i];
    if (st === "klar") return 1;
    if (st === "fejl") return 1;
    if (st !== "igang") return 0;
    const t0 = hqStartedRef.current[i];
    if (!t0) return 0.02;
    return Math.max(0.02, Math.min(0.92, (performance.now() - t0) / 1000 / HQ_SECONDS_PER_CLIP));
  };

  // Same bar for the Veo run. A Veo clip takes longer than a Luma one, so it fills more slowly;
  // the point of the number is only that something is always moving.
  const veoRoomFill = (i) => {
    const st = veoRoom[i];
    if (st === "klar" || st === "fejl") return 1;
    if (st !== "igang") return 0;
    const t0 = veoStartedRef.current[i];
    if (!t0) return 0.02;
    return Math.max(0.02, Math.min(0.92, (performance.now() - t0) / 1000 / VEO_SECONDS_PER_CLIP));
  };

  const hqMissing = flythroughStills.filter((_, i) => !(hqClips && hqClips[i])).length;
  const veoMissing = flythroughStills.filter((_, i) => !(veoClips && veoClips[i])).length;

  // Time and money for a given number of clips, so neither is a surprise after the click.
  const hqEstimate = (n) => ({
    usd: (QUALITIES[hqQuality].usd * n).toFixed(2),
    min: Math.max(2, Math.ceil((Math.ceil(n / HQ_CONCURRENCY) * HQ_SECONDS_PER_CLIP) / 60)),
  });

  const swap = (arr, a, b) => { const n = [...arr]; [n[a], n[b]] = [n[b], n[a]]; return n; };
  const lift = (arr, from, to) => {
    const n = [...arr];
    const [x] = n.splice(from, 1);
    n.splice(to, 0, x);
    return n;
  };
  const reorderShot = (from, to) => {
    if (from === to || from < 0 || to < 0) return;
    if (from >= flythroughStills.length || to >= flythroughStills.length) return;
    setFlythroughStills((prev) => lift(prev, from, to));
    setHqClips((prev) => (prev ? lift(prev, from, to) : prev));
    setHqMotion((prev) => (prev ? lift(prev, from, to) : prev));
    setImages((prev) => (from < prev.length && to < prev.length ? lift(prev, from, to) : prev));
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    setExportStatus("idle");
  };

  // Which thumbnail sits under the pointer. Reads the live layout rather than doing arithmetic on
  // widths, so it stays right whatever the strip is scrolled to or wrapped at.
  const shotIndexAt = (x, y) => {
    const el = stripRef.current;
    if (!el) return null;
    const kids = el.querySelectorAll("[data-shot]");
    for (let i = 0; i < kids.length; i++) {
      const r = kids[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top - 40 && y <= r.bottom + 40) return i;
    }
    return null;
  };

  const moveShot = (idx, dir) => {
    const target = idx + dir;
    if (target < 0 || target >= flythroughStills.length) return;
    setFlythroughStills((prev) => swap(prev, idx, target));
    setHqClips((prev) => (prev ? swap(prev, idx, target) : prev));
    setHqMotion((prev) => (prev ? swap(prev, idx, target) : prev));
    setImages((prev) => (target < prev.length ? swap(prev, idx, target) : prev));
    // The finished file no longer matches what is on screen.
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    setExportStatus("idle");
  };

  // Same reasoning for removing a shot: drop the photo and its clip together.
  const removeShot = (idx) => {
    if (flythroughStills.length <= 3) return; // three is the minimum a walkthrough is built from
    const drop = (arr) => arr.filter((_, i) => i !== idx);
    setFlythroughStills(drop);
    setHqClips((prev) => (prev ? drop(prev) : prev));
    // hqMotion is per clip and indexed alongside it. Left in place it stayed one step out of
    // alignment after a removal, so every later room was cut to a different room's measurement.
    setHqMotion((prev) => (prev ? drop(prev) : prev));
    setImages((prev) => (idx < prev.length ? drop(prev) : prev));
    // The selection is an index, so it has to be pulled back inside the new length.
    setCompareIndex((prev) => Math.max(0, Math.min(prev, flythroughStills.length - 2)));
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    setExportStatus("idle");
  };

  const generateScript = async () => {
    setGenerating(true); setGenError("");
    try {
      const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label || "bolig";
      const response = await fetch("/api/generate-script", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ propertyTypeLabel: typeLabel, address, agentName, notes, sceneCount: images.length }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ukendt fejl fra serveren.");
      const lines = data.lines || [];
      setScenes(images.map((img, i) => ({ imageId: img.id, text: lines[i] || "" })));
      setStep(3);
    } catch (err) {
      setGenError(`Kunne ikke generere manuskript: ${err.message}. Prøv igen, eller skriv scenerne manuelt herunder.`);
      if (scenes.length === 0) setScenes(images.map((img) => ({ imageId: img.id, text: "" })));
    } finally { setGenerating(false); }
  };

  const updateScene = (idx, text) => setScenes((prev) => { const n = [...prev]; n[idx] = { ...n[idx], text }; return n; });

  // ---- Voice generation (ElevenLabs, with per-scene browser-TTS fallback) ----
  const generateVoiceForIndex = async (idx, text) => {
    try {
      const res = await fetch("/api/generate-voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("voice-api-failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      return { status: "ready", url, mode: "audio" };
    } catch (err) {
      return { status: "ready", url: null, mode: "browser" };
    }
  };

  const prepareVoices = useCallback(async () => {
    if (!scenes.length) return;
    setVoicesPreparing(true);
    setVoiceOverallError("");
    const initial = scenes.map(() => ({ status: "loading", url: null, mode: null }));
    setVoices(initial);
    const results = new Array(scenes.length);
    const concurrency = 3;
    let cursor = 0;
    let anyAudioFailed = false;
    async function worker() {
      while (cursor < scenes.length) {
        const i = cursor++;
        const r = await generateVoiceForIndex(i, scenes[i].text);
        if (r.mode === "browser") anyAudioFailed = true;
        results[i] = r;
        setVoices((prev) => { const n = [...prev]; n[i] = r; return n; });
      }
    }
    await Promise.all(Array.from({ length: concurrency }, worker));
    if (anyAudioFailed) {
      setVoiceOverallError("Nogle scener kunne ikke få en AI-stemme (ElevenLabs) og bruger i stedet browserens indbyggede tale som reserve.");
    }
    setVoicesPreparing(false);
  }, [scenes]);

  useEffect(() => {
    if (step === 4 && scenes.length > 0 && voices.length === 0) {
      prepareVoices();
    }
  }, [step, scenes, voices.length, prepareVoices]);

  // ---- Ambient background music (Web Audio, no external file needed) ----
  const ensureAudioCtx = () => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  };
  const startMusic = () => {
    const ctx = ensureAudioCtx();
    if (!ctx || musicNodesRef.current) return;
    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.5);
    master.connect(ctx.destination);
    const freqs = [130.81, 164.81, 196.0]; // soft C major-ish pad
    const oscs = freqs.map((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.15;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(master);
      osc.start(); lfo.start();
      return { osc, lfo };
    });
    musicNodesRef.current = { master, oscs };
  };
  const stopMusic = () => {
    const nodes = musicNodesRef.current;
    const ctx = audioCtxRef.current;
    if (!nodes || !ctx) return;
    nodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    setTimeout(() => {
      nodes.oscs.forEach(({ osc, lfo }) => { try { osc.stop(); lfo.stop(); } catch (e) {} });
    }, 700);
    musicNodesRef.current = null;
  };
  useEffect(() => {
    if (isPlaying && musicOn) startMusic();
    if ((!isPlaying || !musicOn)) stopMusic();
    // eslint-disable-next-line
  }, [isPlaying, musicOn]);
  useEffect(() => () => { stopMusic(); if (audioCtxRef.current) audioCtxRef.current.close(); }, []);

  // ---- Playback engine ----
  const advanceScene = useCallback(() => {
    setCurrentIndex((i) => {
      if (i + 1 >= scenes.length) { setIsPlaying(false); return 0; }
      setPrevIndex(i);
      return i + 1;
    });
  }, [scenes.length]);

  useEffect(() => {
    if (!isPlaying) return;
    const voice = voices[currentIndex];
    if (!voice || voice.status !== "ready") return;
    sceneStartRef.current = performance.now();
    if (voice.mode === "audio" && voice.url) {
      const audio = audioRef.current;
      audio.src = voice.url;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      const onEnded = () => advanceScene();
      audio.addEventListener("ended", onEnded);
      return () => audio.removeEventListener("ended", onEnded);
    } else {
      const text = scenes[currentIndex]?.text || "";
      if (text && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const daVoice = window.speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("da"));
        if (daVoice) utter.voice = daVoice;
        utter.lang = "da-DK"; utter.rate = 0.96;
        utter.onend = () => advanceScene();
        utter.onerror = () => advanceScene();
        window.speechSynthesis.speak(utter);
        return () => window.speechSynthesis.cancel();
      } else {
        const t = setTimeout(advanceScene, FALLBACK_SCENE_MS);
        return () => clearTimeout(t);
      }
    }
    // eslint-disable-next-line
  }, [isPlaying, currentIndex, voices]);

  useEffect(() => {
    if (prevIndex === null) return;
    const t = setTimeout(() => setPrevIndex(null), 600);
    return () => clearTimeout(t);
  }, [prevIndex]);

  const getProgress = useCallback(() => {
    const voice = voices[currentIndex];
    if (voice && voice.mode === "audio" && audioRef.current && audioRef.current.duration) {
      return audioRef.current.currentTime / audioRef.current.duration;
    }
    const elapsed = performance.now() - sceneStartRef.current;
    return elapsed / FALLBACK_SCENE_MS;
  }, [voices, currentIndex]);

  const allVoicesReady = voices.length === scenes.length && voices.every((v) => v && v.status === "ready");

  // ---- Walkthrough: deterministic 2D camera motion - see the motion helpers
  // helpers near the top of this file. Every uploaded photo gets a
  // real per-pixel depth map estimated entirely client-side, then a virtual camera moves through
  // the resulting 3D mesh along a fixed path. No AI video generation, no upload, no per-run cost,
  // and - critically - no risk of the camera "inventing" a wrong direction: the same photos
  // always produce the exact same depth maps and therefore the exact same moves. (The old
  // Luma-based AI clip code is still in api/generate-flythrough/ but is no longer wired in here.)
  // 20, not 8. A real listing video runs 40-50 seconds, and at this edit's pace that is 16-20
  // shots - the reference film the agent supplied had 14 clips across 40.7s. Eight photos made
  // a 20-second video, which is short for a property.

  // How many clips are generated at once. One clip takes the model about three minutes whatever
  // we do, so wall-clock time is purely a question of how many run in parallel: at three, 18
  // photos is ~18 minutes, at six it is ~9. Six is not reckless because create.js treats a 429
  // as normal and waits it out - submitting more than the account allows degrades into queueing
  // rather than failing, which is the behaviour we want.
  const HQ_CONCURRENCY = 6;
  // Rough seconds per clip, for the estimates shown before the agent commits to paying.
  const HQ_SECONDS_PER_CLIP = 180;

  // TEMPORARY - the Luma/Veo bake-off. Both models are run over the whole property so the two
  // films can be watched end to end and one of them chosen; once that choice is made, this and
  // everything else marked BAKE-OFF comes out and the loser goes with it.
  //
  // Two at a time, not six. Veo's per-minute limit on a new paid project is far tighter than
  // Luma's, and a 429 here costs a round trip on a request that carries the whole photograph.
  const VEO_CONCURRENCY = 2;
  const VEO_SECONDS_PER_CLIP = 150;
  const VEO_USD_PER_CLIP = 1.60;   // 8s at $0.20/s - see VEO_MODES in api/_veo.js
  // Photos are kept at up to this size. A 1920-wide export at the tightest 10% crop samples at
  // most ~2130 source pixels across, so 2560 leaves headroom while keeping several photos in
  // memory comfortably. Anything smaller is left exactly as uploaded and never re-encoded.
  const SOURCE_MAX = 2560;

  // Downscale a data-URL image in the browser (canvas). Returns the original untouched when it
  // is already within bounds, so nothing is ever re-encoded for no reason.
  const resizeImageDataUrl = (dataUrl, maxDimension) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(dataUrl); return; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const c = canvas.getContext("2d");
        c.imageSmoothingEnabled = true;
        c.imageSmoothingQuality = "high";
        c.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.95));
      };
      img.onerror = () => resolve(dataUrl); // fall back to the original if decoding fails
      img.src = dataUrl;
    });

  // Veo renders to a fixed 16:9 or 9:16 and PADS anything that does not match, so a 4:3 listing
  // photo comes back with black bars baked into the MP4. Our compositor crops to fill rather than
  // letterboxing, so it cannot undo them - it just shows them. Cropping the photo to the exact
  // output aspect before it goes means Veo never has to pad. It is also the fairer comparison:
  // Veo is handed the same framing the edit would have shown anyway.
  const cropImageDataUrl = (dataUrl, outAspect, maxDimension) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const base = coverRect(img.width, img.height, outAspect);
        const scale = Math.min(1, maxDimension / Math.max(base.w, base.h));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(2, Math.round(base.w * scale));
        canvas.height = Math.max(2, Math.round(base.h * scale));
        const c = canvas.getContext("2d");
        c.imageSmoothingEnabled = true;
        c.imageSmoothingQuality = "high";
        c.drawImage(
          img,
          (img.width - base.w) / 2, (img.height - base.h) / 2, base.w, base.h,
          0, 0, canvas.width, canvas.height,
        );
        resolve(canvas.toDataURL("image/jpeg", 0.95));
      };
      img.onerror = () => resolve(dataUrl); // fall back to the original if decoding fails
      img.src = dataUrl;
    });

  // Prepares the photos for playback. There is no model to download and no inference to wait
  // for any more - only a resize where a photo is larger than the plates will ever need - so
  // this finishes in well under a second instead of the forty it used to take.
  const runFlythrough = async () => {
    setFlythroughStatus("processing");
    setFlythroughError("");
    setExportStatus("idle");
    setExportError("");
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    setHqClips(null);
    setHqStatus("idle");
    setHqError("");
    try {
      // No cap. There used to be one at 20, which silently DROPPED every photo past it - a
      // property with 28 rooms quietly became a film of the first 20, with nothing on screen to
      // say so. The real constraint is memory at export time, where every photo is held as a
      // prescaled plate at output size; that is worth fixing properly if it ever bites, not
      // worth hiding behind a number that throws work away without telling anyone.
      const used = images;
      setFlythroughProgress({ current: 0, total: used.length });
      const stills = [];
      for (let i = 0; i < used.length; i++) {
        stills.push(await resizeImageDataUrl(used[i].src, SOURCE_MAX));
        setFlythroughProgress({ current: i + 1, total: used.length });
      }
      setFlythroughStills(stills);
      setFlythroughStatus("done");
    } catch (err) {
      setFlythroughError(err.message || "Gennemgangen fejlede.");
      setFlythroughStatus("error");
    }
  };

  const regenerateFlythrough = () => runFlythrough();

  // Decodes an uploaded track once. Keeping the raw bytes too, because an AudioBuffer cannot be
  // handed to a second AudioContext and the export makes its own.
  const handleMusicFile = async (file) => {
    if (!file) return;
    setMusicError("");
    try {
      const bytes = await file.arrayBuffer();
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) throw new Error("Din browser understøtter ikke lydafspilning.");
      const ctx = new Ctx();
      // decodeAudioData consumes the buffer it is given, so it gets a copy.
      const buf = await ctx.decodeAudioData(bytes.slice(0));
      ctx.close();
      musicRawRef.current = bytes;
      musicBufferRef.current = buf;
      setMusicName(`${file.name} · ${Math.round(buf.duration)} sek.`);
      if (previewAudioRef.current) {
        URL.revokeObjectURL(previewAudioRef.current.src);
        previewAudioRef.current.src = URL.createObjectURL(file);
      } else {
        const a = new Audio(URL.createObjectURL(file));
        a.loop = true;
        previewAudioRef.current = a;
      }
    } catch (err) {
      setMusicError("Kunne ikke læse lydfilen. Prøv en MP3, M4A eller WAV.");
      musicBufferRef.current = null;
      musicRawRef.current = null;
      setMusicName("");
    }
  };

  // The preview track follows the page: it plays while the walkthrough is on screen and stops
  // when it is not, so music never keeps running behind a different step.
  useEffect(() => {
    const a = previewAudioRef.current;
    if (!a) return;
    const spiller = step === 2 && musicOnPreview && flythroughStatus === "done";
    if (spiller) { a.currentTime = 0; a.play().catch(() => {}); } else { a.pause(); }
    return () => { a.pause(); };
  }, [step, musicOnPreview, flythroughStatus, musicName]);

  // ---- Model bake-off ----
  // Sends ONE photo to every model at once and shows the results side by side. Run in parallel
  // because the jobs are independent: three models finish in about the time one takes, instead
  // of three times as long.
  //
  // The photo is uploaded ONCE and the same URL handed to all three, so the comparison is of the
  // models and nothing else.

  // The whole edit - shot design, beat-aligned durations, transitions and speed curves.
  //
  // Built twice, on purpose. The played edit knows which rooms have a generated clip, because
  // those shots hold longer. The plan the ROOM CHOICE is made from does not: letting the choice
  // see the clips would feed it its own output - lengthening a shot would change which shots look
  // worth upgrading next, and the "selected rooms" list would reshuffle under the agent between
  // one click and the next.
  const basePlan = useMemo(() => buildEditPlan(flythroughStills.length), [flythroughStills.length]);
  const motionSignature = (hqMotion || [])
    .map((m) => (m ? `${m.start.toFixed(2)},${m.moving.toFixed(2)}` : "-"))
    .join("|");
  const flythroughParams = useMemo(
    () => buildEditPlan(flythroughStills.length, (i) => (hqMotion && hqMotion[i]) || null),
    [flythroughStills.length, motionSignature]
  );

  // The scrubber is moved by writing to the element directly. Driving it from state would
  // re-render the whole page - thumbnails and all - on every frame, to move one bar.
  const showTotalMs = flythroughParams.reduce((a, sp) => a + sp.durationMs, 0);
  useEffect(() => {
    if (flythroughStatus !== "done" || !showTotalMs) return;
    let raf = 0;
    const step = () => {
      raf = requestAnimationFrame(step);
      const el = scrubRef.current;
      if (!el) return;
      const t = ((filmNow() % showTotalMs) + showTotalMs) % showTotalMs;
      el.style.width = `${(t / showTotalMs) * 100}%`;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [flythroughStatus, showTotalMs]);

  const scrubTo = (clientX) => {
    const bar = scrubBarRef.current;
    if (!bar || !showTotalMs) return;
    const r = bar.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (clientX - r.left) / Math.max(1, r.width)));
    setClock({ baseMs: f * showTotalMs });
  };

  // Measure each clip once, as it arrives. The edit then fits itself to the result: a clip that
  // travels for the whole five seconds earns a longer shot, one that comes to rest early gets a
  // shorter one, and one that never really moves is dropped in favour of the free 2D move.
  //
  // Done here rather than inside the player so that measuring cannot feed back into the player's
  // own loading: the clip is fetched, measured, and released again before the edit changes.
  useEffect(() => {
    if (!hqClips) return;
    let cancelled = false;
    const found = new Array(hqClips.length).fill(null);
    (async () => {
      for (let i = 0; i < hqClips.length; i++) {
        if (cancelled) return;
        if (!hqClips[i]) continue;
        if (hqMotion && hqMotion[i]) continue;
        let v = null;
        try {
          v = await loadClipVideo(hqClips[i]);
          const m = await measureClipMotion(v);
          if (cancelled) return;
          // A clip that cannot be measured is left unmeasured on purpose: it then keeps its arc
          // length and plays from the start, which is what the edit did before any of this.
          if (m) found[i] = m;
        } catch (e) {
          /* leave unmeasured */
        } finally {
          if (v) releaseShot({ video: v });
        }
      }
      // Published in ONE go at the end. Setting each measurement as it arrived changed the edit
      // seven times over, and because the player rebuilds when the shot lengths change, that
      // restarted playback from the top on every one of them.
      if (cancelled || !found.some(Boolean)) return;
      setHqMotion((prev) => {
        const next = prev ? [...prev] : [];
        while (next.length < hqClips.length) next.push(null);
        found.forEach((m, i) => { if (m) next[i] = m; });
        return next;
      });
    })();
    return () => { cancelled = true; };
  }, [hqClips]);

  // WHICH ROOMS TO PAY FOR, when upgrading a selection rather than all of them.
  //
  // WHY NOT ALL. Every clip is three minutes of waiting and about a krone, so 18 photos is 9
  // minutes and $17 even six-at-a-time. Most shots are on screen for under two seconds, and at
  // that length a generated camera move and the 2D move are not tellable apart.
  //
  // HOW THEY ARE CHOSEN, and an honest note on it. The theory was that spreading clips evenly by
  // position wasted money, because the tempo arc makes the middle shots the shortest. Measured,
  // that turned out to be worth almost nothing: for 18 photos both rules put the six clips under
  // 39% of the running time, because an even spread already catches the long opening and closing
  // shots. This rule is kept because picking the longest shot within each stretch is never worse
  // and avoids the odd case where an evenly-spaced index lands on the briefest shot around it -
  // but it is a refinement, not the fix. The real waste is that a clip is five seconds and most
  // shots are under three; closing that means shorter generations or longer holds on the shots
  // that carry one.
  //
  // The film is split into as many segments as there are clips to spend, and the longest-held
  // shot in each segment gets one. Ranking purely by length was tried first and bunched the
  // clips at the two ends, because the tempo arc makes the end shots the longest - it left the
  // middle third of a 42-second film with no generated motion at all. Segmenting spreads them
  // across the running time and still picks the shot in each stretch that is on screen longest.
  const HQ_HIGHLIGHTS = 12;
  // Unused while the BAKE-OFF is up: both test buttons run every room, because comparing two
  // models on a subset of the property tells you nothing. Kept, not deleted - the single
  // "Opgrader video" button that picks only the highlights comes back with the decision.
  const hqHighlightIndexes = useMemo(() => {
    const total = basePlan.length;
    if (total === 0) return [];
    const free = (i) => !(hqClips && hqClips[i]);
    if (total <= HQ_HIGHLIGHTS) return basePlan.map((_, i) => i).filter(free);

    const out = [];
    for (let seg = 0; seg < HQ_HIGHLIGHTS; seg++) {
      const from = Math.floor((seg * total) / HQ_HIGHLIGHTS);
      const to = Math.floor(((seg + 1) * total) / HQ_HIGHLIGHTS);
      let best = -1;
      for (let i = from; i < to; i++) {
        if (!free(i)) continue;
        if (best === -1 || basePlan[i].durationMs > basePlan[best].durationMs) best = i;
      }
      if (best !== -1) out.push(best);
    }
    return out;
  }, [basePlan, hqClips]);

  // ---- High-quality pass ----
  // Sends every photo to the video model and collects the finished clips. Sequential on purpose:
  // it keeps the progress readout honest, and it means a failure part-way through has cost the
  // price of the clips actually produced rather than all of them at once.
  // Generates clips for a set of photo indexes. Passing a single index is how the "test one
  // photo" button works: comparing three models then costs about a krone each instead of the
  // price of three whole properties.
  // One room, through Veo, so the two models can be judged on the same photograph with the same
  // words. Four seconds rather than Luma's fixed five: our longest shot holds for 4.66s, so eight
  // would be paying for footage nobody sees.
  // WHICH CLIPS THE PLAYER GETS.
  //
  // Veo is tested on a single room. Handing the player veoClips on its own put a clip in that one
  // room and null in every other, so the rest of the film dropped back to stills - which reads as
  // "the AI stopped working", not as a comparison. The test clip is laid OVER the paid set
  // instead, so exactly one room differs between the two tabs and everything else is held still
  // for the eye.
  //
  // "basic" hands over nothing at all, which is the free Ken Burns version - the same film an
  // agent sees before paying, and the only honest thing to compare the upgrade against.
  const shownClips = useMemo(() => {
    if (showSource === "basic") return null;
    if (showSource !== "veo" || !veoClips) return hqClips;
    const merged = hqClips ? hqClips.slice() : [];
    while (merged.length < veoClips.length) merged.push(null);
    veoClips.forEach((clip, i) => { if (clip) merged[i] = clip; });
    return merged;
  }, [showSource, hqClips, veoClips]);

  // The tabs to offer. Only ever the versions that exist: no empty tab for an upgrade nobody has
  // bought, and no Veo tab until a test clip has actually come back.
  const sourceTabs = useMemo(() => {
    const hasUpgrade = hqClips && hqClips.some(Boolean);
    const hasVeo = veoClips && veoClips.some(Boolean);
    const tabs = [];
    // Basis is offered the moment there is anything to hold it up against - including a Veo test
    // run on its own, which is a thing you can do without buying the upgrade first.
    if (hasUpgrade || hasVeo) tabs.push(["basic", "Basis"]);
    if (hasUpgrade) tabs.push(["luma", "Luma"]);
    if (hasVeo) tabs.push(["veo", "Veo"]);
    return tabs;
  }, [hqClips, veoClips]);

  // BAKE-OFF. Veo across the whole property, so the two films can be compared end to end
  // instead of one room at a time. Deliberately mirrors runHighQuality - same worker pool, same
  // per-room states, same rule that a clip already produced is already paid for and is never
  // generated twice - so the only difference between the two runs is the model.
  const runVeo = async () => {
    if (veoStatus === "working" || flythroughStills.length === 0) return;
    const clips = veoClips ? veoClips.slice() : new Array(flythroughStills.length).fill(null);
    while (clips.length < flythroughStills.length) clips.push(null);
    const indexes = flythroughStills.map((_, i) => i).filter((i) => !clips[i]);
    if (indexes.length === 0) { setShowSource("veo"); return; }

    setVeoStatus("working");
    setVeoError("");
    const startedAt = {};
    veoStartedRef.current = startedAt;
    setVeoRoom(indexes.reduce((acc, i) => { acc[i] = "venter"; return acc; }, {}));

    const lavKlip = async (i) => {
      // Cropped to the shape Veo will render, so it never pads the photo and bakes black bars
      // into the clip. See cropImageDataUrl.
      const veoAspect = previewFormat === "9:16" ? 9 / 16 : 16 / 9;
      const small = await cropImageDataUrl(flythroughStills[i], veoAspect, 1280);
      const comma = small.indexOf(",");
      const mimeType = small.slice(5, small.indexOf(";")) || "image/jpeg";
      const imageBase64 = small.slice(comma + 1);

      const payload = JSON.stringify({
        imageBase64,
        mimeType,
        motion: flythroughParams[i] ? flythroughParams[i].type : "push",
        dir: flythroughParams[i] ? flythroughParams[i].dirSign : 1,
        aspectRatio: previewFormat,
        resolution: "1080p",
      });

      // A 429 means wait, not fail - same as Luma. Veo's limits on a new paid project are tight
      // enough that two jobs in flight can still trip them.
      let started;
      for (let forsoeg = 0; ; forsoeg++) {
        const create = await fetch("/api/generate-veo/create", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: payload,
        });
        started = await create.json();
        if (create.ok) break;
        if (!started.retryable || forsoeg >= 20) {
          throw new Error(started.error || "Kunne ikke starte Veo-klippet.");
        }
        await new Promise((r) => setTimeout(r, Math.min(8000 + forsoeg * 4000, 30000)));
      }

      for (let attempt = 0; attempt < 120; attempt++) {
        await new Promise((r) => setTimeout(r, 5000));
        const st = await fetch("/api/generate-veo/status", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: started.name }),
        });
        const stJson = await st.json();
        if (!st.ok) throw new Error(stJson.error || "Kunne ikke hente status.");
        if (!stJson.done) continue;
        if (stJson.error) throw new Error(stJson.error);
        return { url: stJson.videoUrl, sig: stJson.sig };
      }
      throw new Error(`Veo-klip ${i + 1} blev ikke færdigt i tide.`);
    };

    const koe = indexes.slice();
    const fejl = [];
    const arbejder = async () => {
      while (koe.length) {
        const i = koe.shift();
        startedAt[i] = performance.now();
        setVeoRoom((prev) => ({ ...prev, [i]: "igang" }));
        try {
          clips[i] = await lavKlip(i);
          setVeoRoom((prev) => ({ ...prev, [i]: "klar" }));
          // Published as they land, so the Veo tab fills in while you watch.
          setVeoClips(clips.slice());
          setShowSource("veo");
        } catch (err) {
          // One room failing must not throw away the rooms that succeeded - at $1.60 a clip
          // those are the expensive part.
          fejl.push(`Rum ${i + 1}: ${err.message}`);
          setVeoRoom((prev) => ({ ...prev, [i]: "fejl" }));
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(VEO_CONCURRENCY, koe.length) }, arbejder));

    if (fejl.length) {
      const unikke = [...new Set(fejl.map((f) => f.replace(/^Rum \d+: /, "")))];
      setVeoError(
        `${fejl.length} af ${indexes.length} Veo-klip fejlede. ` +
        unikke.slice(0, 2).join(" — ") +
        (unikke.length > 2 ? ` (+${unikke.length - 2} andre årsager)` : "")
      );
      setVeoStatus(clips.some(Boolean) ? "done" : "error");
    } else {
      setVeoStatus("done");
    }
  };

  const runHighQuality = async (onlyIndexes) => {
    if (hqStatus === "working" || flythroughStills.length === 0) return;
    // Clips already produced are already paid for, so a full run only covers what is missing -
    // the room used for the test is not generated and billed a second time.
    const clips = hqClips ? hqClips.slice() : new Array(flythroughStills.length).fill(null);
    while (clips.length < flythroughStills.length) clips.push(null);
    const indexes = (onlyIndexes || flythroughStills.map((_, i) => i)).filter((i) => !clips[i]);
    if (indexes.length === 0) return;

    setHqStatus("working");
    setHqError("");
    setExportStatus("idle");
    setExportFile((prev) => { if (prev) URL.revokeObjectURL(prev.url); return null; });
    try {
      let done = 0;
      setHqProgress({ current: 0, total: indexes.length, phase: "generate" });
      const startedAt = {};
      hqStartedRef.current = startedAt;
      setHqRoom(indexes.reduce((acc, i) => { acc[i] = "venter"; return acc; }, {}));

      // One photo, start to finish. Each runs independently, so a slow clip does not hold up
      // the others.
      const lavKlip = async (i) => {
        const up = await fetch("/api/upload-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dataUrl: flythroughStills[i], filename: `rundvis-${Date.now()}-${i}.jpg` }),
        });
        const upJson = await up.json();
        if (!up.ok) throw new Error(upJson.error || "Kunne ikke uploade billedet.");

        const payload = JSON.stringify({
          imageUrl: upJson.url,
          motion: flythroughParams[i] ? flythroughParams[i].type : "push",
          // The edit alternates direction shot by shot. Without this the model was told only
          // "pan" and defaulted left every time, so an upgraded property came back with less
          // variation than the free version it replaced.
          dir: flythroughParams[i] ? flythroughParams[i].dirSign : 1,
          // Generate natively in the shape the video will be shown in, rather than cropping a
          // widescreen clip down afterwards - on the models that support it.
          aspectRatio: previewFormat,
          // Fixed per photo index, so on a model with a seed a regenerated walkthrough is
          // identical rather than merely similar.
          seed: 1000 + i,
          quality: hqQuality,
        });

        // Submitting six at once will hit the account's limit, and being told "too many" is not a
        // failure - it means wait. The waiting happens here rather than in the serverless
        // function, which runs under a time limit of seconds while this limit can take minutes to
        // clear. Up to ten minutes of patience, which is still faster than generating one at a
        // time would have been.
        let created;
        for (let forsoeg = 0; ; forsoeg++) {
          const create = await fetch("/api/generate-clip/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
          });
          created = await create.json();
          if (create.ok) break;
          if (!created.retryable || forsoeg >= 25) {
            throw new Error(created.error || "Kunne ikke starte videoklippet.");
          }
          const vent = created.retryAfter ? created.retryAfter * 1000 : Math.min(5000 + forsoeg * 3000, 25000);
          await new Promise((r) => setTimeout(r, vent));
        }

        for (let attempt = 0; attempt < 150; attempt++) {
          await new Promise((r) => setTimeout(r, 3000));
          const st = await fetch("/api/generate-clip/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider: created.provider, id: created.id,
              statusUrl: created.statusUrl, responseUrl: created.responseUrl,
            }),
          });
          const stJson = await st.json();
          if (!st.ok) throw new Error(stJson.error || "Kunne ikke hente status.");
          if (stJson.done) return { url: stJson.videoUrl, sig: stJson.sig };
        }
        throw new Error(`Klip ${i + 1} blev ikke færdigt i tide.`);
      };

      // A small worker pool: HQ_CONCURRENCY jobs in flight, each taking the next photo off the
      // queue as it finishes.
      const koe = indexes.slice();
      const fejl = [];
      const arbejder = async () => {
        while (koe.length) {
          const i = koe.shift();
          startedAt[i] = performance.now();
          setHqRoom((prev) => ({ ...prev, [i]: "igang" }));
          try {
            clips[i] = await lavKlip(i);
            setHqRoom((prev) => ({ ...prev, [i]: "klar" }));
            // Published as we go, so the walkthrough visibly improves clip by clip rather than
            // leaving the agent watching a spinner.
            setHqClips(clips.slice());
          } catch (err) {
            // One photo failing is worth reporting, but it must not throw away the clips that
            // succeeded - those are already paid for.
            fejl.push(`Billede ${i + 1}: ${err.message}`);
            setHqRoom((prev) => ({ ...prev, [i]: "fejl" }));
          }
          done++;
          setHqProgress({ current: done, total: indexes.length, phase: "generate" });
        }
      };
      await Promise.all(Array.from({ length: Math.min(HQ_CONCURRENCY, koe.length) }, arbejder));

      if (fejl.length) {
        // Show the distinct reasons rather than only the first: when all clips fail the same
        // way that is one line, and when they fail differently that difference is the clue.
        const unikke = [...new Set(fejl.map((f) => f.replace(/^Billede \d+: /, "")))];
        setHqError(
          `${fejl.length} af ${indexes.length} klip fejlede. ` +
          unikke.slice(0, 2).join(" — ") +
          (unikke.length > 2 ? ` (+${unikke.length - 2} andre årsager)` : "")
        );
        setHqStatus(clips.some(Boolean) ? "done" : "error");
      } else {
        setHqStatus("done");
      }
    } catch (err) {
      setHqError(err.message || "Genereringen fejlede.");
      setHqStatus("error");
      // Whatever did finish is kept - those clips are already paid for.
      if (clips.some(Boolean)) setHqClips(clips.slice());
    }
  };

  // Renders the walkthrough to a downloadable file in the requested aspect ratio. The heavy
  // work happens in exportFlythroughVideo; this only tracks progress and hands back a blob URL.
  const handleExport = async (format) => {
    if (exportStatus === "working" || flythroughStills.length === 0) return;
    setExportStatus("working");
    setExportError("");
    setExportProgress({ phase: "prepare", current: 0, total: flythroughStills.length });
    if (exportFile) { URL.revokeObjectURL(exportFile.url); setExportFile(null); }
    try {
      const blob = await exportFlythroughVideo({
        stills: flythroughStills,
        specs: flythroughParams,
        clips: hqClips,
        musicBytes: musicRawRef.current,
        titles,
        format,
        fps: 30,
        onProgress: setExportProgress,
      });
      const ext = blob.type.indexOf("mp4") !== -1 ? "mp4" : "webm";
      setExportFile({
        url: URL.createObjectURL(blob),
        name: `rundvis-gennemgang-${format.replace(":", "x")}.${ext}`,
      });
      setExportStatus("done");
    } catch (err) {
      setExportError(err.message || "Eksporten fejlede.");
      setExportStatus("error");
    }
  };

  const togglePlay = () => {
    if (isPlaying) {
      audioRef.current && audioRef.current.pause();
      window.speechSynthesis && window.speechSynthesis.cancel();
      setIsPlaying(false);
    } else {
      if (!allVoicesReady) return;
      if (currentIndex >= scenes.length) setCurrentIndex(0);
      setIsPlaying(true);
    }
  };
  const restart = () => {
    audioRef.current && audioRef.current.pause();
    window.speechSynthesis && window.speechSynthesis.cancel();
    setPrevIndex(null);
    setCurrentIndex(0);
    setIsPlaying(true);
  };

  const canGoStep = (n) => (n === 1 ? true : images.length >= 2);
  const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label;

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: INK, color: TEXT, fontFamily: "'Instrument Sans', system-ui, sans-serif" }}>
      <audio ref={audioRef} className="hidden" />
      <header className="px-5 pt-8 pb-6">
        <div className="max-w-3xl mx-auto flex items-baseline justify-between">
          <span className="font-display" style={{ fontSize: 30, letterSpacing: "-0.02em" }}>Rundvis</span>
          <span className="text-xs hidden sm:block" style={{ color: MUTED }}></span>
        </div>
      </header>

      <div className="max-w-3xl mx-auto px-5 pt-5">
        <div className="flex gap-2 overflow-x-auto pb-1">
          {STEPS.map((s) => <StepPill key={s.id} step={s.id} active={step === s.id} done={step > s.id} disabled={!canGoStep(s.id)} onClick={() => setStep(s.id)} />)}
        </div>
      </div>

      <main className="max-w-3xl mx-auto px-5 py-8">
        {step === 1 && (
          <section>
            <h1 className="font-display text-2xl mb-1">Læg boligens billeder ind</h1>
            <p className="text-sm mb-6" style={{ color: MUTED }}>Fra 3 billeder og op. Rækkefølgen bliver scenerækkefølgen.</p>
            <div onClick={() => fileInputRef.current?.click()} onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
              className="rounded-lg p-8 text-center cursor-pointer mb-5" style={{ border: `1.5px dashed ${LINE}`, backgroundColor: SURFACE }}>
              <Icon name="upload" size={22} style={{ color: MUTED, margin: "0 auto 10px" }} />
              <p className="text-sm">Træk billeder herind, eller <span style={{ color: ACCENT }}>vælg filer</span></p>
              <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFiles(e.target.files)} />
            </div>
            {images.length > 0 && (
              <div ref={imgGridRef} className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-7">
                {images.map((img, idx) => {
                  const held = imgDragFrom === idx;
                  return (
                  <div
                    key={img.id}
                    data-img
                    onPointerDown={(e) => {
                      // Not from the buttons sitting on top of the photo - a tap on the cross or an
                      // arrow is a click, not the start of a drag.
                      if (e.target.closest("button")) return;
                      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}

                    className="rounded-full text-sm"
                    style={{
                      border: `1px solid ${TEXT}`,
                      color: TEXT,
                      padding: "11px 26px",
                      opacity: exportStatus === "working" ? 0.45 : 1,
                      cursor: exportStatus === "working" ? "not-allowed" : "pointer",
                    }}
                  >
                    Hent video
                  </button>

                  {exportStatus === "working" && (
                    <div className="flex items-center gap-2 text-xs" style={{ color: MUTED }}>
                      <Icon name="loader" size={13} />
                      {exportProgress.phase === "prepare"
                        ? `Forbereder billede ${exportProgress.current} af ${exportProgress.total}…`
                        : `Optager video ${Math.round((exportProgress.current / Math.max(1, exportProgress.total)) * 100)}%…`}
                    </div>
                  )}

                  {exportStatus === "working" && (
                    <p className="text-[10px] mt-1" style={{ color: AMBER }}>
                      Optagelsen kører i realtid. <strong>Bliv på denne fane imens</strong> — ellers bliver filen tom.
                    </p>
                  )}

                  {exportStatus === "error" && <p className="text-xs" style={{ color: AMBER }}>{exportError}</p>}

                  {exportStatus === "done" && exportFile && (
                    <div>
                      <a href={exportFile.url} download={exportFile.name} className="inline-flex items-center gap-1.5 text-xs" style={{ color: ACCENT }}>
                        <Icon name="arrowDown" size={13} /> Hent {exportFile.name}
                      </a>
                      {exportFile.name.endsWith(".webm") && (
                        <p className="text-[10px] mt-1" style={{ color: MUTED }}>
                          Din browser optager i WebM. Konvertér til MP4 hvis modtageren kræver det.
                        </p>
                      )}
                    </div>
                  )}
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <p className="text-[10px] mb-4" style={{ color: MUTED }}>

                </p>
              )}

              {flythroughStatus === "error" && flythroughStills.length === 0 && (
                <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs mt-1" style={{ color: MUTED }}>
                  <Icon name="rotate" size={12} /> Prøv igen
                </button>
              )}
            </div>

<button onClick={() => setStep(1)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm mt-6" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> Tilbage til billeder</button>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Rundvis />);
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Parallax 3D test</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
  #log { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); padding: 8px; font-size: 12px; white-space: pre-wrap; max-height: 40vh; overflow: auto; z-index: 10; }
  canvas { display: block; margin-top: 40vh; }
</style>
</head>
<body>
<div id="log">booting…</div>
<canvas id="c" width="640" height="480"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const logEl = document.getElementById("log");
function log(msg) {
  console.log(msg);
  logEl.textContent += "\n" + msg;
}
log("three.js loaded: " + (typeof THREE !== "undefined") + " r" + (window.THREE && THREE.REVISION));

// Build a synthetic test "photo" (a canvas with a simple scene: a bright
// "window" rectangle in the middle representing something that should sit
// at a different depth than the surrounding "wall").
function makeTestPhoto() {
  const cnv = document.createElement("canvas");
  cnv.width = 512; cnv.height = 512;
  const ctx = cnv.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, "#8899aa");
  grad.addColorStop(1, "#445566");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#ddccaa";
  ctx.fillRect(120, 120, 270, 270);
  ctx.fillStyle = "#334455";
  ctx.fillRect(180, 180, 150, 150);
  return cnv;
}

// Build a synthetic depth map matching the photo: the inner rectangle is
// "closer" (brighter = nearer, matching how depth-estimation output is
// typically interpreted: near=high value).
function makeTestDepth() {
  const cnv = document.createElement("canvas");
  cnv.width = 512; cnv.height = 512;
  const ctx = cnv.getContext("2d");
  ctx.fillStyle = "#404040"; // far background
  ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = "#b0b0b0"; // mid rectangle
  ctx.fillRect(120, 120, 270, 270);
  ctx.fillStyle = "#ffffff"; // near inner rectangle
  ctx.fillRect(180, 180, 150, 150);
  return cnv;
}

function buildParallaxMesh(photoCanvas, depthCanvas, segments) {
  const dctx = depthCanvas.getContext("2d");
  const depthData = dctx.getImageData(0, 0, depthCanvas.width, depthCanvas.height).data;

  const geometry = new THREE.PlaneGeometry(2, 2, segments, segments);
  const pos = geometry.attributes.position;
  const maxDisplacement = 0.35; // how far "near" pixels pop toward the camera

  for (let i = 0; i < pos.count; i++) {
    const u = (pos.getX(i) + 1) / 2; // 0..1
    const v = 1 - (pos.getY(i) + 1) / 2; // 0..1, flip Y to match image space
    const px = Math.min(depthCanvas.width - 1, Math.floor(u * depthCanvas.width));
    const py = Math.min(depthCanvas.height - 1, Math.floor(v * depthCanvas.height));
    const idx = (py * depthCanvas.width + px) * 4;
    const depthVal = depthData[idx] / 255; // 0 (far) .. 1 (near)
    pos.setZ(i, depthVal * maxDisplacement);
  }
  geometry.computeVertexNormals();

  const texture = new THREE.CanvasTexture(photoCanvas);
  texture.needsUpdate = true;
  const material = new THREE.MeshBasicMaterial({ map: texture });
  return new THREE.Mesh(geometry, material);
}

try {
  const photo = makeTestPhoto();
  const depth = makeTestDepth();
  log("built synthetic photo + depth canvases: " + photo.width + "x" + photo.height);

  const canvasEl = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setSize(640, 480);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 640 / 480, 0.1, 10);
  camera.position.set(0, 0, 2.2);

  const mesh = buildParallaxMesh(photo, depth, 80);
  scene.add(mesh);
  log("mesh built, vertex count: " + mesh.geometry.attributes.position.count);

  let start = performance.now();
  const durationMs = 4000;

  function animate() {
    requestAnimationFrame(animate);
    const t = Math.min(1, (performance.now() - start) / durationMs);
    // Push-in: camera moves closer over time, revealing parallax between the
    // "near" inner rectangle and the "far" background as it does.
    camera.position.z = 2.2 - t * 0.6;
    camera.position.x = Math.sin(t * Math.PI) * 0.15; // slight lateral drift too
    renderer.render(scene, camera);
  }
  animate();
  log("SUCCESS: parallax render loop started with no errors.");
} catch (err) {
  log("ERROR: " + err.message + "\n" + err.stack);
}
</script>
</body>
</html>

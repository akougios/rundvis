<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rundvis — AI boligvideo prototype</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body, #root { height: 100%; }
  body { margin: 0; background: #15191C; font-family: 'IBM Plex Sans', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #2C3237; border-radius: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  .kb-img { will-change: transform; transform-origin: center center; filter: saturate(1.08) contrast(1.04); }
  .kb-fade { opacity: 0; transition: opacity 550ms ease; }
  .kb-fade.kb-fade-in { opacity: 1; }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%); }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .kb-img { transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

const INK = "#15191C", SURFACE = "#1D2226", SURFACE_2 = "#242A2E", TEXT = "#F2EFE7",
  MUTED = "#98A0A6", ACCENT = "#3860E8", ACCENT_SOFT = "#293B72", AMBER = "#E3A33D", LINE = "#2C3237";

const PROPERTY_TYPES = [
  { id: "villa", label: "Villa", hint: "Roligt tempo, fokus på rum og lys" },
  { id: "sommerhus", label: "Sommerhus", hint: "Udeliv, terrasse, udsigt" },
  { id: "liebhaver", label: "Liebhaverbolig", hint: "Langsomt, cinematisk, detaljer" },
  { id: "nyhed", label: "Nyhed på markedet", hint: "Energisk tempo, skaber interesse" },
  { id: "prisnedsaettelse", label: "Prisnedsættelse", hint: "Tydeligt fokus på ny pris" },
  { id: "aabenthus", label: "Åbent hus", hint: "Dato og tidspunkt fremhævet" },
];
const STEPS = [{ id: 1, label: "Boligtype" }, { id: 2, label: "Billeder" }, { id: 3, label: "Manuskript" }, { id: 4, label: "Afspil" }];
const FALLBACK_SCENE_MS = 6000;

function seededRandom(seed) {
  const s = Math.sin(seed) * 10000;
  return s - Math.floor(s);
}
function easeInOutSine(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

// Deterministic per-scene camera-move: a mix of zoom in/out and a pan direction,
// varied by index so consecutive scenes don't all move the same way.
function kenBurnsParamsFor(index) {
  const r1 = seededRandom(index * 12.9898 + 3.7);
  const r2 = seededRandom(index * 78.233 + 1.3);
  const r3 = seededRandom(index * 37.719 + 2.1);
  const r4 = seededRandom(index * 5.234 + 4.9);
  const zoomIn = r1 > 0.5;
  const scaleAmt = 1.08 + r2 * 0.09; // 1.08 - 1.17
  const panX = (r3 - 0.5) * 7; // -3.5% .. 3.5%
  const panY = (r4 - 0.5) * 5; // -2.5% .. 2.5%
  return {
    scaleFrom: zoomIn ? 1.02 : scaleAmt,
    scaleTo: zoomIn ? scaleAmt : 1.02,
    panX, panY,
  };
}
function applyKenBurns(el, params, t) {
  if (!el) return;
  const e = easeInOutSine(Math.max(0, Math.min(1, t)));
  const scale = params.scaleFrom + (params.scaleTo - params.scaleFrom) * e;
  const tx = -params.panX / 2 + params.panX * e;
  const ty = -params.panY / 2 + params.panY * e;
  el.style.transform = `scale(${scale.toFixed(4)}) translate(${tx.toFixed(2)}%, ${ty.toFixed(2)}%)`;
}

// ---- Depth-based 3D parallax ("3D Ken Burns"): a deterministic, non-generative technique.
// Instead of asking an AI video model to imagine camera motion (which can't be made to always
// move the same reliable direction - see README history), we estimate a real per-pixel depth map
// for each uploaded photo directly in the browser (no server, no per-generation AI cost, no
// randomness) and move a virtual camera through the resulting 3D mesh along a fixed, chosen path.
// The same photo always produces the exact same depth map and therefore the exact same move.

// Runs a dynamic import() from inside a Babel-transformed script without Babel's parser ever
// seeing the `import(...)` token (which the default Babel-standalone preset can't parse) - the
// browser's own engine parses the string body of the Function constructor at call time instead.
const dynamicImport = (url) => new Function("u", "return import(u)")(url);

let depthEstimatorPromise = null;
function getDepthEstimator() {
  if (!depthEstimatorPromise) {
    depthEstimatorPromise = dynamicImport("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5")
      .then((mod) => mod.pipeline("depth-estimation", "onnx-community/depth-anything-v2-small", { dtype: "q8" }));
  }
  return depthEstimatorPromise;
}

// Estimates depth for a single data-URL photo and returns a same-size grayscale
// canvas (bright = near the camera, dark = far).
async function estimateDepthCanvas(dataUrl) {
  const estimator = await getDepthEstimator();
  const output = await estimator(dataUrl);
  return output.depth.toCanvas();
}

// Deterministic per-index camera path (same seededRandom technique as kenBurnsParamsFor above,
// so it never reshuffles on re-render). Image 0 - the facade/entry photo - always gets a
// straight push-in for a "walking towards the house" feel; the rest cycle through
// push/pan/orbit for variety.
function parallaxPathFor(index) {
  const r1 = seededRandom(index * 17.31 + 2.4);
  const r2 = seededRandom(index * 41.7 + 5.1);
  const r3 = seededRandom(index * 9.13 + 7.7);
  const type = index === 0 ? "push" : ["push", "pan", "orbit"][index % 3];
  const dirSign = r1 > 0.5 ? 1 : -1;
  const panAmt = 0.16 + r2 * 0.1;
  const pushAmt = 0.28 + r3 * 0.16;
  const durationMs = 5200 + r2 * 1600; // ~5.2-6.8s, matches the old room-montage pace

  let from = { x: 0, y: 0, z: 0.95 };
  let to = { x: 0, y: 0, z: 0.95 - pushAmt };
  if (type === "pan") {
    from = { x: -dirSign * panAmt * 0.5, y: 0, z: 1.0 };
    to = { x: dirSign * panAmt * 0.5, y: 0, z: 1.0 - pushAmt * 0.4 };
  } else if (type === "orbit") {
    from = { x: -dirSign * panAmt * 0.35, y: dirSign * 0.03, z: 1.02 };
    to = { x: dirSign * panAmt * 0.55, y: -dirSign * 0.02, z: 1.02 - pushAmt * 0.5 };
  }
  return { type, from, to, durationMs };
}

function Icon({ name, size = 16, className = "", style = {} }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className, style };
  switch (name) {
    case "upload": return <svg {...p}><path d="M12 3v12" /><path d="m7 8 5-5 5 5" /><path d="M5 21h14" /></svg>;
    case "play": return <svg {...p} fill="currentColor"><polygon points="6 3 20 12 6 21 6 3" /></svg>;
    case "pause": return <svg {...p} fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>;
    case "chevronLeft": return <svg {...p}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevronRight": return <svg {...p}><polyline points="9 18 15 12 9 6" /></svg>;
    case "sparkles": return <svg {...p} fill="currentColor" stroke="none"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6z" /></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "arrowUp": return <svg {...p}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>;
    case "arrowDown": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></svg>;
    case "check": return <svg {...p}><polyline points="20 6 9 17 4 12" /></svg>;
    case "rotate": return <svg {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>;
    case "loader": return <svg {...p} className={"spin " + className}><circle cx="12" cy="12" r="9" strokeDasharray="40 20" /></svg>;
    case "film": return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="7" y1="3" x2="7" y2="21" /><line x1="17" y1="3" x2="17" y2="21" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /></svg>;
    case "volume": return <svg {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 5.5a9 9 0 0 1 0 13" /></svg>;
    case "music": return <svg {...p}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>;
    default: return null;
  }
}

function StepPill({ step, active, done, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className="flex items-center gap-2 px-3 py-2 rounded-full text-sm whitespace-nowrap transition-colors shrink-0"
      style={{ backgroundColor: active ? ACCENT : done ? SURFACE_2 : "transparent", color: active ? "#fff" : done ? TEXT : MUTED,
        border: `1px solid ${active ? ACCENT : LINE}`, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1 }}>
      <span className="flex items-center justify-center rounded-full text-xs font-medium" style={{ width: 18, height: 18,
        backgroundColor: done && !active ? ACCENT : "transparent", border: active || (done && !active) ? "none" : `1px solid ${MUTED}`,
        color: active ? "#fff" : done ? "#fff" : MUTED }}>
        {done && !active ? <Icon name="check" size={11} /> : step}
      </span>
      {STEPS[step - 1].label}
    </button>
  );
}

// One Ken-Burns-animated image layer. Mounts at opacity 0 and fades in,
// and continuously updates its own transform via rAF while active.
function SceneLayer({ src, active, isPlaying, getProgress, kbParams, fadeMs }) {
  const imgRef = useRef(null);
  const [faded, setFaded] = useState(false);

  useEffect(() => {
    setFaded(false);
    const t = requestAnimationFrame(() => setFaded(true));
    return () => cancelAnimationFrame(t);
  }, [src]);

  useEffect(() => {
    if (!active) return;
    let raf;
    const tick = () => {
      applyKenBurns(imgRef.current, kbParams, getProgress());
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [active, isPlaying, kbParams]);

  useEffect(() => {
    if (!active) applyKenBurns(imgRef.current, kbParams, 0);
  }, [active, kbParams]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt=""
      className={`kb-img kb-fade absolute inset-0 w-full h-full object-cover ${faded ? "kb-fade-in" : ""}`}
      style={{ zIndex: active ? 2 : 1, ...(fadeMs ? { transitionDuration: `${fadeMs}ms` } : {}) }}
    />
  );
}

// One 3D-parallax-animated image layer: builds a depth-displaced mesh from a photo + its
// depth map and moves a virtual camera through it along a fixed path (see parallaxPathFor).
// Mirrors SceneLayer's active/fade lifecycle so it can be swapped the exact same way.
function ParallaxLayer({ src, depthCanvas, active, getProgress, path, fadeMs }) {
  const containerRef = useRef(null);
  const [faded, setFaded] = useState(false);
  const sceneRef = useRef(null); // { renderer, scene, camera }

  useEffect(() => {
    setFaded(false);
    const t = requestAnimationFrame(() => setFaded(true));
    return () => cancelAnimationFrame(t);
  }, [src]);

  // Builds the renderer + depth-displaced mesh once per src/depth pair.
  useEffect(() => {
    const container = containerRef.current;
    if (!container || !depthCanvas || typeof THREE === "undefined") return;
    let disposed = false;

    const width = container.clientWidth || 320;
    const height = container.clientHeight || 568;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    container.innerHTML = "";
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, width / height, 0.05, 10);

    const img = new Image();
    img.onload = () => {
      if (disposed) return;
      // Size the plane to the photo's own aspect ratio and let it overflow the frame on
      // the short axis (object-cover style) rather than ever showing letterboxing.
      const aspect = img.width / img.height;
      const frameAspect = width / height;
      let planeW = 2, planeH = 2 / aspect;
      if (aspect > frameAspect) { planeH = 2; planeW = 2 * aspect; } else { planeW = 2; planeH = 2 / aspect; }
      const segments = 60;
      const geometry = new THREE.PlaneGeometry(planeW, planeH, segments, segments);
      const pos = geometry.attributes.position;
      const dctx = depthCanvas.getContext("2d");
      const depthData = dctx.getImageData(0, 0, depthCanvas.width, depthCanvas.height).data;
      const maxDisplacement = 0.22;
      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i) / planeW + 0.5;
        const v = 1 - (pos.getY(i) / planeH + 0.5);
        const px = Math.min(depthCanvas.width - 1, Math.max(0, Math.floor(u * depthCanvas.width)));
        const py = Math.min(depthCanvas.height - 1, Math.max(0, Math.floor(v * depthCanvas.height)));
        const idx = (py * depthCanvas.width + px) * 4;
        const depthVal = depthData[idx] / 255; // 0 (far) .. 1 (near)
        pos.setZ(i, depthVal * maxDisplacement);
      }
      geometry.computeVertexNormals();

      const canvasImg = document.createElement("canvas");
      canvasImg.width = img.width;
      canvasImg.height = img.height;
      canvasImg.getContext("2d").drawImage(img, 0, 0);
      const texture = new THREE.CanvasTexture(canvasImg);
      texture.needsUpdate = true;
      const material = new THREE.MeshBasicMaterial({ map: texture });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      sceneRef.current = { renderer, scene, camera };
    };
    img.src = src;

    return () => {
      disposed = true;
      sceneRef.current = null;
      renderer.dispose();
      if (container) container.innerHTML = "";
    };
    // eslint-disable-next-line
  }, [src, depthCanvas]);

  // Drives the camera along its path every frame while active; holds the final frame once not.
  useEffect(() => {
    let raf;
    const renderAt = (t) => {
      const s = sceneRef.current;
      if (!s || !path) return;
      const e = easeInOutSine(Math.max(0, Math.min(1, t)));
      const from = path.from, to = path.to;
      s.camera.position.set(
        from.x + (to.x - from.x) * e,
        from.y + (to.y - from.y) * e,
        from.z + (to.z - from.z) * e
      );
      s.camera.lookAt(0, 0, 0);
      s.renderer.render(s.scene, s.camera);
    };
    if (active) {
      const tick = () => {
        renderAt(getProgress());
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    } else {
      renderAt(1);
    }
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [active, path]);

  return (
    <div
      ref={containerRef}
      className={`kb-fade absolute inset-0 w-full h-full ${faded ? "kb-fade-in" : ""}`}
      style={{ zIndex: active ? 2 : 1, ...(fadeMs ? { transitionDuration: `${fadeMs}ms` } : {}) }}
    />
  );
}

function Rundvis() {
  const [step, setStep] = useState(1);
  const [propertyType, setPropertyType] = useState(null);
  const [images, setImages] = useState([]);
  const [address, setAddress] = useState("");
  const [agentName, setAgentName] = useState("");
  const [notes, setNotes] = useState("");
  const [scenes, setScenes] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [genError, setGenError] = useState("");

  const [isPlaying, setIsPlaying] = useState(false);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [prevIndex, setPrevIndex] = useState(null);
  const [voices, setVoices] = useState([]); // [{status:'idle'|'loading'|'ready'|'error', url, mode:'audio'|'browser'}]
  const [voicesPreparing, setVoicesPreparing] = useState(false);
  const [voiceOverallError, setVoiceOverallError] = useState("");
  const [musicOn, setMusicOn] = useState(false);

  // AI-gennemgang state: a deterministic, non-generative "3D Ken Burns" (see the module-level
  // depth/parallax helpers above) - no AI video generation is involved any more, so there's no
  // upload step and no video URL to track, just the resized stills and their depth maps.
  const [flythroughStatus, setFlythroughStatus] = useState("idle"); // idle|processing|done|error
  const [flythroughError, setFlythroughError] = useState("");
  const [flythroughProgress, setFlythroughProgress] = useState({ current: 0, total: 0 });
  const [flythroughStills, setFlythroughStills] = useState([]); // resized data-URLs actually used, in upload order
  const [flythroughDepths, setFlythroughDepths] = useState([]); // matching depth-map canvases, one per still
  const [flythroughIndex, setFlythroughIndex] = useState(0);
  const [flythroughPrevIndex, setFlythroughPrevIndex] = useState(null);
  const flythroughStartRef = useRef(0);

  const fileInputRef = useRef(null);
  const audioRef = useRef(null);
  const sceneStartRef = useRef(0);
  const audioCtxRef = useRef(null);
  const musicNodesRef = useRef(null);

  const kbParamsList = useMemo(() => scenes.map((_, i) => kenBurnsParamsFor(i)), [scenes.length]);

  const handleFiles = (fileList) => {
    const files = Array.from(fileList).slice(0, 20 - images.length);
    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = (e) => setImages((prev) => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, src: e.target.result }]);
      reader.readAsDataURL(file);
    });
  };
  const removeImage = (id) => setImages((prev) => prev.filter((i) => i.id !== id));
  const moveImage = (idx, dir) => {
    setImages((prev) => {
      const next = [...prev]; const target = idx + dir;
      if (target < 0 || target >= next.length) return prev;
      [next[idx], next[target]] = [next[target], next[idx]];
      return next;
    });
  };

  const generateScript = async () => {
    setGenerating(true); setGenError("");
    try {
      const typeLabel = PROPERTY_TYPES.find((t) => t.id === propertyType)?.label || "bolig";
      const response = await fetch("/api/generate-script", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ propertyTypeLabel: typeLabel, address, agentName, notes, sceneCount: images.length }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Ukendt fejl fra serveren.");
      const lines = data.lines || [];
      setScenes(images.map((img, i) => ({ imageId: img.id, text: lines[i] || "" })));
      setStep(3);
    } catch (err) {
      setGenError(`Kunne ikke generere manuskript: ${err.message}. Prøv igen, eller skriv scenerne manuelt herunder.`);
      if (scenes.length === 0) setScenes(images.map((img) => ({ imageId: img.id, text: "" })));
    } finally { setGenerating(false); }
  };

  const updateScene = (idx, text) => setScenes((prev) => { const n = [...prev]; n[idx] = { ...n[idx], text }; return n; });

  // ---- Voice generation (ElevenLabs, with per-scene browser-TTS fallback) ----
  const generateVoiceForIndex = async (idx, text) => {
    try {
      const res = await fetch("/api/generate-voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("voice-api-failed");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      return { status: "ready", url, mode: "audio" };
    } catch (err) {
      return { status: "ready", url: null, mode: "browser" };
    }
  };

  const prepareVoices = useCallback(async () => {
    if (!scenes.length) return;
    setVoicesPreparing(true);
    setVoiceOverallError("");
    const initial = scenes.map(() => ({ status: "loading", url: null, mode: null }));
    setVoices(initial);
    const results = new Array(scenes.length);
    const concurrency = 3;
    let cursor = 0;
    let anyAudioFailed = false;
    async function worker() {
      while (cursor < scenes.length) {
        const i = cursor++;
        const r = await generateVoiceForIndex(i, scenes[i].text);
        if (r.mode === "browser") anyAudioFailed = true;
        results[i] = r;
        setVoices((prev) => { const n = [...prev]; n[i] = r; return n; });
      }
    }
    await Promise.all(Array.from({ length: concurrency }, worker));
    if (anyAudioFailed) {
      setVoiceOverallError("Nogle scener kunne ikke få en AI-stemme (ElevenLabs) og bruger i stedet browserens indbyggede tale som reserve.");
    }
    setVoicesPreparing(false);
  }, [scenes]);

  useEffect(() => {
    if (step === 4 && scenes.length > 0 && voices.length === 0) {
      prepareVoices();
    }
  }, [step, scenes, voices.length, prepareVoices]);

  // ---- Ambient background music (Web Audio, no external file needed) ----
  const ensureAudioCtx = () => {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  };
  const startMusic = () => {
    const ctx = ensureAudioCtx();
    if (!ctx || musicNodesRef.current) return;
    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.5);
    master.connect(ctx.destination);
    const freqs = [130.81, 164.81, 196.0]; // soft C major-ish pad
    const oscs = freqs.map((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.15;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      osc.connect(g); g.connect(master);
      osc.start(); lfo.start();
      return { osc, lfo };
    });
    musicNodesRef.current = { master, oscs };
  };
  const stopMusic = () => {
    const nodes = musicNodesRef.current;
    const ctx = audioCtxRef.current;
    if (!nodes || !ctx) return;
    nodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
    setTimeout(() => {
      nodes.oscs.forEach(({ osc, lfo }) => { try { osc.stop(); lfo.stop(); } catch (e) {} });
    }, 700);
    musicNodesRef.current = null;
  };
  useEffect(() => {
    if (isPlaying && musicOn) startMusic();
    if ((!isPlaying || !musicOn)) stopMusic();
    // eslint-disable-next-line
  }, [isPlaying, musicOn]);
  useEffect(() => () => { stopMusic(); if (audioCtxRef.current) audioCtxRef.current.close(); }, []);

  // ---- Playback engine ----
  const advanceScene = useCallback(() => {
    setCurrentIndex((i) => {
      if (i + 1 >= scenes.length) { setIsPlaying(false); return 0; }
      setPrevIndex(i);
      return i + 1;
    });
  }, [scenes.length]);

  useEffect(() => {
    if (!isPlaying) return;
    const voice = voices[currentIndex];
    if (!voice || voice.status !== "ready") return;
    sceneStartRef.current = performance.now();
    if (voice.mode === "audio" && voice.url) {
      const audio = audioRef.current;
      audio.src = voice.url;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      const onEnded = () => advanceScene();
      audio.addEventListener("ended", onEnded);
      return () => audio.removeEventListener("ended", onEnded);
    } else {
      const text = scenes[currentIndex]?.text || "";
      if (text && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const daVoice = window.speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("da"));
        if (daVoice) utter.voice = daVoice;
        utter.lang = "da-DK"; utter.rate = 0.96;
        utter.onend = () => advanceScene();
        utter.onerror = () => advanceScene();
        window.speechSynthesis.speak(utter);
        return () => window.speechSynthesis.cancel();
      } else {
        const t = setTimeout(advanceScene, FALLBACK_SCENE_MS);
        return () => clearTimeout(t);
      }
    }
    // eslint-disable-next-line
  }, [isPlaying, currentIndex, voices]);

  useEffect(() => {
    if (prevIndex === null) return;
    const t = setTimeout(() => setPrevIndex(null), 600);
    return () => clearTimeout(t);

  const getProgress = useCallback(() => {
    const voice = voices[currentIndex];
    if (voice && voice.mode === "audio" && audioRef.current && audioRef.current.duration) {
      return audioRef.current.currentTime / audioRef.current.duration;

    const elapsed = performance.now() - sceneStartRef.current;
    return elapsed / FALLBACK_SCENE_MS;

  const allVoicesReady = voices.length === scenes.length && voices.every((v) => v && v.status === "ready");

  // ---- AI-gennemgang: a deterministic, non-generative "3D Ken Burns" - see the depth/parallax
  // helpers near the top of this file. Every uploaded photo (up to MAX_FLYTHROUGH_IMAGES) gets a
  // real per-pixel depth map estimated entirely client-side, then a virtual camera moves through
  // the resulting 3D mesh along a fixed path. No AI video generation, no upload, no per-run cost,
  // and - critically - no risk of the camera "inventing" a wrong direction: the same photos
  // always produce the exact same depth maps and therefore the exact same moves. (The old
  // Luma-based AI clip code is still in api/generate-flythrough/ but is no longer wired in here.)
  const MAX_FLYTHROUGH_IMAGES = 8;
  const FLYTHROUGH_MAX_DIMENSION = 900; // depth estimation + the mesh's texture only need to look good on screen, not at full photo resolution - keeps inference to a few seconds per photo

  // Downscale a data-URL image in the browser (canvas) before depth estimation.
  const resizeImageDataUrl = (dataUrl, maxDimension) =>
    new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
        if (scale >= 1) { resolve(dataUrl); return; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.88));
      };
      img.onerror = () => resolve(dataUrl); // fall back to the original if decoding fails
      img.src = dataUrl;
    });

  // Estimates a depth map for every uploaded photo (in order) entirely in the browser, then
  // starts the show. Runs sequentially so the progress readout stays accurate and the model
  // (loaded once, cached in getDepthEstimator) isn't asked to do several images at once.
  const runFlythrough = async () => {
    setFlythroughStatus("processing");
    setFlythroughError("");
    try {
      const used = images.slice(0, MAX_FLYTHROUGH_IMAGES);
      setFlythroughProgress({ current: 0, total: used.length });
      const stills = [];
      const depths = [];
      for (let i = 0; i < used.length; i++) {
        const resized = await resizeImageDataUrl(used[i].src, FLYTHROUGH_MAX_DIMENSION);
        const depthCanvas = await estimateDepthCanvas(resized);
        stills.push(resized);
        depths.push(depthCanvas);
        setFlythroughProgress({ current: i + 1, total: used.length });
      }
      setFlythroughStills(stills);
      setFlythroughDepths(depths);
      setFlythroughIndex(0);
      setFlythroughPrevIndex(null);
      setFlythroughStatus("done");
    } catch (err) {
      setFlythroughError(err.message || "3D-gennemgangen fejlede.");
      setFlythroughStatus("error");
    }
  };

  // Re-runs the whole thing (depth is cheap and local, so there's nothing to reuse).
  const regenerateFlythrough = () => runFlythrough();

  const flythroughParams = useMemo(
    () => flythroughStills.map((_, i) => parallaxPathFor(i)),
    // eslint-disable-next-line
    [flythroughStills.length]
  );

  const getFlythroughProgress = () => {
    const dur = flythroughParams[flythroughIndex]?.durationMs || 5500;
    return (performance.now() - flythroughStartRef.current) / dur;
  };

  const advanceFlythrough = () => {
    setFlythroughIndex((i) => {
      const next = i + 1;
      setFlythroughPrevIndex(i);
      return next >= flythroughStills.length ? 0 : next; // loop the whole show
    });
  };

  // Drives the show: holds each photo for its own duration, then advances (looping at the end).
  useEffect(() => {
    if (flythroughStatus !== "done" || flythroughStills.length === 0) return;
    flythroughStartRef.current = performance.now();
    const dur = flythroughParams[flythroughIndex]?.durationMs || 5500;
    const t = setTimeout(advanceFlythrough, dur);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [flythroughStatus, flythroughIndex, flythroughStills.length]);

  // Clears the outgoing layer shortly after the incoming one has finished its crossfade-in.
  useEffect(() => {
    if (flythroughPrevIndex === null) return;
    const t = setTimeout(() => setFlythroughPrevIndex(null), 1100);
    return () => clearTimeout(t);
  }, [flythroughPrevIndex]);

  const togglePlay = () => {

    } else {

    setPrevIndex(null);
    setCurrentIndex(0);
    setIsPlaying(true);
  };

  const canGoStep = (n) => {

                      <button onClick={() => moveImage(idx, -1)} disabled={idx === 0} className="p-1 rounded" style={{ backgroundColor: "rgba(0,0,0,0.6)", opacity: idx === 0 ? 0.4 : 1 }}><Icon name="arrowUp" size={12} style={{ color: "#fff" }} /></button>
                      <button onClick={() => moveImage(idx, 1)} disabled={idx === images.length - 1} className="p-1 rounded" style={{ backgroundColor: "rgba(0,0,0,0.6)", opacity: idx === images.length - 1 ? 0.4 : 1 }}><Icon name="arrowDown" size={12} style={{ color: "#fff" }} /></button>
                    </div>

            <div className="flex items-center gap-3 flex-wrap">
              <button onClick={() => setStep(1)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> Tilbage</button>

                style={{ backgroundColor: images.length >= 3 ? ACCENT : SURFACE_2, color: images.length >= 3 ? "#fff" : MUTED, cursor: images.length >= 3 ? "pointer" : "not-allowed" }}>

                <Icon name="sparkles" size={12} /> Eller spring manuskript over og lav en AI-gennemgang med det samme

        )}

        {step === 3 && (
          <section>
            <h1 className="font-display text-2xl mb-1">Manuskript</h1>

            {scenes.length === 0 && (
              <div className="space-y-3 mb-6">
                <div>
                  <label className="text-xs block mb-1" style={{ color: MUTED }}>Adresse</label>
                  <input value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Fx Strandvejen 12, 2900 Hellerup"
                    className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}`, color: TEXT }} />
                </div>
                <div>
                  <label className="text-xs block mb-1" style={{ color: MUTED }}>Mæglernavn</label>

                    className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}`, color: TEXT }} />
                </div>
                <div>
                  <label className="text-xs block mb-1" style={{ color: MUTED }}>Nøgledetaljer fra salgsopstilling (valgfrit)</label>
                  <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Fx 4 værelser, sydvendt terrasse, nyt køkken 2023, gåafstand til station" rows={3}
                    className="w-full rounded-md px-3 py-2 text-sm outline-none resize-none" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}`, color: TEXT }} />
                </div>
                {genError && <p className="text-xs" style={{ color: AMBER }}>{genError}</p>}
                <button onClick={generateScript} disabled={generating} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium" style={{ backgroundColor: ACCENT, color: "#fff" }}>
                  {generating ? <><Icon name="loader" size={15} /> Genererer…</> : <><Icon name="sparkles" size={15} /> Generér manuskript</>}
                </button>
              </div>
            )}
            {scenes.length > 0 && (
              <>
                <div className="space-y-3 mb-6">
                  {scenes.map((scene, idx) => (
                    <div key={scene.imageId} className="flex gap-3 rounded-md p-2" style={{ backgroundColor: SURFACE, border: `1px solid ${LINE}` }}>
                      <img src={images.find((i) => i.id === scene.imageId)?.src} alt="" className="rounded object-cover shrink-0" style={{ width: 64, height: 64 }} />
                      <div className="flex-1">

                        <textarea value={scene.text} onChange={(e) => updateScene(idx, e.target.value)} rows={2}

                      </div>

                </div>
                <button onClick={() => { setScenes([]); setGenError(""); setVoices([]); }} className="flex items-center gap-1.5 text-xs mb-6" style={{ color: MUTED }}>

            <div className="flex items-center gap-3 flex-wrap">
              <button onClick={() => setStep(2)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> Tilbage</button>
              {scenes.length > 0 && (
                <button onClick={() => setStep(4)} disabled={!scenes.every((s) => s.text)} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium"
                  style={{ backgroundColor: scenes.every((s) => s.text) ? ACCENT : SURFACE_2, color: scenes.every((s) => s.text) ? "#fff" : MUTED }}>
                  Gå til afspilning <Icon name="chevronRight" size={15} />
                </button>
              )}
            </div>
          </section>
        )}

        {step === 4 && (images.length >= 2 || scenes.length > 0) && (
          <section>
            {scenes.length > 0 && (
              <>
                <h1 className="font-display text-2xl mb-1">Afspil</h1>
                <p className="text-sm mb-5" style={{ color: MUTED }}>
                  {voicesPreparing ? "Genererer AI-stemme for hver scene…" : "Filmisk kamerabevægelse, med rigtig AI-stemme."}
                </p>
                {voiceOverallError && <p className="text-xs mb-4" style={{ color: AMBER }}>{voiceOverallError}</p>}

            <div className="relative rounded-lg overflow-hidden mb-4" style={{ backgroundColor: "#000", aspectRatio: "16/9" }}>
              {prevIndex !== null && (
                <SceneLayer
                  src={images[prevIndex]?.src}
                  active={false}
                  isPlaying={isPlaying}
                  getProgress={() => 1}
                  kbParams={kbParamsList[prevIndex] || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}
                />
              )}
              <SceneLayer
                key={currentIndex}
                src={images[currentIndex]?.src}
                active={true}
                isPlaying={isPlaying}
                getProgress={getProgress}
                kbParams={kbParamsList[currentIndex] || { scaleFrom: 1, scaleTo: 1, panX: 0, panY: 0 }}
              />
              <div className="absolute inset-0 vignette pointer-events-none" style={{ zIndex: 3 }} />
              <div className="absolute inset-x-0 bottom-0 p-4" style={{ background: "linear-gradient(to top, rgba(0,0,0,0.8), transparent)", zIndex: 4 }}>
                {(agentName || address) && (
                  <div className="flex items-center justify-between mb-2 text-[10px]" style={{ color: "rgba(255,255,255,0.7)" }}>
                    <span>{agentName}</span><span>{address}</span>
                  </div>

                <p className="text-white text-sm sm:text-base font-medium leading-snug">{scenes[currentIndex]?.text}</p>
              </div>
              <div className="absolute top-3 right-3 px-2 py-1 rounded text-[10px] font-medium flex items-center gap-1" style={{ backgroundColor: "rgba(0,0,0,0.55)", color: "#fff", zIndex: 4 }}>
                <Icon name="volume" size={11} /> {typeLabel}
              </div>
              {voicesPreparing && (
                <div className="absolute inset-0 flex items-center justify-center" style={{ backgroundColor: "rgba(0,0,0,0.45)", zIndex: 5 }}>
                  <div className="flex items-center gap-2 px-4 py-2 rounded-full text-xs" style={{ backgroundColor: "rgba(0,0,0,0.6)", color: "#fff" }}>
                    <Icon name="loader" size={14} /> Genererer stemmer ({voices.filter((v) => v && v.status === "ready").length}/{scenes.length})
                  </div>

            </div>

            <div className="flex items-center justify-center gap-2 mb-5">

            </div>

            <div className="flex items-center justify-center gap-3 mb-4">

              {images.length >= 1 && flythroughStatus === "idle" && (
                <p className="text-xs mb-4" style={{ color: MUTED }}>
                  Beregner en 3D-kamerabevægelse for hvert af de {Math.min(images.length, MAX_FLYTHROUGH_IMAGES)} billeder du har uploadet indtil videre — tager typisk nogle få sekunder pr. billede, direkte i browseren.
                </p>
              )}

              {flythroughStatus === "idle" && (
                <button onClick={() => runFlythrough()} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium" style={{ backgroundColor: ACCENT, color: "#fff" }}>
                  <Icon name="sparkles" size={15} /> Generér AI-gennemgang
                </button>
              )}

              {flythroughStatus === "processing" && (
                <div className="flex items-center gap-2 text-sm mb-4" style={{ color: MUTED }}>
                  <Icon name="loader" size={15} /> Beregner 3D-dybde for billede {flythroughProgress.current} af {flythroughProgress.total}…
                </div>
              )}

              {flythroughStatus === "error" && <p className="text-xs" style={{ color: AMBER }}>{flythroughError}</p>}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div className="relative rounded-lg overflow-hidden mb-4" style={{ backgroundColor: "#000", aspectRatio: "9/16", maxWidth: 320 }}>
                  {flythroughPrevIndex !== null && (
                    <ParallaxLayer
                      src={flythroughStills[flythroughPrevIndex]}
                      depthCanvas={flythroughDepths[flythroughPrevIndex]}
                      active={false}
                      getProgress={() => 1}
                      path={flythroughParams[flythroughPrevIndex]}
                      fadeMs={1000}
                    />
                  )}
                  <ParallaxLayer
                    key={`shot-${flythroughIndex}`}
                    src={flythroughStills[flythroughIndex]}
                    depthCanvas={flythroughDepths[flythroughIndex]}
                    active={true}
                    getProgress={getFlythroughProgress}
                    path={flythroughParams[flythroughIndex]}
                    fadeMs={1000}
                  />
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <div className="flex items-center gap-4 mb-2">
                  <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs" style={{ color: MUTED }}>
                    <Icon name="rotate" size={12} /> Generér forfra
                  </button>
                </div>
              )}

              {flythroughStatus === "done" && flythroughStills.length > 0 && (
                <p className="text-[10px] mb-4" style={{ color: MUTED }}>
                  Ægte 3D-kamerabevægelse beregnet direkte i din browser ud fra dine billeder — ingen AI-videogenerering, så resultatet er identisk hver gang. Det er endnu ikke en downloadbar videofil, kun en live visning her på siden.
                </p>
              )}

              {flythroughStatus === "error" && flythroughStills.length === 0 && (
                <button onClick={regenerateFlythrough} className="flex items-center gap-1.5 text-xs mt-1" style={{ color: MUTED }}>
                  <Icon name="rotate" size={12} /> Prøv igen
                </button>
              )}
            </div>

<button onClick={() => setStep(scenes.length > 0 ? 3 : 2)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm mt-6" style={{ border: `1px solid ${LINE}`, color: MUTED }}><Icon name="chevronLeft" size={15} /> {scenes.length > 0 ? "Ret manuskript" : "Tilbage til billeder"}</button>
          </section>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Rundvis />);
</script>
</body>
</html>
